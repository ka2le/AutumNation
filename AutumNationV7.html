<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Leaf Yard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: one full-bleed canvas yard; HUD pinned top-left; upgrade cards float beside the thing you tapped. */
:root{
  --paper:#f6ead4; --paper-2:#ecdcbf; --ink:#4a3226; --ink-soft:#7c5d47;
  --accent:#d4672a; --accent-dk:#9e4719; --moss:#5f7232; --grass:#6c7a37;
  --chalk:#2f3a34;
  --font-ui:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  color-scheme: light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--grass);color:var(--ink);font-family:var(--font-ui);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
#c{position:fixed;inset:0;display:block;touch-action:none}
#hud{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:3}
.stat{display:flex;align-items:center;gap:7px;background:rgba(246,234,212,.86);border-radius:999px;padding:3px 13px 3px 7px;box-shadow:0 2px 10px rgba(50,25,8,.18);font-weight:700;font-size:17px;line-height:1.5;font-variant-numeric:tabular-nums;width:max-content;transition:transform .15s}
.stat.cash{pointer-events:auto;cursor:default}
.stat svg{width:20px;height:20px;flex:none}
.stat.bump{transform:scale(1.08)}
.stat.cash{font-size:19px}
#card{position:fixed;z-index:6;width:min(304px,calc(100vw - 24px));background:var(--paper);color:var(--ink);border-radius:16px;padding:12px 14px 8px;box-shadow:0 14px 34px rgba(40,18,4,.38),inset 0 0 0 1.5px rgba(110,74,48,.22);animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.94) translateY(6px);opacity:0}to{transform:none;opacity:1}}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ct{font-family:var(--font-hand);font-weight:700;font-size:30px;line-height:.95;text-wrap:balance}
.cs{font-size:13px;color:var(--ink-soft);line-height:1.35;margin:3px 0 6px}
.live{font-size:13.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.x{border:0;background:transparent;color:var(--ink-soft);font:700 20px/1 var(--font-ui);cursor:pointer;padding:2px 6px;border-radius:8px}
.x:hover{background:var(--paper-2)}
.row{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:1px;align-items:center;padding:9px 0;border-top:1.5px dashed rgba(110,74,48,.22)}
.row .n{font-weight:700;font-size:15px;line-height:1.2;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .d{font-size:12.5px;color:var(--ink-soft);line-height:1.3;min-width:0}
.row .d b{color:var(--ink);font-weight:700}
.row .btn{grid-column:2;grid-row:1 / span 2}
.pips{display:inline-flex;gap:3px}
.pip{width:6px;height:6px;border-radius:50%;background:rgba(110,74,48,.2)}
.pip.on{background:var(--accent)}
.buy{font:700 14px/1 var(--font-ui);border:0;border-radius:10px;padding:8px 11px 7px;background:var(--accent);color:#fff6e8;cursor:pointer;box-shadow:0 2px 0 var(--accent-dk);min-width:68px;font-variant-numeric:tabular-nums}
.buy:hover{filter:brightness(1.06)}
.buy:active{transform:translateY(1px);box-shadow:0 1px 0 var(--accent-dk)}
.buy[aria-disabled="true"]{background:var(--paper-2);color:#93765e;box-shadow:0 2px 0 #d3bf9c;cursor:default}
.buy.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.maxed{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--moss)}
.seg{display:flex;gap:4px;background:var(--paper-2);border-radius:11px;padding:3px;margin:2px 0 8px}
.seg button{flex:1;border:0;background:transparent;font:700 13.5px/1 var(--font-ui);color:var(--ink-soft);padding:8px 6px 7px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(60,30,10,.2)}
.foot{font-size:12px;color:var(--ink-soft);padding:6px 0 2px;border-top:1.5px dashed rgba(110,74,48,.22);display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{border:0;background:none;color:var(--ink-soft);font:600 12px var(--font-ui);text-decoration:underline;cursor:pointer;padding:2px}
.link.danger{color:#a8361d}
.note{font-size:12.5px;color:#a8361d;font-weight:600;min-height:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:10px 18px 9px;border-radius:14px;box-shadow:0 10px 26px rgba(40,18,4,.32);font-family:var(--font-hand);font-weight:700;font-size:24px;line-height:1.1;text-align:center;z-index:7;max-width:calc(100vw - 40px);transition:opacity .6s}
#toast small{display:block;font-family:var(--font-ui);font-size:13px;font-weight:600;color:var(--ink-soft);margin-top:3px}


#card{max-height:calc(100vh - 16px);overflow-y:auto;overscroll-behavior:contain}
.gen{font-size:11.5px;font-weight:600;color:var(--ink-soft);background:var(--paper-2);border-radius:6px;padding:0 6px;line-height:1.6}
.pipgap{width:4px}
.lock{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#a08670}
.buy s{opacity:.6;font-weight:600;margin-right:5px;font-size:12px}
.sect{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-dk);padding:10px 0 2px;border-top:1.5px dashed rgba(110,74,48,.22)}
#recenter{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:4;width:42px;height:42px;border-radius:50%;border:0;background:rgba(246,234,212,.9);color:var(--ink);box-shadow:0 3px 12px rgba(50,25,8,.25);cursor:pointer;display:grid;place-items:center;padding:0}
#recenter svg{width:22px;height:22px}
#recenter:hover{background:var(--paper)}
#c{cursor:grab}

/* sound button and card */
#soundBtn{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:4;width:42px;height:42px;border-radius:50%;border:0;background:rgba(246,234,212,.9);color:var(--ink);box-shadow:0 3px 12px rgba(50,25,8,.25);cursor:pointer;display:grid;place-items:center;padding:0}
#soundBtn svg{width:22px;height:22px}
#soundBtn:hover{background:var(--paper)}
#soundBtn .sx{display:none}
#soundBtn.off{color:#a08670}
#soundBtn.off .sw{display:none}
#soundBtn.off .sx{display:inline}
.tog{font:700 13px/1 var(--font-ui);border:0;border-radius:999px;padding:7px 12px 6px;min-width:54px;background:var(--paper-2);color:#93765e;cursor:pointer;box-shadow:inset 0 0 0 1.5px rgba(110,74,48,.18)}
.tog.on{background:var(--moss);color:#f6ead4;box-shadow:0 2px 0 #46561f}
.row.vol{grid-template-columns:auto 1fr;column-gap:14px}
.row.vol input{width:100%;accent-color:var(--accent);margin:0;cursor:pointer}

/* workshop: two columns once yard-wide upgrades show up */
#card.wide{width:min(640px,calc(100vw - 24px))}
.cols{display:grid;grid-template-columns:1fr 1fr;column-gap:20px;align-items:start}
.col{min-width:0}
.gdone{font-size:12px;padding:6px 0 4px;border-top:1.5px dashed rgba(110,74,48,.22)}
@media (max-width:560px){ .cols{grid-template-columns:1fr} }

/* "upgrade every robot" button under each robot upgrade */
.row .btn{display:flex;flex-direction:column;align-items:stretch;gap:5px}
.buy.all{font-size:12px;padding:5px 9px 4px;background:var(--moss);box-shadow:0 2px 0 #46561f;white-space:nowrap}
.buy.all:active{box-shadow:0 1px 0 #46561f}
.buy.all[aria-disabled="true"]{background:var(--paper-2);color:#93765e;box-shadow:0 2px 0 #d3bf9c}

/* full screen button, top right */
#fsBtn{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:4;width:40px;height:40px;border-radius:50%;border:0;background:rgba(246,234,212,.9);color:var(--ink);box-shadow:0 3px 12px rgba(50,25,8,.25);cursor:pointer;display:grid;place-items:center;padding:0}
#fsBtn svg{width:20px;height:20px}
#fsBtn:hover{background:var(--paper)}
#fsBtn .fs-out{display:none}
#fsBtn.on .fs-in{display:none}
#fsBtn.on .fs-out{display:inline}

/* phones: smaller card text; on a narrow screen the card sits at the bottom like a sheet (placed in game.js) */
@media (max-width:640px), (max-height:500px){
  #card{padding:9px 11px 6px;border-radius:14px}
  .ct{font-size:24px}
  .cs{font-size:11.5px;margin:2px 0 4px}
  .live{font-size:12px}
  .row{padding:6px 0;column-gap:8px}
  .row .n{font-size:13px;gap:6px}
  .row .d{font-size:11px}
  .buy{font-size:12.5px;padding:7px 9px 6px;min-width:58px;border-radius:9px}
  .buy.all{font-size:11px;padding:4px 7px 3px}
  .buy s{font-size:10.5px}
  .sect{font-size:10px;padding:7px 0 1px}
  .gen{font-size:10.5px}
  .foot{font-size:11px}
  .seg button{font-size:12.5px;padding:7px 5px 6px}
  .stat{font-size:15px}
  .stat.cash{font-size:16px}
  #soundBtn,#recenter{width:38px;height:38px}
  #fsBtn{width:36px;height:36px}
}
@media (max-width:640px){
  #card{max-height:62vh}
  .cols{column-gap:14px}
}

/* "unlock more tiers" button, next to a track's level dots (unlocks it for every robot) */
.unlock{font:700 11.5px/1 var(--font-ui);border:1.5px solid #4f7c84;color:#2c5a62;background:#e2ece6;border-radius:999px;padding:4px 9px 3px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.unlock:hover{background:#d3e4dd}
.unlock[aria-disabled="true"]{border-color:#c9b799;color:#a08670;background:transparent;cursor:default}
.unlock.shake{animation:shake .3s}
@media (max-width:640px), (max-height:500px){ .unlock{font-size:10.5px;padding:3px 7px 2px} }
</style>
</head>
<body>
<canvas id="c" aria-label="Leaf Yard game area"></canvas>

<div id="hud" aria-live="polite">
  <div class="stat cash" id="hCash" title="Cash">
    <svg viewBox="-12 -12 24 24" aria-hidden="true"><circle r="10" fill="#c9922c"/><circle r="8.2" fill="#e8b84e"/><circle r="5.6" fill="none" stroke="#c9922c" stroke-width="1.3"/><path d="M-4.5,-3.5 A5.6,5.6 0 0 1 1,-5.4" stroke="#fbe3a0" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
    <span id="vCash">$0.00</span>
  </div>
</div>

<div id="card" hidden role="dialog" aria-modal="false"></div>
<div id="toast" hidden></div>
<button id="soundBtn" hidden aria-label="Sound settings" title="Sound"><svg viewBox="-12 -12 24 24" aria-hidden="true"><path d="M-8.5,-3.2 H-4.5 L0.5,-7.5 V7.5 L-4.5,3.2 H-8.5 Z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><g class="sw" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3.8,-3.6 A5,5 0 0 1 3.8,3.6"/><path d="M6.4,-7 A9.6,9.6 0 0 1 6.4,7"/></g><g class="sx" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4.2,-3.4 L10,3.4 M10,-3.4 L4.2,3.4"/></g></svg></button>
<button id="fsBtn" hidden aria-label="Full screen" title="Full screen (F)"><svg viewBox="-12 -12 24 24" aria-hidden="true"><g class="fs-in" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-8,-3 V-8 H-3 M3,-8 H8 V-3 M8,3 V8 H3 M-3,8 H-8 V3"/></g><g class="fs-out" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-8,-3 H-3 V-8 M3,-8 V-3 H8 M8,3 H3 V8 M-3,8 V3 H-8"/></g></svg></button>
<button id="recenter" hidden aria-label="Back to the yard" title="Back to the yard (Home)"><svg viewBox="-12 -12 24 24" aria-hidden="true"><circle r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><circle r="2" fill="currentColor"/><path d="M0,-11 V-7 M0,7 V11 M-11,0 H-7 M7,0 H11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>

<script>
// Leaf Yard soundscape. Every sound is synthesized live with the Web Audio API, so there are no audio files.
// Three layers, each with its own switch in the sound card:
//   amb   - wind and rustling leaves (the main bed), robots picking up and dumping leaves, the truck
//   sfx   - mellow robot beeps, little chimes when you buy things, metal clinks
//   music - a slow, quiet waltz that comes and goes, with long leaf-only pauses in between
// The game talks to it through window.LeafSound. Nothing makes a sound until the first tap or key press unlocks audio.
(() => {
'use strict';

// v2: "Leaves & wind" (amb) is off by default. Older v1 prefs carry over, except amb starts off again.
const PREF_KEY = 'leaf-yard-sound-v2', OLD_PREF_KEY = 'leaf-yard-sound-v1';
const prefs = { on: true, vol: 0.7, amb: false, sfx: true, music: true };
try {
  let p = JSON.parse(localStorage.getItem(PREF_KEY) || 'null');
  if (!p){ p = JSON.parse(localStorage.getItem(OLD_PREF_KEY) || 'null'); if (p) p.amb = false; }
  if (p) for (const k in prefs) if (k in p && typeof p[k] === typeof prefs[k]) prefs[k] = p[k];
} catch (e) {}
const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {} };

const AC = window.AudioContext || window.webkitAudioContext;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

// How loud each layer sits in the mix (before the player's volume).
const BUS_LEVEL = { amb: 2.0, sfx: 0.55, music: 0.24 };

let ctx = null, master = null, wobble = null, noiseBuf = null;
const bus = {};
let rustleBufs = [];
let windLP, windGain, airBP, airGain;
const listeners = new Set();
const changed = () => { for (const f of listeners) try { f(prefs); } catch (e) {} };

// ───────────────────────── setup
function filt(type, freq, q){ const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; if (q != null) f.Q.value = q; return f; }
function gainNode(v){ const g = ctx.createGain(); g.gain.value = v; return g; }
function panInto(node, pan, dest){
  if (ctx.createStereoPanner){ const p = ctx.createStereoPanner(); p.pan.value = clamp(pan || 0, -1, 1); node.connect(p); p.connect(dest); return p; }
  node.connect(dest); return null;
}

function makeNoise(sec){
  const n = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

// A soft room: decaying, darkened noise used as a reverb impulse.
function makeIR(sec){
  const sr = ctx.sampleRate, n = Math.floor(sr * sec), b = ctx.createBuffer(2, n, sr);
  for (let ch = 0; ch < 2; ch++){
    const d = b.getChannelData(ch); let lp = 0;
    for (let i = 0; i < n; i++){
      lp += (Math.random() * 2 - 1 - lp) * 0.22;
      d[i] = lp * Math.pow(1 - i / n, 3.2) * Math.min(1, i / (sr * 0.012));
    }
  }
  return b;
}

// One "rustle": a hiss full of tiny clicks, which is what dry leaves sound like up close.
// shape 0 = swell, 1 = quick crunch then trail off, 2 = slow drag
function makeRustle(dur, density, shape){
  const sr = ctx.sampleRate, n = Math.floor(dur * sr), b = ctx.createBuffer(1, n, sr), d = b.getChannelData(0);
  const env = new Float32Array(n);
  for (let t = 0; ;){
    t += Math.max(1, Math.floor(-Math.log(1 - Math.random()) * sr / density));
    if (t >= n) break;
    const p = t / n, busy = shape === 1 ? Math.pow(1 - p, 1.5) : Math.sin(Math.PI * p);
    if (Math.random() > 0.25 + 0.75 * busy) continue;
    const a = Math.pow(Math.random(), 2.3), tau = rnd(0.0007, 0.0045) * sr, len = Math.min(n - t, Math.floor(tau * 6));
    for (let i = 0; i < len; i++) env[t + i] += a * Math.exp(-i / tau);
  }
  let sum = 0;
  for (let i = 0; i < n; i++){
    const p = i / n;
    const sh = shape === 1 ? Math.min(1, p * 25) * Math.pow(1 - p, 1.8) : shape === 2 ? Math.pow(Math.sin(Math.PI * p), 0.6) : Math.pow(Math.sin(Math.PI * p), 1.4);
    d[i] = (Math.random() * 2 - 1) * (0.05 + env[i]) * sh;
    sum += d[i] * d[i];
  }
  const k = 0.2 / (Math.sqrt(sum / n) || 1);
  for (let i = 0; i < n; i++) d[i] = Math.tanh(d[i] * k * 1.2);
  return b;
}

function init(given){
  ctx = given || new AC();
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 14; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.3;
  const tone = filt('lowpass', 8500, 0.5);                // nothing harsh up top
  master = gainNode(0);
  master.connect(tone); tone.connect(comp); comp.connect(ctx.destination);

  const verb = ctx.createConvolver(); verb.buffer = makeIR(2.8);
  const verbOut = gainNode(0.55); verb.connect(verbOut); verbOut.connect(master);
  // a soft echo for the beeps
  const dl = ctx.createDelay(1); dl.delayTime.value = 0.31;
  const fb = gainNode(0.26), elp = filt('lowpass', 1500, 0.4), echoOut = gainNode(0.7);
  dl.connect(elp); elp.connect(fb); fb.connect(dl); elp.connect(echoOut); echoOut.connect(master);

  const WET = { amb: 0.12, sfx: 0.32, music: 0.5 };
  for (const k of ['amb', 'sfx', 'music']){
    const g = gainNode(prefs[k] ? BUS_LEVEL[k] : 0);
    g.connect(master);
    const w = gainNode(WET[k]); g.connect(w); w.connect(verb);
    if (k === 'sfx'){ const e = gainNode(0.22); g.connect(e); e.connect(dl); }
    bus[k] = g;
  }

  // slow, tiny pitch drift on the music, like an old tape
  wobble = gainNode(5);
  const lfo = ctx.createOscillator(); lfo.frequency.value = 0.37; lfo.connect(wobble); lfo.start();

  noiseBuf = makeNoise(3);
  rustleBufs = [];
  for (let i = 0; i < 10; i++) rustleBufs.push(makeRustle(rnd(0.35, 1.5), rnd(50, 260), i % 3));

  // the wind bed: looped noise, darker when calm, a little brighter in gusts
  const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  windLP = filt('lowpass', 300, 0.3); windGain = gainNode(0);
  airBP = filt('bandpass', 1400, 0.45); airGain = gainNode(0);
  src.connect(windLP); windLP.connect(windGain); windGain.connect(bus.amb);
  src.connect(airBP); airBP.connect(airGain); airGain.connect(bus.amb);
  src.start();

  mus.t = 0; mus.plan = []; mus.idx = 0; mus.cycle = 0;
}

let pumpTimer = 0;
function unlock(){
  if (!AC) return;
  if (!ctx){
    try { init(); } catch (e) { console.warn('[sound] could not start audio', e); ctx = null; return; }
    // fade in gently instead of starting at full volume
    master.gain.setValueAtTime(0, ctx.currentTime);
    master.gain.setTargetAtTime(level(), ctx.currentTime + 0.1, 0.9);
    pumpTimer = setInterval(() => { if (ctx && ctx.state === 'running' && prefs.on) musicPump(1.4); }, 200);
    // prime iOS with a silent blip inside the gesture
    try { const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, ctx.sampleRate); s.connect(ctx.destination); s.start(); } catch (e) {}
    changed();
  }
  if (prefs.on && ctx.state !== 'running' && !document.hidden) ctx.resume().catch(() => {});
}

const level = () => prefs.on ? prefs.vol * prefs.vol * 1.5 : 0;
function applyMaster(tau){
  if (!ctx) return;
  master.gain.cancelScheduledValues(ctx.currentTime);
  master.gain.setTargetAtTime(level(), ctx.currentTime, tau == null ? 0.08 : tau);
}
let suspendTimer = 0;
function setPref(k, v){
  if (!(k in prefs)) return;
  prefs[k] = v; savePrefs();
  if (ctx){
    if (k === 'on' || k === 'vol') applyMaster();
    if (k === 'on'){
      clearTimeout(suspendTimer);
      if (v) ctx.resume().catch(() => {});
      else suspendTimer = setTimeout(() => { if (!prefs.on && ctx) ctx.suspend().catch(() => {}); }, 500);
    }
    if (k in bus) bus[k].gain.setTargetAtTime(v ? BUS_LEVEL[k] : 0, ctx.currentTime, 0.25);
    if (k === 'music' && v) mus.t = 0;   // start again from where the scheduler is now
  }
  changed();
}

document.addEventListener('visibilitychange', () => {
  if (!ctx) return;
  if (document.hidden) ctx.suspend().catch(() => {});
  else if (prefs.on) ctx.resume().catch(() => {});
});

const live = () => ctx && ctx.state === 'running' && prefs.on;
const gates = {};
function gate(key, gap){ const n = ctx.currentTime; if (n - (gates[key] ?? -99) < gap) return false; gates[key] = n; return true; }

// ───────────────────────── leaves & wind
function rustle(o, t){
  const src = ctx.createBufferSource(); src.buffer = o.buf || pick(rustleBufs);
  src.playbackRate.value = o.rate || rnd(0.75, 1.2);
  const hp = filt('highpass', o.hp || rnd(550, 1100), 0.5);
  const lp = filt('lowpass', o.bright || rnd(2800, 5200), 0.4);
  const g = gainNode(o.vol);
  src.connect(hp); hp.connect(lp); lp.connect(g);
  panInto(g, o.pan, bus[o.bus || 'amb']);
  src.start(t + (o.delay || 0));
}

// called every frame with the game's wind (roughly -50..50)
function ambStep(dt, wind, t){
  const w = clamp(Math.abs(wind) / 42, 0, 1);
  windLP.frequency.setTargetAtTime(240 + 650 * w, t, 0.6);
  windGain.gain.setTargetAtTime(0.06 + 0.2 * w * w, t, 0.7);
  airGain.gain.setTargetAtTime(0.006 + 0.035 * w * w, t, 0.9);
  if (!prefs.amb) return;
  // a gentle trickle of rustles, more when the wind picks up
  if (Math.random() < (1.6 + 4 * w * w) * dt) rustle({ vol: rnd(0.05, 0.12) * (0.7 + 0.8 * w), pan: rnd(-0.85, 0.85) }, t);
  // now and then a little pile shifts
  if (Math.random() < 0.04 * (1 + 3 * w) * dt){ const p = rnd(-0.7, 0.7), n = 2 + (Math.random() * 3 | 0); for (let i = 0; i < n; i++) rustle({ delay: rnd(0, 0.6), vol: rnd(0.04, 0.09), pan: p + rnd(-0.15, 0.15) }, t); }
}

// ───────────────────────── small instruments
function pluck(midi, t, vol, len, dest, bright){
  const f = mtof(midi), dec = clamp(0.45 + len * 0.55, 0.45, 2.4);
  const lp = filt('lowpass', bright || 3000, 0.5);
  const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.007); g.gain.setTargetAtTime(0, t + 0.01, dec / 3.5);
  const g2 = ctx.createGain(); g2.gain.setValueAtTime(0, t); g2.gain.linearRampToValueAtTime(vol * 0.28, t + 0.004); g2.gain.setTargetAtTime(0, t + 0.006, dec / 14);
  const o1 = ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = f;
  const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 3.01;   // a bright tine on the attack
  o1.connect(g); o2.connect(g2); g.connect(lp); g2.connect(lp); lp.connect(dest);
  wobble.connect(o1.detune); wobble.connect(o2.detune);
  const end = t + dec * 1.7;
  o1.start(t); o2.start(t); o1.stop(end); o2.stop(end);
  o1.onended = () => { try { wobble.disconnect(o1.detune); wobble.disconnect(o2.detune); } catch (e) {} };
}

function pad(notes, t, dur, vol){
  const lp = filt('lowpass', 750, 0.3);
  const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + Math.min(1, dur * 0.4)); g.gain.setTargetAtTime(0, t + dur, 0.55);
  lp.connect(g); g.connect(bus.music);
  const end = t + dur + 3;
  const oscs = [];
  for (const m of notes) for (const dt of [-7, 7]){
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = mtof(m); o.detune.value = dt;
    o.connect(lp); o.start(t); o.stop(end); oscs.push(o);
  }
}

function bassNote(midi, t, dur, vol){
  const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.03); g.gain.setTargetAtTime(vol * 0.5, t + 0.05, 0.4); g.gain.setTargetAtTime(0, t + dur, 0.2);
  const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = mtof(midi);
  const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = mtof(midi + 12);
  const g2 = gainNode(0.3);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(bus.music);
  o.start(t); o2.start(t); o.stop(t + dur + 1.2); o2.stop(t + dur + 1.2);
}

// ───────────────────────── robots
// Each robot has its own little voice. Bases are MIDI notes; everything is lowpassed so it stays soft.
const VOICES = [
  { base: 76, type: 'sine',     lp: 2400, gain: 1.0 },                 // Tinker: a squeaky old friend
  { base: 81, type: 'sine',     lp: 2800, gain: 0.85, fast: true },    // Pip: quick and high
  { base: 67, type: 'triangle', lp: 1500, gain: 1.0, slow: true },     // Clunk: low and steady
  { base: 72, type: 'triangle', lp: 1900, gain: 0.95, rough: true },   // Rivet: a bit wonky
  { base: 79, type: 'sine',     lp: 2600, gain: 0.9, vib: true },      // Juniper: round, with a little vibrato
  { base: 62, type: 'triangle', lp: 1300, gain: 1.0, slow: true, vib: true }, // blowers: a low, hoomy trumpet
  { base: 86, type: 'square',   lp: 2200, gain: 0.5, fast: true },     // shakers: tiny clicky crab chirps
  { base: 84, type: 'sine',     lp: 3600, gain: 0.75, vib: true },     // Sterling (robot 6): crisp, clear and a touch posh
];
// notes: [semitone, seconds, glide-to semitone?]
const MOODS = {
  chat(){ const n = 2 + (Math.random() < 0.45 ? 1 : 0), out = []; let s = pick([0, 2, 4, 7]); for (let i = 0; i < n; i++){ out.push([s, rnd(0.06, 0.11)]); s = pick([0, 2, 4, 7, 9].filter(x => x !== s)); } if (Math.random() < 0.4) out[out.length - 1][2] = out[out.length - 1][0] + pick([2, -2, 3]); return out; },
  happy: () => [[0, 0.07], [4, 0.07], [7, 0.14, 9]],
  hmm:   () => [[4, 0.13], [0, 0.2, -3]],
  ok:    () => [[7, 0.07], [12, 0.1]],
  sleepy: () => [[2, 0.2, -2]],
  proud: () => [[0, 0.06], [4, 0.06], [7, 0.06], [12, 0.2, 14]],
  hello: () => [[7, 0.09], [4, 0.08], [12, 0.24, 12.6]],
};
function beepAt(ri, mood, pan, vol, t){
  const v = VOICES[((ri | 0) % VOICES.length + VOICES.length) % VOICES.length], notes = (MOODS[mood] || MOODS.chat)();
  const sp = v.fast ? 0.8 : v.slow ? 1.25 : 1;
  const o = ctx.createOscillator(); o.type = v.type;
  const lp = filt('lowpass', v.lp, 0.7), g = ctx.createGain(); g.gain.setValueAtTime(0, t);
  o.connect(lp); lp.connect(g); panInto(g, pan, bus.sfx);
  let vib = null;
  if (v.vib || v.rough){ vib = ctx.createOscillator(); vib.frequency.value = v.vib ? 6.5 : 13; const vg = gainNode(v.vib ? 22 : 14); vib.connect(vg); vg.connect(o.detune); vib.start(t); }
  const peak = 0.1 * (vol == null ? 1 : vol) * v.gain;
  let tt = t;
  o.frequency.setValueAtTime(mtof(v.base + notes[0][0]), t);
  for (const [s, d0, gl] of notes){
    const d = d0 * sp;
    o.frequency.setTargetAtTime(mtof(v.base + s), tt, 0.009);
    if (gl != null) o.frequency.setTargetAtTime(mtof(v.base + gl), tt + d * 0.35, d * 0.45);
    g.gain.setTargetAtTime(peak, tt, 0.007);
    g.gain.setTargetAtTime(0, tt + d, 0.02);
    tt += d + 0.035 * sp;
  }
  o.start(t); o.stop(tt + 0.3); if (vib) vib.stop(tt + 0.3);
}

function tinkAt(pan, vol, t){
  const f = rnd(1750, 2250);
  for (const [k, a, tau] of [[1, 1, 0.07], [2.76, 0.45, 0.035]]){
    const o = ctx.createOscillator(); o.frequency.value = f * k;
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.045 * vol * a, t + 0.002); g.gain.setTargetAtTime(0, t + 0.003, tau);
    o.connect(g); panInto(g, pan, bus.sfx); o.start(t); o.stop(t + 0.5);
  }
}

// a soft putter for the compost truck: low noise pulsed about eleven times a second
function rumble(t, dur, panFrom, panTo, vol){
  const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true; src.loopStart = rnd(0, 2);
  const lp = filt('lowpass', 260, 1.1), am = gainNode(0.55), env = ctx.createGain();
  const lfo = ctx.createOscillator(); lfo.frequency.value = rnd(10, 12.5); const lg = gainNode(0.45); lfo.connect(lg); lg.connect(am.gain);
  env.gain.setValueAtTime(0, t); env.gain.linearRampToValueAtTime(vol, t + Math.min(0.7, dur * 0.3)); env.gain.setValueAtTime(vol, t + dur * 0.6); env.gain.linearRampToValueAtTime(0, t + dur);
  src.connect(lp); lp.connect(am); am.connect(env);
  const p = panInto(env, panFrom, bus.amb);
  if (p){ p.pan.setValueAtTime(clamp(panFrom, -1, 1), t); p.pan.linearRampToValueAtTime(clamp(panTo, -1, 1), t + dur); }
  src.start(t); lfo.start(t); src.stop(t + dur + 0.1); lfo.stop(t + dur + 0.1);
}

function hornAt(pan, t){
  for (let i = 0; i < 2; i++){
    const s = t + i * 0.24, g = ctx.createGain(), lp = filt('lowpass', 1100, 0.6);
    g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(0.06, s + 0.025); g.gain.setValueAtTime(0.06, s + 0.12); g.gain.linearRampToValueAtTime(0, s + 0.17);
    for (const m of [67, 71]){ const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = mtof(m); o.connect(lp); o.start(s); o.stop(s + 0.2); }
    lp.connect(g); panInto(g, pan, bus.sfx);
  }
}

// ───────────────────────── music: a slow waltz in F that comes and goes
const BEAT = 60 / 78, BAR = BEAT * 3;
const CHORDS = {
  F:  { pad: [53, 57, 60, 64], root: 41 },
  Am: { pad: [57, 60, 64, 67], root: 45 },
  Bb: { pad: [58, 62, 65, 69], root: 46 },
  Dm: { pad: [50, 57, 60, 65], root: 38 },
  Gm: { pad: [55, 58, 62, 65], root: 43 },
  C:  { pad: [48, 55, 58, 64], root: 36 },
};
// [bar, beat, midi, beats]
const TUNE_A = [
  [0, 0, 72, 2], [0, 2, 69, 1],
  [1, 0, 76, 2], [1, 2, 72, 1],
  [2, 0, 74, 1.5], [2, 1.5, 72, 0.5], [2, 2, 70, 1],
  [3, 0, 69, 3],
  [4, 0, 74, 2], [4, 2, 77, 1],
  [5, 0, 74, 1], [5, 1, 72, 1], [5, 2, 70, 1],
  [6, 0, 69, 1.5], [6, 1.5, 70, 0.5], [6, 2, 67, 1],
  [7, 0, 67, 1.5], [7, 1.5, 69, 0.5], [7, 2, 70, 1],
];
const CH_A = ['F', 'Am', 'Bb', 'F', 'Dm', 'Bb', 'Gm', 'C'];
const TUNE_B = [
  [0, 0, 77, 2], [0, 2, 72, 1],
  [1, 0, 76, 1], [1, 1, 74, 1], [1, 2, 72, 1],
  [2, 0, 74, 2], [2, 2, 77, 1],
  [3, 0, 72, 3],
  [4, 0, 69, 1], [4, 1, 74, 1], [4, 2, 77, 1],
  [5, 0, 77, 1.5], [5, 1.5, 76, 0.5], [5, 2, 74, 1],
  [6, 0, 67, 1], [6, 1, 72, 1], [6, 2, 76, 1],
  [7, 0, 77, 3],
];
const CH_B = ['F', 'Am', 'Bb', 'F', 'Dm', 'Bb', 'C', 'F'];

const mus = { t: 0, plan: [], idx: 0, cycle: 0 };
function phrase(chords, tune, o){
  return chords.map((c, i) => ({ chord: c, mel: tune ? tune.filter(n => n[0] === i).map(n => [n[1], n[2], n[3]]) : [], pad: true, bass: o.bass, oom: o.oom, oct: o.oct || 0, vel: o.vel || 1 }));
}
function buildPlan(cycle){
  const bars = [];
  const rest = n => { for (let i = 0; i < n; i++) bars.push({ rest: true }); };
  rest(cycle === 0 ? 4 : 0);
  // a soft way in
  bars.push(...phrase(['F', 'Bb', 'F', 'C'], null, { bass: true, oom: false }));
  const musicBox = cycle > 0 && Math.random() < 0.4;   // sometimes the tune comes back an octave up, sparser
  const o = musicBox ? { bass: false, oom: false, oct: 12, vel: 0.75 } : { bass: true, oom: true };
  bars.push(...phrase(CH_A, TUNE_A, o));
  bars.push(...phrase(CH_B, TUNE_B, o));
  if (Math.random() < 0.5) bars.push(...phrase(CH_B, TUNE_B, { bass: true, oom: false, oct: musicBox ? 0 : 12, vel: 0.7 }));
  // drift out, then a long stretch of just leaves and wind
  bars.push(...phrase(['Bb', 'F'], null, { bass: true, oom: false }));
  rest(Math.round(rnd(20, 50) / BAR));
  return bars;
}
function playBar(b, t){
  if (b.rest) return;
  const c = CHORDS[b.chord];
  if (b.pad) pad(c.pad, t, BAR + 0.15, 0.022);
  if (b.bass) bassNote(c.root, t, BAR * 0.9, 0.07);
  if (b.oom){ const top = c.pad.slice(-2); for (const k of [1, 2]) for (const m of top) pluck(m, t + k * BEAT, 0.03, 0.6, bus.music, 1800); }
  for (const [beat, m, d] of b.mel) pluck(m + b.oct, t + beat * BEAT + rnd(-0.006, 0.012), (0.12 + rnd(-0.015, 0.015)) * b.vel, d * BEAT, bus.music, b.oct ? 3800 : 3000);
}
function musicPump(horizon, now){
  if (!prefs.music) return;
  now = now == null ? ctx.currentTime : now;
  if (mus.t < now) mus.t = now + 0.2;
  while (mus.t < now + horizon){
    if (mus.idx >= mus.plan.length){ mus.plan = buildPlan(mus.cycle++); mus.idx = 0; }
    playBar(mus.plan[mus.idx++], mus.t);
    mus.t += BAR;
  }
}

// ───────────────────────── public API (positions come in as pan -1..1 and a 0..1 loudness)
const api = {
  prefs,
  get ready(){ return !!ctx; },
  unlock,
  set: setPref,
  toggle(k){ setPref(k, !prefs[k]); },
  onChange(f){ listeners.add(f); },

  update(dt, wind){ if (live()) ambStep(dt, wind, ctx.currentTime); },

  // a robot's arm closes on some leaves
  grab(n, pan, vol){ if (!live() || !prefs.amb || !gate('grab', 0.08)) return; rustle({ buf: rustleBufs[1 + 3 * (Math.random() * 3 | 0)], rate: rnd(1.1, 1.45), vol: (0.07 + 0.015 * Math.min(n, 6)) * vol, pan, bright: rnd(3500, 5500) }, ctx.currentTime); },
  // leaves tip into the bin
  dump(n, pan, vol){ if (!live() || !prefs.amb || !gate('dump', 0.12)) return; const t = ctx.currentTime; const k = Math.min(3, 1 + Math.floor(n / 4)); for (let i = 0; i < k; i++) rustle({ delay: i * 0.07, rate: rnd(0.8, 1.05), vol: (0.09 + 0.01 * Math.min(n, 8)) * vol, pan: pan + rnd(-0.08, 0.08), bright: rnd(2600, 4200) }, t); },
  // your tap pushes the leaves around
  kick(n, pan){ if (!live() || !prefs.amb || !gate('kick', 0.05)) return; const t = ctx.currentTime; rustle({ rate: rnd(1.0, 1.3), vol: n ? clamp(0.08 + n * 0.012, 0.08, 0.2) : 0.05, pan, bright: n ? rnd(3800, 5600) : 2600 }, t); if (n > 6) rustle({ delay: 0.05, vol: 0.08, pan: pan + 0.1 }, t); },
  // a robot says something
  beep(ri, mood, pan, vol, force){
    if (!live() || !prefs.sfx) return;
    if (!force && !gate('chatter', 7)) return;
    if (force && !gate('beep' + mood + ri, 0.25)) return;
    beepAt(ri, mood, pan || 0, vol, ctx.currentTime + 0.02);
  },
  tink(pan, vol){ if (!live() || !prefs.sfx || !gate('tink', 0.14)) return; tinkAt(pan, vol, ctx.currentTime); },
  clink(n, pan, vol){ if (!live() || !prefs.sfx || !gate('clink', 0.2)) return; for (let i = 0; i < Math.min(n, 4); i++) tinkAt(pan + rnd(-0.1, 0.1), vol * 0.8, ctx.currentTime + i * 0.06); },
  // paper rustle when a card opens
  paper(){ if (!live() || !prefs.sfx || !gate('paper', 0.1)) return; rustle({ buf: rustleBufs[2], rate: rnd(1.4, 1.7), vol: 0.05, pan: 0, bright: 6000, hp: 1500, bus: 'sfx' }, ctx.currentTime); },
  deny(){ if (!live() || !prefs.sfx || !gate('deny', 0.15)) return; beepAt(2, 'hmm', 0, 0.6, ctx.currentTime); },

  truckIn(pan, dur){ if (!live() || !prefs.amb) return; rumble(ctx.currentTime, dur || 2.6, 0.95, pan, 0.5); },
  truckOut(pan){ if (!live() || !prefs.amb) return; rumble(ctx.currentTime, 2.4, pan, -1, 0.5); },
  horn(pan){ if (!live() || !prefs.sfx || !gate('horn', 3)) return; hornAt(pan, ctx.currentTime + 0.05); },
  // the bin is tipped into the truck
  pour(leaves, metal, pan){
    if (!live()) return;
    const t = ctx.currentTime;
    if (prefs.amb && leaves > 0){ const n = clamp(Math.round(2 + leaves / 6), 2, 10); for (let i = 0; i < n; i++) rustle({ delay: 0.45 + i * rnd(0.09, 0.16), rate: rnd(0.75, 1.1), vol: rnd(0.08, 0.13), pan: pan + rnd(-0.15, 0.15), bright: rnd(2500, 4200) }, t); }
    if (prefs.sfx && metal > 0) for (let i = 0; i < Math.min(metal, 6); i++) tinkAt(pan + rnd(-0.1, 0.1), 0.7, t + 0.55 + i * 0.09);
  },
  // the truck pays: a small music-box arpeggio, longer for bigger loads
  coins(amount){
    if (!live() || !prefs.sfx || !gate('coins', 0.4)) return;
    const n = clamp(2 + Math.round(Math.log10(1 + amount)), 3, 6), notes = [77, 81, 84, 86, 89, 93], t = ctx.currentTime + 0.05;
    for (let i = 0; i < n; i++) pluck(notes[i], t + i * 0.085, 0.07, 0.5, bus.sfx, 4200);
  },
  // purchases
  chime(kind){
    if (!live() || !prefs.sfx || !gate('chime', 0.08)) return;
    const t = ctx.currentTime + 0.02;
    if (kind === 'land'){
      pad([53, 60, 64, 67, 69], t, 2.6, 0.03);
      [65, 69, 72, 76, 77, 81].forEach((m, i) => pluck(m, t + 0.2 + i * 0.13, 0.08, 1, bus.sfx, 3800));
    } else if (kind === 'tech'){
      [72, 76, 79, 84, 88].forEach((m, i) => pluck(m, t + i * 0.07, 0.065, 0.6, bus.sfx, 4500));
    } else if (kind === 'sale'){
      pluck(81, t, 0.07, 1, bus.sfx, 4000); pluck(77, t + 0.18, 0.07, 1.4, bus.sfx, 4000);
    } else {
      pluck(79, t, 0.06, 0.5, bus.sfx, 4000); pluck(84, t + 0.08, 0.06, 0.8, bus.sfx, 4000);
    }
  },

  // test hook: render into an OfflineAudioContext
  _test: {
    init(c){ init(c); master.gain.value = level(); },
    ambStep, beepAt, musicPump, tinkAt, rumble, hornAt, pluck,
    api: () => api,
    force(){ return { ctx, bus }; },
  },
};
window.LeafSound = api;
})();
</script>
<script>
// Leaf Yard — game logic and rendering.
// Dev URL options: ?fresh (play without loading or saving)  ?speed=4 (fast-forward, 0.25–20)
(() => {
'use strict';
// ───────────────────────── utils
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
function mulberry(s){ return function(){ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function cellRnd(i, j, salt){ return mulberry(((i*73856093) ^ (j*19349663) ^ (salt*83492791)) >>> 0); }
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function ell(c,x,y,rx,ry){ c.beginPath(); c.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),0,0,TAU); }
function money(v){ if (v < 0.1) return '$' + v.toFixed(3); if (v < 10000) return '$' + v.toFixed(2); return '$' + Math.round(v).toLocaleString('en-US'); }
function cash2(v){ return '$' + (v < 10000 ? v.toFixed(2) : Math.round(v).toLocaleString('en-US')); }
function niceCost(v){ if (v < 1) return Math.round(v*20)/20; if (v < 20) return Math.round(v*4)/4; return Math.round(v); }
function mmss(s){ s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function shade(hex, k){ const n = parseInt(hex.slice(1), 16); const r = clamp(Math.round((n>>16)*k),0,255), g = clamp(Math.round((n>>8&255)*k),0,255), b = clamp(Math.round((n&255)*k),0,255); return 'rgb('+r+','+g+','+b+')'; }
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;

const PARAMS = new URLSearchParams(location.search);
const TIME_SCALE = clamp(+PARAMS.get('speed') || 1, 0.25, 20);
const FRESH = PARAMS.has('fresh');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function trackCap(k){
  let n = 0;
  for (const g of TRACKS[k].gens){ if (g.tech && !S.tech[g.tech]) break; if (g.needsMetal && !S.metalSlot) break; n += g.n; }
  return n;
}
const trackMax = k => TRACKS[k].vals.length - 1;
function trackVisible(k){ if (k === 'snip') return S.hive.built; if (k === 'grab') return !!S.tech.claw; if (k === 'reach') return !!S.tech.arm; if (k === 'drill' || k === 'magnet') return S.metalSlot; return true; }
function genAt(k, level){ let acc = 0; const gens = TRACKS[k].gens; for (let gi=0; gi<gens.length; gi++){ const g = gens[gi]; if (level < acc + g.n) return { gi, g, idx: level - acc }; acc += g.n; } return null; }
function genNameAt(k, level){ let acc = 0, name = TRACKS[k].gens[0].name; for (const g of TRACKS[k].gens){ if (g.n > 0 && level > acc) name = g.name; acc += g.n; } return name; }
// robots of every kind: 'robot' (the regular yard bots), 'blower' and 'shaker'
const KIND_LIST = { robot:'robots', blower:'blowers', shaker:'shakers' };
const cfgsOf = kind => S[KIND_LIST[kind]];
// everyone who has track k: Wheels are on every robot of every kind, the rest only on one kind
function peersFor(k){ if (k === 'speed') return [...S.robots, ...S.blowers, ...S.shakers]; if (k === 'blow') return S.blowers; if (k === 'shake' || k === 'snip') return S.shakers; return S.robots; }
function botCost(kind, i, k){
  const me = cfgsOf(kind)[i], L = me.lv[k], ge = genAt(k, L);
  if (!ge) return null;
  const full = ge.g.cost[ge.idx];
  const disc = peersFor(k).some(c => c !== me && c.lv[k] > L);
  return { cost: disc ? niceCost(full*discFor(k)) : full, full, disc };
}
const rCost = (ri, k) => botCost('robot', ri, k);
const botCount = () => S.robots.length + S.blowers.length + S.shakers.length;
// what a level another robot already has costs, as a share of the full price
function discFor(k){ let d = DISCOUNT; if (gl('blueprint')) d = 0.3; if (k === 'carry' && gl('basket')) d = 0.1; return d; }
const robotCost = n => niceCost(ROBOT_COST[n]*(gl('bulk') ? 0.75 : 1));
// "Upgrade all" on a track: first it brings every robot up to the best robot's level (all copied, so all discounted);
// once they match, it adds one level to everyone: one at full price, the rest at the copied-level price.
function allPlan(k){
  const peers = peersFor(k), n = peers.length;
  if (n < 2 || !trackVisible(k)) return null;
  const lv = peers.map(r => r.lv[k]), top = Math.max(...lv), cap = trackCap(k);
  const price = (L, disc) => { const ge = genAt(k, L); if (!ge) return null; const f = ge.g.cost[ge.idx]; return disc ? niceCost(f*discFor(k)) : f; };
  let cost = 0, full = 0, target;
  if (lv.some(l => l < top)){
    target = top;
    for (const l of lv) for (let L=l; L<top; L++){ cost += price(L, true); full += price(L, false); }
  } else {
    if (top >= cap || top >= trackMax(k)) return null;
    target = top + 1;
    const f = price(top, false); cost = f + (n - 1)*price(top, true); full = f*n;
  }
  const behind = lv.filter(l => l < target).length;
  return { cost: Math.round(cost*100)/100, full, target, catchUp: target === top, behind };
}
// the first locked tier of a track, if it can be unlocked yet (prerequisites met and its price in sight)
function nextUnlock(k){ for (const g of TRACKS[k].gens){ if (!g.tech) continue; if (!S.tech[g.tech]) return techAvailable(g.tech) ? g.tech : null; } return null; }
// claw and reach rows show up on the robot card once their first unlock is in sight
const rowShown = k => trackVisible(k) || ((k === 'grab' || k === 'reach') && nextUnlock(k));
function techAvailable(id){ const t = TECH[id]; if (S.tech[id]) return false; if (t.needs && !S.tech[t.needs]) return false; if (t.needsMiner && !S.miners.length) return false; if (t.needsKind && !S[t.needsKind].length) return false; return ALWAYS_SHOWN.includes(id) || seenPrice(t.cost); }
// Unlocks stay hidden until you've once held a quarter of their price (S.peak is the most cash you've ever had).
const ALWAYS_SHOWN = ['treads', 'hamper', 'servos'];
const seenPrice = cost => (S.peak || 0) >= cost*0.25;

    flyTo('leaf', l.x, l.y, r.x - r.face*8, r.y - 38, (r.pickDur || 0.5)*0.45 + 0.08 + Math.random()*0.1, 16, { ci:l.ci, sh:l.sh, s:l.s*0.75 });
  }
  for (const l of r.plan || []) if (l.claim === r) l.claim = null;
  r.plan = null;   // the fingers stay drawn while the arm pulls back
  if (got.length){ const a = sndAt(r.x, r.y); sfx('grab', got.length, a.pan, a.vol); }
  if (got.length >= 2) pop(r.x, r.y - 70, '×' + got.length, 'note', 15);
}

function updRobot(r, dt){
  const cfg = S.robots[r.id];
  r.moving = false; r.anim += dt;
  r.blinkT -= dt; if (r.blinkT < 0){ r.blink = 0.14; r.blinkT = rand(2, 5); } if (r.blink > 0) r.blink -= dt;
  const sp = robotSpeed(r.id);
  switch (r.st){
    case 'idle': decide(r); break;
    case 'seek': {
      const l = planAlive(r);
      if (!l){ release(r); r.st = 'idle'; break; }
      if ((cfg.job === 'mine' && minerFor(r)) || waitingToMine(r)){ release(r); r.st = 'idle'; break; }
      const reach = rv(r.id, 'reach');
      const d = Math.hypot(l.x - r.x, l.y - r.y);
      if (d <= Math.max(9, reach*0.8)){ r.st = 'pick'; r.pickDur = pickTime(r.id); r.timer = r.pickDur; r.grabbed = false; r.face = l.x >= r.x ? 1 : -1; aimClaw(r, l); break; }
      const k = (d - reach*0.6) / d;
      moveTo(r, r.x + (l.x - r.x)*k, r.y + (l.y - r.y)*k + 1, sp, dt);
      break;
    }
    case 'pick': {
      // the arm reaches out, grabs at full stretch, then pulls back
      r.timer -= dt;
      if (!r.grabbed && r.timer <= r.pickDur*0.45){ r.grabbed = true; grabLeaves(r); }
      if (r.timer <= 0){ if (!r.grabbed) grabLeaves(r); r.armTo = null; r.fingers = null; r.st = 'idle'; }
      break;
    }
    case 'toBin': { const p = binSpot(r); if (moveTo(r, p.x, p.y, sp, dt)){ r.st = 'dump'; r.timer = 0.32; r.face = 1; } break; }
    case 'dump': r.timer -= dt; if (r.timer <= 0){ deposit(r); if (r.carryL || r.carryM){ r.st = 'wait'; r.timer = 0.5; if (Math.random() < 0.5) robotSays(r, 'hmm'); } else r.st = 'idle'; } break;
    case 'wait': r.timer -= dt; if (r.timer <= 0){ deposit(r); r.timer = 0.5; if (!r.carryL && !r.carryM) r.st = 'idle'; } break;
    case 'toMine': {
      const m = minerFor(r); if (!m){ r.st = 'idle'; break; }
      if (moveTo(r, m.wx, m.wy, sp, dt)){ r.st = 'mine'; r.face = 1; }
      break;
    }
    case 'mine': {
      const m = minerFor(r); if (!m){ r.st = 'idle'; r.mineP = 0; break; }
      r.face = 1; r.hammer += dt;
      r.mineP += dt / drillTime(r.id);
      if (!simMode){
        if (Math.random() < dt*9) parts.push({ k:'spark', x: m.x + rand(-6,6), y: m.y - rand(0,6), vx: rand(-40,40), vy: rand(-70,-20), g: 160, life: rand(.25,.45), t:0 });
        if (Math.random() < dt*2.2) parts.push({ k:'dust', x: m.x + rand(-10,10), y: m.y, vx: rand(-8,8), vy: rand(-14,-6), g:0, life: rand(.8,1.4), t:0, r: rand(4,8) });
      }
      if (r.mineP >= 1){
        // the magnet sometimes catches a second chunk (it may ride along one over the basket limit)
        const lucky = Math.random() < doubleChance(r.id), n = lucky ? 2 : 1;
        r.mineP -= 1; r.carryM += n;
        if (lucky){ S.totals.lucky = (S.totals.lucky || 0) + 1; pop(m.x, m.y - 80, '+2 lucky!', 'metal', 17); }
        else pop(m.x, m.y - 76, '+1', 'metal', 15);
        { const a = sndAt(m.x, m.y); sfx('tink', a.pan, a.vol*0.7); if (lucky && !simMode) setTimeout(() => sfx('tink', a.pan, a.vol*0.8), 110); }
        for (let i=0;i<n;i++) flyTo('metal', m.x + i*6, m.y - 4, r.x - 6, r.y - 38, 0.35 + i*0.08, 20 + i*8, {});
        if (r.carryM >= metalCarry(r.id)){ r.st = 'toBin'; r.mineP = 0; }
      }
      break;
    }
    case 'wander': {
      if (hasLeaves() || (cfg.job === 'mine' && minerFor(r)) || waitingToMine(r)){ r.st = 'idle'; break; }
      if (moveTo(r, r.wx, r.wy, sp*0.4, dt)){ r.st = 'rest'; r.timer = rand(1, 2.4); }
      break;
    }
    case 'rest': r.timer -= dt; if (r.timer <= 0 || hasLeaves() || waitingToMine(r)) r.st = 'idle'; break;
  }
  if (!simMode && STYLES[r.id].dust && r.moving && Math.random() < dt*2.5) parts.push({ k:'dust', x: r.x - r.face*10, y: r.y - 2, vx: -r.face*rand(4,12), vy: rand(-10,-4), g:0, life: rand(.6,1), t:0, r: rand(2.5,4.5) });
}

function deposit(r){
  if (r.carryL > 0){
    const n = Math.min(r.carryL, binCap() - S.binLeaves);
    if (n > 0){
      S.binLeaves += n; r.carryL -= n; S.totals.leaves += n;
      pop(BIN.x - 8, BIN.y - 74, '+' + n, 'leaf', 19);
      for (let i=0;i<Math.min(n,6);i++) flyTo('leaf', r.x, r.y - 36, BIN.x + rand(-20,20), BIN.y - 46, 0.32 + i*0.05, 26, { ci: pickColor(), sh: Math.random()<.5?1:0, s: 5 });
      bumpBin = 0.25;
      { const a = sndAt(BIN.x, BIN.y); sfx('dump', n, a.pan, a.vol); if (Math.random() < 0.12) robotSays(r, Math.random() < .6 ? 'happy' : 'chat'); }
    }
  }
  if (r.carryM > 0 && S.metalSlot){
    const n = Math.min(r.carryM, metalCap() - S.binMetal);
    if (n > 0){
      S.binMetal += n; r.carryM -= n; S.totals.metal += n;
      pop(TUB.x, TUB.y - 60, '+' + n, 'metal', 19);
      for (let i=0;i<Math.min(n,5);i++) flyTo('metal', r.x, r.y - 36, TUB.x + rand(-8,8), TUB.y - 28, 0.3 + i*0.05, 22, {});
      { const a = sndAt(TUB.x, TUB.y); sfx('clink', n, a.pan, a.vol); }
    }
  }
  r.full = (r.carryL > 0 || r.carryM > 0);
}

// ───────────────────────── helper robots: blowers and shakers
// Blowers (half robot vacuum, half elephant) look for leaves far from the bin and blow them toward it.
// Shakers (little crabs with big claws) shake trees and bushes on your land so more leaves come down.
// Neither one carries anything, so they never visit the bin.
let HB = [];
const BIN_MOUTH = { x: BIN.x + 18, y: BIN.y - 84 };   // where blowers aim: just above the bin, where leaves can still land
const SHAKE_COOLDOWN = 15;                           // seconds before a shaker can shake the same tree or bush again (hidden)
const shakeCD = { tree: TREES.map(() => 0), bush: BUSHES.map(() => 0), flower: [] };
const bushShake = BUSHES.map(() => 0);
function newHelper(kind, idx){
  return { kind, idx, x: SHED.x + 34 + rand(-6, 6), y: SHED.y + 14, st:'idle', face:1, anim: Math.random()*5, moving:false, timer:0,
    tx:0, ty:0, dir:{ x:0, y:-1 }, blowT:0, quiet:0, target:null, blinkT: rand(1, 4), blink:0, puffT:0, dropped:false };
}
function syncHelpers(){
  for (const kind of ['blower', 'shaker']){
    const n = cfgsOf(kind).length;
    for (let i = HB.filter(h => h.kind === kind).length; i < n; i++) HB.push(newHelper(kind, i));
  }
}
const helperCfg = h => cfgsOf(h.kind)[h.idx];
const hv = (h, k) => TRACKS[k].vals[helperCfg(h).lv[k]];
const helperSpeed = h => (h.kind === 'blower' ? 50 : 62) * hv(h, 'speed') * (1 + 0.2*gl('oil'));
const blowPower = h => hv(h, 'blow');
const blowRange = h => 40 + 16*blowPower(h);
const shakeYield = (h, bush) => { const v = hv(h, 'shake'); return bush ? Math.max(2, Math.round(v*0.45)) : v; };
const helperStyle = h => (h.kind === 'blower' ? BLOWER_STYLES : SHAKER_STYLES)[h.idx];
function helperSays(h, mood){ const a = sndAt(h.x, h.y); sfx('beep', h.kind === 'blower' ? 5 : 6, mood, a.pan, a.vol*0.8); }
// trees whose trunk stands on your land, and your bushes
function shakeables(){
  const O = owned(), out = [];
  TREES.forEach((t, i) => { const by = trunkBase(t); if (t.x > O.x0 + 12 && t.x < O.x1 - 12 && by > O.y0 + 12 && by < O.y1) out.push({ type:'tree', i, x: t.x, y: by + 7 }); });
  BUSHES.forEach((b, i) => { if (b.x > O.x0 && b.x < O.x1 && b.y > O.y0 && b.y < O.y1) out.push({ type:'bush', i, x: b.x, y: b.y + 10*b.s }); });
  return out;
}
const tooManyLeaves = () => groundN >= AREAS[S.land].cap*1.6;
function helperWander(h, rx, ry){
  const O = owned();
  h.tx = clamp(h.x + rand(-rx, rx), O.x0 + 20, O.x1 - 20); h.ty = clamp(h.y + rand(-ry, ry), O.y0 + 20, O.y1 - 4); h.st = 'wander';
}

// Blowers sweep like a robot vacuum. They drive laps around the outside of your land (a ∩: up one side, across the
// top, down the other), blowing toward the bin the whole way and nudging the leaves right beside them too. Each lap
// turns round and runs one step further in, so the leaves get herded inward lap by lap and nothing is left out in
// the far corners. A lap whose band holds hardly any leaves is skipped; after the innermost lap they start outside again.
const lapStep = h => 24 + 0.6*blowRange(h);
function lapGeo(h, k){
  const O = owned(), m = 22 + k*lapStep(h);
  const xl = O.x0 + m, xr = O.x1 - m, yt = O.y0 + m;
  if (xr - xl < 170 || yt > BIN_MOUTH.y - 60) return null;          // that's the middle: done
  const bottom = xl > -150 ? BIN_MOUTH.y + 6 : O.y1 - 24;            // inner laps stop short of the bin
  return { xl, xr, yt, bottom, m };
}
// how many free leaves lie in a lap's band (distance in from the left, right or top fence)
function lapLeaves(h, k){
  const O = owned(), g = lapGeo(h, k); if (!g) return -1;
  const st = lapStep(h); let n = 0;
  for (const l of leaves){
    if (l.st !== 'ground' || !l.collect) continue;
    const e = Math.min(l.x - O.x0, O.x1 - l.x, l.y - O.y0);
    if (e > g.m - st*0.9 && e < g.m + st*0.6 && l.y < g.bottom + 30) n++;
  }
  return n;
}
function blowerDecide(h){
  // next lap inward (or the first one with leaves, starting outside), not one another blower is already on
  const taken = k => HB.some(q => q !== h && q.kind === 'blower' && q.st === 'lap' && q.lap === k);
  let k = h.lap == null ? h.idx*2 : h.lap + 1, tries = 0, wrapped = h.lap == null;
  for (;;){
    if (tries++ > 40){ h.lap = null; helperWander(h, 60, 40); return; }
    const n = lapLeaves(h, k);
    if (n < 0){ if (wrapped && k === 0){ h.lap = null; helperWander(h, 60, 40); return; } k = 0; wrapped = true; continue; }
    if (n >= 2 && !taken(k)) break;
    k++;
  }
  const g = lapGeo(h, k);
  h.lap = k; h.lapDir = h.lapDir ? -h.lapDir : 1;
  const pts = [{ x:g.xl, y:g.bottom }, { x:g.xl, y:g.yt }, { x:g.xr, y:g.yt }, { x:g.xr, y:g.bottom }];
  // start from whichever end is nearer, like a roomba turning round at the end of a row
  const a = Math.hypot(pts[0].x - h.x, pts[0].y - h.y), b = Math.hypot(pts[3].x - h.x, pts[3].y - h.y);
  h.path = a <= b ? pts : pts.reverse(); h.pi = 0; h.st = 'go'; h.tx = h.path[0].x; h.ty = h.path[0].y;
}
// pushes leaves toward the bin: a short cone in front of the hose, plus anything right beside the blower
function blowLeaves(h, dt){
  const R0 = blowRange(h), P = blowPower(h), acc = 170*Math.pow(P, 0.8), cap = 40 + 20*P, glideD = 30 + 28*P;
  const ox = h.x, oy = h.y - 4;
  let n = 0;
  for (const l of leaves){
    if (l.st !== 'ground' || !l.collect || l.claim) continue;
    const vx = l.x - ox, vy = l.y - oy;
    if (Math.abs(vx) > R0 + 4 || Math.abs(vy) > R0 + 4) continue;
    const tx = BIN_MOUTH.x - l.x, ty = BIN_MOUTH.y - l.y, td = Math.hypot(tx, ty);
    if (td < 50) continue;   // close enough: the robots take it from here
    const along = vx*h.dir.x + vy*h.dir.y, perp = Math.abs(vx*h.dir.y - vy*h.dir.x), d = Math.hypot(vx, vy);
    const cone = along > -4 && along < R0 && perp < 14 + along*0.7, beside = d < 24 + 6*P;
    if (!cone && !beside) continue;
    const f = acc*dt*(cone ? 1 - 0.4*Math.max(0, along)/R0 : 0.75);
    l.kx += (tx/td*0.7 + h.dir.x*0.3)*f; l.ky += (ty/td*0.7 + h.dir.y*0.3)*f;
    // once blown, the leaf keeps skimming toward the bin for a while even after the blower has driven on
    l.glide = 1; l.glideV = Math.max(l.glideV || 0, cap*0.7); l.glideD = Math.max(l.glideD || 0, glideD);
    const sp = Math.hypot(l.kx, l.ky); if (sp > cap){ l.kx *= cap/sp; l.ky *= cap/sp; }
    if (!l.blown){ l.blown = true; S.totals.blown = (S.totals.blown || 0) + 1; }
    n++;
  }
  return n;
}
function blowAir(h, dt){
  // soft air: faint curling wind lines and a few bits of grass, not a jet
  h.puffT -= dt;
  if (h.puffT > 0) return;
  h.puffT = 0.11;
  const nz = trunkTip(h), j = rand(-0.55, 0.55), c = Math.cos(j), s = Math.sin(j), vx = h.dir.x*c - h.dir.y*s, vy = h.dir.x*s + h.dir.y*c, v = rand(55, 85);
  parts.push({ k:'air', x: nz.x + vx*4, y: nz.y + vy*4, vx: vx*v, vy: vy*v*0.8, g:0, life: rand(.45, .75)*(0.7 + blowRange(h)/150), t:0, curl: rand(-1, 1), len: rand(7, 12) });
  if (Math.random() < 0.35) parts.push({ k:'speck', x: nz.x, y: nz.y, vx: vx*v*1.1 + rand(-10, 10), vy: vy*v*0.9 - rand(4, 14), g: 40, life: rand(.3, .55), t:0 });
}

// Deadheading: snip off a spent flower and a fresh one pops up for the bees right away. Each flower then has the
// same hidden cooldown as a tree before a shaker will cut it again. The most worthwhile flowers are the ones that
// have the longest wait left before they would bloom on their own.
const SNIP_TIME = 0.9;
function snipTarget(h){
  const sp = helperSpeed(h);
  let best = null, bs = 0;
  FLOWERS.forEach((f, i) => {
    if (f.full || f.land > S.land || shakeCD.flower[i] > 0) return;
    const left = f.regrow - f.t; if (left < 6) return;
    if (HB.some(q => q !== h && q.target && q.target.type === 'flower' && q.target.i === i)) return;
    const d = Math.hypot(f.x - 16 - h.x, f.y + 3 - h.y), sc = left/(d/sp + SNIP_TIME + 1.5);
    if (sc > bs){ bs = sc; best = { type:'flower', i, x: f.x - 15, y: f.y + 3 }; }
  });
  return best;
}
function shakerDecide(h){
  const cfg = helperCfg(h);
  if (cfg.job === 'flower' && cfg.lv.snip && S.hive.built){
    const t = snipTarget(h);
    if (t){ h.target = t; h.st = 'go'; return; }
  }
  if (tooManyLeaves()){ h.target = null; helperWander(h, 50, 30); return; }
  const sp = helperSpeed(h);
  let best = null, bs = -1;
  for (const o of shakeables()){
    if (shakeCD[o.type][o.i] > 0) continue;
    if (HB.some(q => q !== h && q.target && q.target.type === o.type && q.target.i === o.i)) continue;
    const d = Math.hypot(o.x - h.x, o.y - h.y), worth = o.type === 'tree' ? 1 : 0.45, sc = worth/(d/sp + 2);
    if (sc > bs){ bs = sc; best = o; }
  }
  if (!best){ h.target = null; helperWander(h, 60, 40); return; }
  h.target = best; h.st = 'go';
}
// the shake itself: a few leaves let go of the tree (or pop out of the bush) and land around it
function shakeDrop(h, o){
  if (tooManyLeaves()) return 0;
  const bush = o.type === 'bush', n = shakeYield(h, bush);
  let made = 0;
  if (!bush){
    const t = TREES[o.i], spots = treeDropSpots(t);
    if (!spots.length) return 0;
    for (let k=0;k<n;k++){
      const p = spots[Math.floor(Math.random()*spots.length)], x = p.x + rand(-5, 5), ly = p.y + rand(-3, 3);
      if (!landingOK(x, ly)) continue;
      const fall = rand(50, 150), l = newLeaf(x, ly - fall, ly, true);
      l.vy = rand(45, 70); l.sw = rand(6, 14); l.x -= wind*l.wf*fall/l.vy;
      if (simMode){ l.x = x; l.y = ly; l.st = 'ground'; } else l.y -= rand(0, 1.1)*l.vy;
      leaves.push(l); made++;
    }
    treeShake[o.i] = Math.max(treeShake[o.i], 1.2);
  } else {
    const b = BUSHES[o.i];
    for (let k=0, tries=0; k<n && tries<n*6; tries++){
      const a = rand(0, TAU), x = b.x + Math.cos(a)*rand(40, 58)*b.s, ly = b.y - 6*b.s + Math.sin(a)*rand(18, 28)*b.s;
      if (!landingOK(x, ly)) continue;
      const fall = rand(22, 40)*b.s, l = newLeaf(x, ly - fall, ly, true);   // shaken out of the bush, landing around it
      l.vy = rand(30, 50); l.sw = rand(4, 10); l.x -= wind*l.wf*fall/l.vy;
      if (simMode){ l.x = x; l.y = ly; l.st = 'ground'; }
      leaves.push(l); made++; k++;
    }
    bushShake[o.i] = 1.1;
  }
  S.totals.shakes = (S.totals.shakes || 0) + 1;
  if (!simMode && made){
    const p = bush ? { x: BUSHES[o.i].x, y: BUSHES[o.i].y - 40 } : { x: TREES[o.i].x, y: TREES[o.i].y - TREES[o.i].r*0.4 };
    pop(p.x, p.y, '+' + made, 'leaf', 15);
    const a = sndAt(p.x, p.y); sfx('kick', bush ? 5 : 9, a.pan);
    if (Math.random() < 0.3) helperSays(h, 'happy');
  }
  return made;
}

function updHelper(h, dt){
  h.moving = false; h.anim += dt;
  h.blinkT -= dt; if (h.blinkT < 0){ h.blink = 0.14; h.blinkT = rand(2, 5); } if (h.blink > 0) h.blink -= dt;
  const sp = helperSpeed(h);
  switch (h.st){
    case 'idle': if (h.kind === 'blower') blowerDecide(h); else shakerDecide(h); break;
    case 'go': {
      if (h.kind === 'shaker' && h.target && (shakeCD[h.target.type][h.target.i] > 0 || (h.target.type === 'flower' && FLOWERS[h.target.i].full))){ h.target = null; h.st = 'idle'; break; }
      const to = h.kind === 'shaker' ? h.target : { x: h.tx, y: h.ty };
      if (!to){ h.st = 'idle'; break; }
      if (moveTo(h, to.x, to.y, sp, dt)){
        if (h.kind === 'blower'){ h.st = 'lap'; h.pi = 1; h.puffT = 0; }
        else if (h.target.type === 'flower'){ h.st = 'snip'; h.timer = SNIP_TIME; h.dropped = false; }
        else { h.st = 'shake'; h.timer = h.target.type === 'tree' ? 1.7 : 1.2; h.dropped = false; shakeCD[h.target.type][h.target.i] = SHAKE_COOLDOWN; }
      }
      break;
    }
    case 'lap': {
      // follow the lap, always blowing toward the bin; it drives backwards when it has to, nose to the bin
      const p = h.path[h.pi], dx = BIN_MOUTH.x - h.x, dy = BIN_MOUTH.y - h.y, d = Math.hypot(dx, dy) || 1;
      h.dir = { x: dx/d, y: dy/d };
      const n = blowLeaves(h, dt);
      if (moveTo(h, p.x, p.y, sp*0.85, dt)){ h.pi++; if (h.pi >= h.path.length){ h.st = 'idle'; } }
      h.face = dx >= 0 ? 1 : -1;
      if (!simMode){ blowAir(h, dt); if (Math.random() < dt*0.8){ const a = sndAt(h.x, h.y); sfx('kick', n ? 2 : 0, a.pan); } }
      break;
    }
    case 'shake': {
      h.timer -= dt;
      const total = h.target.type === 'tree' ? 1.7 : 1.2;
      if (h.target.type === 'tree') treeShake[h.target.i] = Math.max(treeShake[h.target.i], 0.5); else bushShake[h.target.i] = Math.max(bushShake[h.target.i], 0.5);
      if (!h.dropped && h.timer <= total - 0.45){ h.dropped = true; shakeDrop(h, h.target); }
      if (h.timer <= 0){ h.target = null; h.st = 'rest'; h.timer = rand(0.3, 0.8); }
      break;
    }
    case 'snip': {
      h.timer -= dt;
      const f = FLOWERS[h.target.i];
      if (!h.dropped && h.timer <= SNIP_TIME*0.45){
        h.dropped = true;
        if (!f.full){
          f.full = true; f.t = 0; f.bob = 0.5; shakeCD.flower[h.target.i] = SHAKE_COOLDOWN;
          S.totals.snips = (S.totals.snips || 0) + 1;
          if (!simMode){
            const hy = f.y - flowerHead(f);
            for (let k=0;k<5;k++) parts.push({ k:'petal', x: f.x + rand(-3, 3), y: hy + rand(-2, 2), vx: rand(-26, 26), vy: rand(-40, -10), g: 90, life: rand(.6, 1), t: 0, col: '#8a7a4a' });
            if (Math.random() < 0.35) pop(f.x, hy - 16, 'snip!', 'note', 13);

// ───────────────────────── leaf world update
function updLeaves(dt){
  gustT -= dt; if (gustT < 0){ gust = rand(18, 40)*(Math.random()<.5?-1:1); gustT = rand(9, 18); }
  gust *= Math.pow(0.55, dt);
  wind = 12*Math.sin(S.t*0.13) + 7*Math.sin(S.t*0.41 + 1) + gust;
  const A = AREAS[S.land];
  spawnAcc += dt*A.spawn;
  while (spawnAcc >= 1){ spawnAcc -= 1; if (groundN < A.cap) spawnCollectable(false); }
  dropT -= dt;
  if (dropT <= 0){ dropT = treeDrop() ? rand(75, 150) : rand(15, 30); }
  for (let i=0;i<treeShake.length;i++) if (treeShake[i] > 0) treeShake[i] = Math.max(0, treeShake[i] - dt);
  if (!simMode){
    ambAcc += dt*(reduceMotion ? 0.25 : 0.5 + 0.25*S.land);
    while (ambAcc >= 1){ ambAcc -= 1; spawnAmbient(); }
    fgAcc += dt*(reduceMotion ? 0.03 : 0.2);
    while (fgAcc >= 1){ fgAcc -= 1; spawnFg(); }
  }
  let n = 0;
  for (const l of leaves){
    if (l.st === 'fall'){
      l.ph += dt*l.phs; l.y += l.vy*dt; l.x += (wind*l.wf + Math.cos(l.ph)*l.sw)*dt; l.rot += l.vr*dt;
      if (l.y >= l.ly){
        l.y = l.ly;
        if (l.collect && !landingOK(l.x, l.y)){ const O = owned(); l.x = clamp(l.x, O.x0 + 10, O.x1 - 10); if (!landingOK(l.x, l.y)) l.collect = false; }
        l.st = l.collect ? 'ground' : 'fade'; l.flip = Math.cos(l.ph) < 0 ? -1 : 1; l.t = 0;
      }
    } else if (l.st === 'ground'){
      if (l.kx || l.ky){
        const O = owned(), px = l.x, py = l.y;
        l.x += l.kx*dt; l.y += l.ky*dt; l.rot += l.kx*0.04*dt;
        // a blown leaf skims along the grass for a while; it settles once it reaches the bin
        // a blown leaf skims toward the bin at an even pace until its glide runs out, then settles
        let fr = 0.02;
        if (l.glide){
          const tx = BIN_MOUTH.x - l.x, ty = BIN_MOUTH.y - l.y, bd = Math.hypot(tx, ty) || 1;
          if (bd < 48){ l.glide = 0; l.glideD = 0; }
          else if (l.glideD > 0){
            const v = l.glideV*Math.min(1, 0.35 + l.glideD/40), k = 1 - Math.pow(0.02, dt);
            l.kx += (tx/bd*v - l.kx)*k; l.ky += (ty/bd*v - l.ky)*k; fr = 1;
            l.glideD -= Math.hypot(l.kx, l.ky)*dt;
          } else fr = 0.15;
        }
        const d = Math.pow(fr, dt); l.kx *= d; l.ky *= d; if (Math.abs(l.kx)+Math.abs(l.ky) < (l.glide ? 4 : 1) && !(l.glideD > 0)){ l.kx = l.ky = 0; l.glide = 0; l.glideV = 0; }
        l.x = clamp(l.x, O.x0 + 8, O.x1 - 8); l.y = clamp(l.y, O.y0 + 6, O.y1 - 4);
        // a kicked or blown leaf stops at the bin, the shed, a bush or a trunk instead of sliding under it
        if (!landingOK(l.x, l.y) && landingOK(px, py)){ l.x = px; l.y = py; l.kx *= -0.15; l.ky *= -0.15; l.glideD = 0; }
      }
    } else if (l.st === 'fade'){
      l.t += dt; l.a = clamp(1 - (l.t - 2.5)/1.5, 0, 1); if (l.a <= 0) l.st = 'gone';
    }
    if (l.collect && (l.st === 'ground' || l.st === 'fall')) n++;
  }
  groundN = n;
  leaves = leaves.filter(l => l.st !== 'gone');
  for (const f of fgLeaves){ f.ph += dt*f.phs; f.y += f.vy*dt; f.x += (wind*2.4 + Math.cos(f.ph)*f.sw)*dt; f.rot += f.vr*dt; }
  fgLeaves = fgLeaves.filter(f => f.y < H + 60 && f.x < W + 80);
}

// ───────────────────────── flowers, robot bees and the hive
// Autumn flowers grow in little clumps all over the land. Once the hive is built, robot bees fly out, sip nectar from
// two flowers (three with Longer rounds) and bring it home. A sipped flower needs about half a minute to bloom again,
// so the more bees you keep, the further out they have to fly, and on a small plot some just hang around the hive.
// The hive turns nectar into jars of honey (each floor of the tower is a honey room, and tank or store upgrades add
// floors), keeps the jars until the truck comes, and stops when the store is full.
const FLOWER_N = [14, 40, 110];   // the orchard is huge, so it gets lots: that's where honey can really take off          // new flowers on each piece of land
const FLOWER_REGROW = 30;               // seconds for a sipped flower to bloom again (each one a little different)
const BEE_SPEED = 62, SIP_TIME = 1.4, FLOOR_RATE = 1.6;   // each floor of the hive turns 1.6 nectar a second into honey
let FLOWERS = [], flowerSpr = [];
let B = [];                                            // bees (runtime)
const hiveRt = { jars: 0, popT: 0, making: 0, builtT: -10, shownT: -10, bump: 0 };

function flowerSpotOK(x, y, lvl){
  const O = owned(lvl);
  if (x < O.x0 + 14 || x > O.x1 - 14 || y < O.y0 + 16 || y > O.y1 - 10) return false;
  if (lvl > 0){ const P = owned(lvl - 1); if (x > P.x0 - 8 && x < P.x1 + 8 && y > P.y0 - 8) return false; }
  if (Math.abs(x - SHED.x) < 72 && y > SHED.y - 112) return false;
  if (x > SHED.x + 40 && x < SHED.x + 96 && y > SHED.y - 24) return false;
  if (x > BIN.x - 58 && x < BIN.x + 92 && y > BIN.y - 74) return false;
  if (Math.abs(x - SIGN.x) < 28 && y > SIGN.y - 34) return false;
  if (Math.abs(x - HIVE.x) < 46 && y > HIVE.y - 175 && y < HIVE.y + 18) return false;
  if (Math.abs(x - CRATE.x) < 32 && y > CRATE.y - 66 && y < CRATE.y + 14) return false;
  for (const p of SPOTS) if (Math.abs(x - p.x) < 54 && Math.abs(y - p.y) < 32) return false;
  for (const b of BUSHES){ const dx = (x - b.x)/(48*b.s), dy = (y - b.y + 8*b.s)/(26*b.s); if (dx*dx + dy*dy < 1) return false; }
  // not under a tree crown, where nobody would see them
  for (const t of TREES){ const dx = (x - t.x)/(t.r*1.02), dy = (y - t.y - t.r*0.12)/(t.r*1.14); if (dx*dx + dy*dy < 1) return false; }
  for (let L=0; L<AREAS.length - 1; L++){ const A = AREAS[L], sx = Math.round(A.w*0.18), sy = -A.h + 44; if (Math.abs(x - sx) < 42 && y > sy - 34 && y < sy + 12) return false; }
  return true;
}
function buildFlowers(){
  FLOWERS = [];
  for (let L=0; L<AREAS.length; L++){
    const rnd = mulberry(900 + L*17), O = owned(L);
    let n = 0, tries = 0;
    while (n < FLOWER_N[L] && tries++ < 4000){
      const cx = O.x0 + rnd()*(O.x1 - O.x0), cy = O.y0 + rnd()*(O.y1 - O.y0);
      if (!flowerSpotOK(cx, cy, L)) continue;
      const ty = Math.floor(rnd()*FLOWER_TYPES.length), ty2 = Math.floor(rnd()*FLOWER_TYPES.length);
      const k = 2 + Math.floor(rnd()*4);
      for (let m=0, t2=0; m<k && n < FLOWER_N[L] && t2 < 30; t2++){
        const a = rnd()*TAU, d = m ? 8 + rnd()*22 : 0, x = cx + Math.cos(a)*d, y = cy + Math.sin(a)*d*0.6;
        if (!flowerSpotOK(x, y, L) || FLOWERS.some(f => Math.abs(f.x - x) < 9 && Math.abs(f.y - y) < 6)) continue;
        const s = 1.1 + rnd()*0.4;
        FLOWERS.push({ x, y, ty: rnd() < 0.75 ? ty : ty2, s, land: L, ph: rnd()*TAU, full: true, t: 0, regrow: FLOWER_REGROW*(0.85 + rnd()*0.3), claim: null, bob: 0 });
        m++; n++;
      }
    }
  }
  FLOWERS.sort((a, b) => a.y - b.y);
  shakeCD.flower = FLOWERS.map(() => 0);
}
const flowerHead = f => FLOWER_TYPES[f.ty].h*f.s;
const bloomOf = f => f.full ? 1 : clamp((f.t/f.regrow - 0.12)/0.88, 0, 1);
function updFlowers(dt){
  for (const f of FLOWERS){
    if (f.bob > 0) f.bob = Math.max(0, f.bob - dt);
    if (f.full) continue;
    f.t += dt;
    if (f.t >= f.regrow){ f.full = true; f.t = 0; }
  }
}

// ── flower art: one sprite for the stem and leaves (with a closed bud on top) and one for the open head
const FLOWER_TYPES = [
  { name:'aster',     h: 12 },

    }

      q.fillStyle = '#f2c14e'; ell(q, 0, 0, 2, 2); q.fill(); q.fillStyle = '#c98a2a'; ell(q, 0.5, 0.5, 0.9, 0.9); q.fill();
    } else if (T.name === 'goldenrod'){
      for (let k=0;k<20;k++){ const u = k/19, px = -2 + u*5 + Math.sin(u*3)*1.5, py = 4 - u*9; q.fillStyle = ['#d39a26','#e9b93a','#f6d35f'][Math.floor(rnd()*3)]; ell(q, px + (rnd()-0.5)*2.6, py, 1.2 + (1 - u)*0.7, 1.2 + (1 - u)*0.7); q.fill(); }
    } else if (T.name === 'sedum'){
      q.fillStyle = '#8f3f50'; ell(q, 0, 0.6, 5.4, 3.4); q.fill();
      for (let k=0;k<26;k++){ const a = rnd()*TAU, d = Math.sqrt(rnd()); q.fillStyle = ['#c25a6e','#d9798a','#e39aa5'][Math.floor(rnd()*3)]; ell(q, Math.cos(a)*d*4.6, Math.sin(a)*d*2.8 - 0.3, 1, 1); q.fill(); }
    } else if (T.name === 'anemone'){
      for (let k=0;k<5;k++){ q.save(); q.rotate(k/5*TAU + 0.3); q.fillStyle = '#d9cfc0'; ell(q, 0, -3.2, 2.6, 3.2); q.fill(); q.fillStyle = '#f6f0e4'; ell(q, -0.2, -3.4, 2.2, 2.8); q.fill(); q.restore(); }
      q.fillStyle = '#e8c860'; ell(q, 0, 0, 2.1, 2.1); q.fill(); q.fillStyle = '#3a3426'; ell(q, 0, 0, 1.4, 1.4); q.fill();
    } else {
      const C = T.cols;
      for (let ring=0; ring<3; ring++){ const rr0 = 4.6 - ring*1.5, n = 12 - ring*3; for (let k=0;k<n;k++){ q.save(); q.rotate(k/n*TAU + ring*0.4); q.fillStyle = C[ring]; ell(q, 0, -rr0*0.7, 1.2, rr0*0.55); q.fill(); q.restore(); } }
      q.fillStyle = C[3]; ell(q, -0.3, -0.4, 1.4, 1.4); q.fill();

}
function drawFlowers(V){
  const c = ctx, active = S.hive.built;
  for (const f of FLOWERS){
    if (f.x < V.x0 || f.x > V.x1 || f.y < V.y0 - 20 || f.y > V.y1 + 20) continue;
    const sp = flowerSpr[f.ty]; if (!sp) continue;
    const wild = f.land > S.land, b = wild || !active ? 1 : bloomOf(f);
    const sway = reduceMotion ? 0 : Math.sin(S.t*1.3 + f.ph)*0.05 + wind*0.0015 + (f.bob > 0 ? Math.sin(f.bob*30)*0.06 : 0);
    c.save(); c.translate(f.x, f.y); c.rotate(sway); c.scale(f.s, f.s);
    if (wild) c.globalAlpha = 0.72;
    c.drawImage(sp.stem, -sp.sox, -sp.soy, sp.sw, sp.sh);
    if (b > 0.02){
      const T = FLOWER_TYPES[f.ty], k = 0.35 + 0.65*b, hs = sp.hw*k;
      c.globalAlpha *= Math.min(1, b*1.6);
      c.drawImage(sp.head, -hs/2, -T.h - hs/2, hs, hs);
    }
    c.restore();
  }
}

// ── the hive
const HIVE_COST = 180;
const MAX_BEES = 55;
// Six one-off hive upgrades, all at one fixed price, so the order is up to you. They're separate things rather than
// tiers of one line, so buying one doesn't make the others dearer. Measured with the pacing sim on the meadow: each is
// worth roughly +15–35% honey, except Faster fanning, which only pays once the bees bring in more than the hive can handle.
const HIVE_UP = {
  wings:   { name:'Quicker wings',  bee:true, desc:'Bees fly <b>25%</b> faster.' },
  third:   { name:'Longer rounds',  bee:true, desc:'Each bee visits <b>3 flowers</b> a trip instead of 2.' },
  tongue:  { name:'Long tongues',   bee:true, desc:'Bees take <b>5 nectar</b> from each flower instead of 4.' },
  fan:     { name:'Faster fanning',           desc:'The hive turns nectar into honey <b>50%</b> faster. Worth it once the bees bring in more than the hive can handle and the tank keeps filling up.' },
  recipe:  { name:'Better recipe',            desc:'A jar of honey takes <b>8 nectar</b> instead of 10.' },
  nursery: { name:'Bee nursery',              desc:'New bees cost <b>30%</b> less.' },
};
const HIVE_UP_COST = 80;
const hiveUpCost = () => HIVE_UP_COST;
const hiveShown = () => S.hive.built || S.flags.hiveShown;
const beeCost = (n = S.hive.bees) => niceCost(3*Math.pow(1.15, n)*(S.hive.up.nursery ? 0.7 : 1));
const tankCap = () => val('hiveTank');
const honeyCap = () => val('hiveStore');
const honeyPrice = () => val('honeyPrice')*sellMul();
const jarNectar = () => S.hive.up.recipe ? 8 : 10;
const fanRate = () => hiveFloors()*FLOOR_RATE*(S.hive.up.fan ? 1.5 : 1);
const hiveFloors = () => 4 + S.lv.hiveTank + S.lv.hiveStore;
const HV = { plinth: 14, fh: 12, r: 21, k: 0.32 };
const hiveTopZ = () => HV.plinth + hiveFloors()*HV.fh;
const DOOR = { x: HIVE.x, y: HIVE.y + 0.866*HV.r*HV.k, z: HV.plinth + HV.fh*0.5 };
// per-bee stats come from the upgrades the bee picked up last time it was home
const beeSpeed = b => BEE_SPEED*(b.up.wings ? 1.25 : 1);
const beeTrip = b => b.up.third ? 3 : 2;
const beeSip = b => b.up.tongue ? 5 : 4;

function newBee(i){
  const H = S.hive.up;
  return { i, x: DOOR.x, y: DOOR.y, z: DOOR.z, st:'in', timer: 0.2 + rand(0, 2.5), carry: 0, visits: 0, tgt: null, face: 1, anim: rand(0, 10), ph: rand(0, TAU),
    lx: 0, ly: 0, lz: 0, tx: 0, ty: 0, tz: 0, len: 1, up: { wings: H.wings, third: H.third, tongue: H.tongue } };
}
function syncBees(){ while (B.length < S.hive.bees) B.push(newBee(B.length)); }
function refreshBee(b){
  const H = S.hive.up; let ch = false;
  for (const k of ['wings', 'third', 'tongue']) if (b.up[k] !== H[k]){ b.up[k] = H[k]; ch = true; }
  if (ch && !simMode) parts.push({ k:'star', x: DOOR.x + rand(-4, 4), y: DOOR.y - DOOR.z - 4, vx: rand(-30, 30), vy: rand(-50, -20), g: 60, life: 0.6, t: 0 });
}
function beeLeg(b, tx, ty, tz){ b.lx = b.x; b.ly = b.y; b.lz = b.z; b.tx = tx; b.ty = ty; b.tz = tz; b.len = Math.max(1, Math.hypot(tx - b.x, ty - b.y)); }
function beeMove(b, sp, dt){
  const dx = b.tx - b.x, dy = b.ty - b.y, d = Math.hypot(dx, dy);
  if (Math.abs(dx) > 0.5) b.face = dx > 0 ? 1 : -1;
  const p = clamp(1 - d/b.len, 0, 1), lift = Math.min(34, b.len*0.14);
  if (d <= sp*dt){ b.x = b.tx; b.y = b.ty; b.z = b.tz; return true; }
  b.x += dx/d*sp*dt; b.y += dy/d*sp*dt;
  b.z = lerp(b.lz, b.tz, p) + Math.sin(p*Math.PI)*lift;
  return false;
}
function findFlower(b){
  let best = null, bs = 1e18;
  for (const f of FLOWERS){
    if (!f.full || f.claim || f.land > S.land) continue;
    const s = Math.hypot(f.x - b.x, f.y - b.y) + 0.35*Math.hypot(f.x - HIVE.x, f.y - HIVE.y);
    if (s < bs){ bs = s; best = f; }
  }
  return best;
}
function goFlower(b, f){ f.claim = b; b.tgt = f; b.st = 'fly'; beeLeg(b, f.x + rand(-1.5, 1.5), f.y + 0.5, flowerHead(f)*1.0 + 1.5); }
function loiter(b){
  b.st = 'loiter'; b.timer = rand(0.8, 1.8);
  beeLeg(b, HIVE.x + rand(-30, 46), HIVE.y + rand(2, 18), rand(18, hiveTopZ()*0.85));
}
function beeHome(b){ b.st = 'home'; b.tgt = null; beeLeg(b, DOOR.x, DOOR.y, DOOR.z); }
function unload(b){
  const H = S.hive, n = Math.min(b.carry, Math.max(0, tankCap() - H.nectar));
  if (n > 0){ H.nectar += n; b.carry -= n; S.totals.nectar = (S.totals.nectar || 0) + n; }
  return b.carry <= 1e-6;
}
function updBee(b, dt){
  b.anim += dt;
  const sp = beeSpeed(b);
  switch (b.st){
    case 'in': {
      b.timer -= dt; if (b.timer > 0) break;
      refreshBee(b);
      const f = findFlower(b);
      b.visits = 0;
      if (f) goFlower(b, f); else loiter(b);
      break;
    }
    case 'loiter': {
      // nothing in bloom: hang around the hive and check again every second or so
      if (beeMove(b, sp*0.45, dt)){ b.z += Math.sin(b.anim*5 + b.ph)*0.15; b.timer -= dt; }
      else b.timer -= dt*0.5;
      if (b.timer <= 0){
        refreshBee(b);
        const f = findFlower(b);
        if (f){ b.visits = 0; goFlower(b, f); } else loiter(b);
      }
      break;
    }
    case 'fly': {
      const f = b.tgt;
      if (!f || !f.full || f.claim !== b){ if (f && f.claim === b) f.claim = null; const g = findFlower(b); if (g) goFlower(b, g); else if (b.carry > 0) beeHome(b); else loiter(b); break; }
      if (beeMove(b, sp, dt)){ b.st = 'sip'; b.timer = SIP_TIME; f.bob = 0.6; }
      break;
    }
    case 'sip': {
      b.timer -= dt; b.z = b.tz + Math.sin(b.anim*9)*0.3;
      if (b.timer > 0) break;
      const f = b.tgt;
      if (f){ f.full = false; f.t = 0; f.claim = null; f.bob = 0.4; }
      b.carry += beeSip(b); b.visits++;
      if (b.visits < beeTrip(b)){ const g = findFlower(b); if (g){ goFlower(b, g); break; } }
      beeHome(b);
      break;
    }
    case 'home': {
      if (beeMove(b, sp, dt)){
        refreshBee(b);
        if (unload(b)){ b.st = 'in'; b.timer = 0.5 + rand(0, 0.5); }
        else { b.st = 'queue'; b.timer = 0.6; beeLeg(b, DOOR.x + rand(-14, 22), DOOR.y + rand(3, 10), DOOR.z + rand(4, 16)); }
      }
      break;
    }
    case 'queue': {
      // the nectar tank is full: buzz by the door until there is room
      beeMove(b, sp*0.4, dt);
      b.timer -= dt;
      if (b.timer <= 0){
        b.timer = 0.6;
        if (unload(b)){ b.st = 'in'; b.timer = 0.4; b.x = DOOR.x; b.y = DOOR.y; b.z = DOOR.z; }
        else beeLeg(b, DOOR.x + rand(-14, 22), DOOR.y + rand(3, 10), DOOR.z + rand(4, 16));
      }
      break;
    }
  }
}
// the hive turns nectar into honey: every floor helps, faster with Faster fanning
function updHive(dt){
  const H = S.hive;
  if (!H.built){ hiveRt.making = 0; return; }
  const room = honeyCap() - H.honey, before = Math.floor(H.honey + 1e-9);
  let n = 0;
  if (room > 1e-9 && H.nectar > 0) n = Math.min(H.nectar, fanRate()*dt, room*jarNectar());
  H.nectar -= n; H.honey = Math.min(honeyCap(), H.honey + n/jarNectar());
  hiveRt.making = lerp(hiveRt.making, dt > 0 ? n/dt : 0, Math.min(1, dt*2));
  const made = Math.floor(H.honey + 1e-9) - before;
  if (made > 0){ hiveRt.jars += made; S.totals.honey = (S.totals.honey || 0) + made; hiveRt.bump = 0.25; }
  if (hiveRt.bump > 0) hiveRt.bump = Math.max(0, hiveRt.bump - dt);
  hiveRt.popT -= dt;
  if (hiveRt.jars > 0 && hiveRt.popT <= 0){
    pop(HIVE.x + 18, HIVE.y - hiveTopZ() - 6, '+' + hiveRt.jars, 'honey', 15);
    hiveRt.jars = 0; hiveRt.popT = 1.6;
  }
  if (!simMode && n > 0 && Math.random() < dt*3) parts.push({ k:'star', x: HIVE.x + rand(-5, 5), y: HIVE.y - hiveTopZ() - 12, vx: rand(-14, 14), vy: rand(-36, -18), g: 10, life: rand(.5, .9), t: 0 });
}

// ── drawing the hive: a little hexagonal steel tower. Every tank or store upgrade adds a floor.
// Honey shows in the hexagon windows (filling from the bottom), nectar in the glass tube on the side.
function hexFront(r, k){ const d = 0.866*r*k; return [[-r, 0], [-r/2, d], [r/2, d], [r, 0]]; }
function hexPath(c, cx, cy, r, k){ const d = 0.866*r*k, p = [[-r,0],[-r/2,d],[r/2,d],[r,0],[r/2,-d],[-r/2,-d]]; c.beginPath(); p.forEach(([x, y], i) => i ? c.lineTo(cx + x, cy + y) : c.moveTo(cx + x, cy + y)); c.closePath(); }
function prismFace(c, r, k, i, yb, yt){ const v = hexFront(r, k), a = v[i], b = v[i + 1]; c.beginPath(); c.moveTo(a[0], yb + a[1]); c.lineTo(b[0], yb + b[1]); c.lineTo(b[0], yt + b[1]); c.lineTo(a[0], yt + a[1]); c.closePath(); }
function drawPrism(c, r, k, yb, yt, cols){ for (let i=0;i<3;i++){ prismFace(c, r, k, i, yb, yt); c.fillStyle = cols[i]; c.fill(); } hexPath(c, 0, yt, r, k); c.fillStyle = cols[3]; c.fill(); }
function hexCell(c, x, y, r, sx){ c.beginPath(); for (let i=0;i<6;i++){ const a = i/6*TAU + Math.PI/6, px = x + Math.cos(a)*r*sx, py = y + Math.sin(a)*r; i ? c.lineTo(px, py) : c.moveTo(px, py); } c.closePath(); }
function drawJar(c, x, y, s){
  c.save(); c.translate(x, y); c.scale(s/6, s/6);
  c.fillStyle = '#c47d1c'; rr(c, -4, -3.5, 8, 8.5, 2.4); c.fill();
  c.fillStyle = '#eba53a'; rr(c, -3.4, -3, 6.8, 7.4, 2); c.fill();
  c.fillStyle = 'rgba(255,240,190,.55)'; rr(c, -2.6, -2.2, 1.4, 5, 0.7); c.fill();
  c.fillStyle = '#f2e3c4'; c.fillRect(-3.4, -0.4, 6.8, 2.6);
  c.fillStyle = '#7c5a3c'; rr(c, -3.6, -5.6, 7.2, 2.6, 1); c.fill();
  c.restore();
}
function drawHive(){
  if (!hiveShown()) return;
  const c = ctx, H = S.hive, r = HV.r, k = HV.k, d = 0.866*r*k;

    c.font = '800 8px "Baloo 2", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#4a3226'; c.fillText('beehive', 4, -39.5);
    c.restore();

  }

    });
    // brass band at the top of each floor
    const yt = yb - fh;
    c.strokeStyle = 'rgba(40,30,20,.35)'; c.lineWidth = 0.8; c.beginPath(); v.forEach(([x, y], i) => i ? c.lineTo(x, yt + y + 1.6) : c.moveTo(x, yt + y + 1.6)); c.stroke();
    c.strokeStyle = '#c9a24a'; c.lineWidth = 1.4; c.beginPath(); v.forEach(([x, y], i) => i ? c.lineTo(x, yt + y) : c.moveTo(x, yt + y)); c.stroke();
