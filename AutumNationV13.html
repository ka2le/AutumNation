<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Leaf Yard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: one full-bleed canvas yard; HUD pinned top-left; upgrade cards float beside the thing you tapped. */
:root{
  --paper:#f6ead4; --paper-2:#ecdcbf; --ink:#4a3226; --ink-soft:#7c5d47;
  --accent:#d4672a; --accent-dk:#9e4719; --moss:#5f7232; --grass:#6c7a37;
  --chalk:#2f3a34;
  --font-ui:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  color-scheme: light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--grass);color:var(--ink);font-family:var(--font-ui);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
#c{position:fixed;inset:0;display:block;touch-action:none}
#hud{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:3}
.stat{display:flex;align-items:center;gap:7px;background:rgba(246,234,212,.86);border-radius:999px;padding:3px 13px 3px 7px;box-shadow:0 2px 10px rgba(50,25,8,.18);font-weight:700;font-size:17px;line-height:1.5;font-variant-numeric:tabular-nums;width:max-content;transition:transform .15s}
.stat.cash{pointer-events:auto;cursor:default}
.stat svg{width:20px;height:20px;flex:none}
.stat.bump{transform:scale(1.08)}
.stat.cash{font-size:19px}
#card{position:fixed;z-index:6;width:min(304px,calc(100vw - 24px));background:var(--paper);color:var(--ink);border-radius:16px;padding:12px 14px 8px;box-shadow:0 14px 34px rgba(40,18,4,.38),inset 0 0 0 1.5px rgba(110,74,48,.22);animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.94) translateY(6px);opacity:0}to{transform:none;opacity:1}}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ct{font-family:var(--font-hand);font-weight:700;font-size:30px;line-height:.95;text-wrap:balance}
.cs{font-size:13px;color:var(--ink-soft);line-height:1.35;margin:3px 0 6px}
.live{font-size:13.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.x{border:0;background:transparent;color:var(--ink-soft);font:700 20px/1 var(--font-ui);cursor:pointer;padding:2px 6px;border-radius:8px}
.x:hover{background:var(--paper-2)}
.row{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:1px;align-items:center;padding:9px 0;border-top:1.5px dashed rgba(110,74,48,.22)}
.row .n{font-weight:700;font-size:15px;line-height:1.2;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .d{font-size:12.5px;color:var(--ink-soft);line-height:1.3;min-width:0}
.row .d b{color:var(--ink);font-weight:700}
.row .btn{grid-column:2;grid-row:1 / span 2}
.pips{display:inline-flex;gap:3px}
.pip{width:6px;height:6px;border-radius:50%;background:rgba(110,74,48,.2)}
.pip.on{background:var(--accent)}
.buy{font:700 14px/1 var(--font-ui);border:0;border-radius:10px;padding:8px 11px 7px;background:var(--accent);color:#fff6e8;cursor:pointer;box-shadow:0 2px 0 var(--accent-dk);min-width:68px;font-variant-numeric:tabular-nums}
.buy:hover{filter:brightness(1.06)}
.buy:active{transform:translateY(1px);box-shadow:0 1px 0 var(--accent-dk)}
.buy[aria-disabled="true"]{background:var(--paper-2);color:#93765e;box-shadow:0 2px 0 #d3bf9c;cursor:default}
.buy.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.maxed{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--moss)}
.seg{display:flex;gap:4px;background:var(--paper-2);border-radius:11px;padding:3px;margin:2px 0 8px}
.seg button{flex:1;border:0;background:transparent;font:700 13.5px/1 var(--font-ui);color:var(--ink-soft);padding:8px 6px 7px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(60,30,10,.2)}
.foot{font-size:12px;color:var(--ink-soft);padding:6px 0 2px;border-top:1.5px dashed rgba(110,74,48,.22);display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{border:0;background:none;color:var(--ink-soft);font:600 12px var(--font-ui);text-decoration:underline;cursor:pointer;padding:2px}
.link.danger{color:#a8361d}
.note{font-size:12.5px;color:#a8361d;font-weight:600;min-height:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:10px 18px 9px;border-radius:14px;box-shadow:0 10px 26px rgba(40,18,4,.32);font-family:var(--font-hand);font-weight:700;font-size:24px;line-height:1.1;text-align:center;z-index:7;max-width:calc(100vw - 40px);transition:opacity .6s}
#toast small{display:block;font-family:var(--font-ui);font-size:13px;font-weight:600;color:var(--ink-soft);margin-top:3px}


#card{max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px);overflow-y:auto;overscroll-behavior:contain}
.gen{font-size:11.5px;font-weight:600;color:var(--ink-soft);background:var(--paper-2);border-radius:6px;padding:0 6px;line-height:1.6}
.pipgap{width:4px}
.lock{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#a08670}
.buy s{opacity:.6;font-weight:600;margin-right:5px;font-size:12px}
.sect{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-dk);padding:10px 0 2px;border-top:1.5px dashed rgba(110,74,48,.22)}
#recenter{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:4;width:42px;height:42px;border-radius:50%;border:0;background:rgba(246,234,212,.9);color:var(--ink);box-shadow:0 3px 12px rgba(50,25,8,.25);cursor:pointer;display:grid;place-items:center;padding:0}
#recenter svg{width:22px;height:22px}
#recenter:hover{background:var(--paper)}
#c{cursor:grab}

/* sound button and card */
#soundBtn{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:4;width:42px;height:42px;border-radius:50%;border:0;background:rgba(246,234,212,.9);color:var(--ink);box-shadow:0 3px 12px rgba(50,25,8,.25);cursor:pointer;display:grid;place-items:center;padding:0}
#soundBtn svg{width:22px;height:22px}
#soundBtn:hover{background:var(--paper)}
#soundBtn .sx{display:none}
#soundBtn.off{color:#a08670}
#soundBtn.off .sw{display:none}
#soundBtn.off .sx{display:inline}
.tog{font:700 13px/1 var(--font-ui);border:0;border-radius:999px;padding:7px 12px 6px;min-width:54px;background:var(--paper-2);color:#93765e;cursor:pointer;box-shadow:inset 0 0 0 1.5px rgba(110,74,48,.18)}
.tog.on{background:var(--moss);color:#f6ead4;box-shadow:0 2px 0 #46561f}
.row.vol{grid-template-columns:auto 1fr;column-gap:14px}
.row.vol input{width:100%;accent-color:var(--accent);margin:0;cursor:pointer}

/* workshop: two columns once yard-wide upgrades show up */
#card.wide{width:min(640px,calc(100vw - 24px))}
.cols{display:grid;grid-template-columns:1fr 1fr;column-gap:20px;align-items:start}
.col{min-width:0}
.gdone{font-size:12px;padding:6px 0 4px;border-top:1.5px dashed rgba(110,74,48,.22)}
@media (max-width:560px){ .cols{grid-template-columns:1fr} }

/* "upgrade every robot" button under each robot upgrade */
.row .btn{display:flex;flex-direction:column;align-items:stretch;gap:5px}
.buy.all{font-size:12px;padding:5px 9px 4px;background:var(--moss);box-shadow:0 2px 0 #46561f;white-space:nowrap}
.buy.all:active{box-shadow:0 1px 0 #46561f}
.buy.all[aria-disabled="true"]{background:var(--paper-2);color:#93765e;box-shadow:0 2px 0 #d3bf9c}

/* full screen button, top right */
#fsBtn{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:4;width:40px;height:40px;border-radius:50%;border:0;background:rgba(246,234,212,.9);color:var(--ink);box-shadow:0 3px 12px rgba(50,25,8,.25);cursor:pointer;display:grid;place-items:center;padding:0}
#fsBtn svg{width:20px;height:20px}
#fsBtn:hover{background:var(--paper)}
#fsBtn .fs-out{display:none}
#fsBtn.on .fs-in{display:none}
#fsBtn.on .fs-out{display:inline}

/* phones: smaller card text; on a narrow screen the card sits at the bottom like a sheet (placed in game.js) */
@media (max-width:640px), (max-height:500px){
  #card{padding:9px 11px 6px;border-radius:14px}
  .ct{font-size:24px}
  .cs{font-size:11.5px;margin:2px 0 4px}
  .live{font-size:12px}
  .row{padding:6px 0;column-gap:8px}
  .row .n{font-size:13px;gap:6px}
  .row .d{font-size:11px}
  .buy{font-size:12.5px;padding:7px 9px 6px;min-width:58px;border-radius:9px}
  .buy.all{font-size:11px;padding:4px 7px 3px}
  .buy s{font-size:10.5px}
  .sect{font-size:10px;padding:7px 0 1px}
  .gen{font-size:10.5px}
  .foot{font-size:11px}
  .seg button{font-size:12.5px;padding:7px 5px 6px}
  .stat{font-size:15px}
  .stat.cash{font-size:16px}
  #soundBtn,#recenter{width:38px;height:38px}
  #fsBtn{width:36px;height:36px}
}
@media (max-width:640px){
  #card{max-height:62vh}
  .cols{column-gap:14px}
}

/* "unlock more tiers" button, next to a track's level dots (unlocks it for every robot) */
.unlock{font:700 11.5px/1 var(--font-ui);border:1.5px solid #4f7c84;color:#2c5a62;background:#e2ece6;border-radius:999px;padding:4px 9px 3px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.unlock:hover{background:#d3e4dd}
.unlock[aria-disabled="true"]{border-color:#c9b799;color:#a08670;background:transparent;cursor:default}
.unlock.shake{animation:shake .3s}
@media (max-width:640px), (max-height:500px){ .unlock{font-size:10.5px;padding:3px 7px 2px} }

/* V6: a robot's task list (drag chips between priority rows and the Don't pile) */
.tasks{background:var(--paper-2);border-radius:12px;padding:7px 8px 8px;margin:2px 0 8px}
.tasks .th{display:flex;align-items:baseline;gap:8px;font-size:11.5px;color:var(--ink-soft);margin:0 2px 4px;flex-wrap:wrap}
.tasks .th b{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-dk)}
.tasks .th.off{margin-top:7px}
.tasks .th.off b{color:#93765e}
.tdo{display:flex;flex-direction:column;gap:4px}
.trow{display:flex;align-items:center;gap:5px;min-height:32px;padding:3px 4px;border-radius:9px;background:rgba(255,250,240,.55);box-shadow:inset 0 0 0 1.5px rgba(110,74,48,.12);position:relative}
.trow .tn{width:16px;flex:none;text-align:center;font-weight:800;font-size:12px;color:var(--accent-dk)}
.tslot{flex:1;min-height:24px;border-radius:7px;border:1.5px dashed rgba(110,74,48,.18)}
.tslot.wide{display:flex;align-items:center;padding:0 8px;font-size:11.5px;color:#a08670}
.toff{display:flex;flex-wrap:wrap;align-content:flex-start;gap:5px;min-height:58px;padding:5px;border-radius:9px;border:1.5px dashed rgba(110,74,48,.25)}
.trow.tnew{background:rgba(255,250,240,.3);box-shadow:inset 0 0 0 1.5px rgba(110,74,48,.08)}
.trow.tnew .tn{opacity:.55}
.tasks .th.off{align-items:center}
.toffall{margin-left:auto;font:700 11px/1 var(--font-ui);color:var(--ink-soft);background:transparent;border:1.5px solid rgba(110,74,48,.3);border-radius:999px;padding:3px 8px 2px;cursor:pointer}
.toffall:hover{background:var(--paper);color:var(--ink)}
.tempty{font-size:11.5px;color:#a08670;align-self:center;padding:0 4px}
.chip{display:inline-flex;align-items:center;gap:5px;font:700 12.5px/1 var(--font-ui);color:var(--ink);background:var(--paper);border-radius:8px;padding:6px 9px 5px 7px;box-shadow:0 1.5px 0 rgba(110,74,48,.25);border-left:3px solid var(--tc);cursor:grab;touch-action:none;white-space:nowrap;flex:1;min-width:0}
.toff .chip{flex:none;opacity:.72;border-left-color:rgba(110,74,48,.35)}
.chip svg{width:14px;height:14px;flex:none}
.chip:hover{filter:brightness(1.04)}
.chip.lifted{opacity:.3}
.chip.ghost{position:fixed;z-index:20;pointer-events:none;box-shadow:0 8px 18px rgba(40,18,4,.35);transform:rotate(-2deg);opacity:.96;cursor:grabbing}
.tasks.dragging .trow.drop-join{box-shadow:inset 0 0 0 2px var(--accent);background:rgba(255,236,200,.8)}
.tasks.dragging .trow.drop-top::before,.tasks.dragging .trow.drop-bottom::after{content:"";position:absolute;left:4px;right:4px;height:3px;border-radius:2px;background:var(--accent)}
.tasks.dragging .trow.drop-top::before{top:-4px}
.tasks.dragging .trow.drop-bottom::after{bottom:-4px}
.tasks.dragging .toff.drop-off{border-color:var(--accent);background:rgba(255,236,200,.6)}
@media (max-width:640px), (max-height:500px){
  .chip{font-size:11.5px;padding:5px 7px 4px 6px}
  .trow{min-height:28px}
  .toff{min-height:50px}
  .tasks .th{font-size:10.5px}
}

/* V6.1: hive upgrades wait for the first bee */
.lockline{font-size:12.5px;font-weight:700;color:#8a5a1e;background:#fbe9bf;border-radius:8px;padding:5px 9px;margin:4px 0 2px}
.row.locked .n,.row.locked .d{opacity:.6}

/* V6.2: keep-line sliders on the bin card */
.row.keep{grid-template-columns:1fr}
.row.keep .d{grid-column:1}
.row.keep input{grid-column:1;width:100%;margin:4px 0 0;accent-color:var(--accent);cursor:pointer}

</style>
</head>
<body>
<canvas id="c" aria-label="Leaf Yard game area"></canvas>

<div id="hud" aria-live="polite">
  <div class="stat cash" id="hCash" title="Cash">
    <svg viewBox="-12 -12 24 24" aria-hidden="true"><circle r="10" fill="#c9922c"/><circle r="8.2" fill="#e8b84e"/><circle r="5.6" fill="none" stroke="#c9922c" stroke-width="1.3"/><path d="M-4.5,-3.5 A5.6,5.6 0 0 1 1,-5.4" stroke="#fbe3a0" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
    <span id="vCash">$0.00</span>
  </div>
</div>

<div id="card" hidden role="dialog" aria-modal="false"></div>
<div id="toast" hidden></div>
<button id="soundBtn" hidden aria-label="Sound settings" title="Sound"><svg viewBox="-12 -12 24 24" aria-hidden="true"><path d="M-8.5,-3.2 H-4.5 L0.5,-7.5 V7.5 L-4.5,3.2 H-8.5 Z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><g class="sw" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3.8,-3.6 A5,5 0 0 1 3.8,3.6"/><path d="M6.4,-7 A9.6,9.6 0 0 1 6.4,7"/></g><g class="sx" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4.2,-3.4 L10,3.4 M10,-3.4 L4.2,3.4"/></g></svg></button>
<button id="fsBtn" hidden aria-label="Full screen" title="Full screen (F)"><svg viewBox="-12 -12 24 24" aria-hidden="true"><g class="fs-in" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-8,-3 V-8 H-3 M3,-8 H8 V-3 M8,3 V8 H3 M-3,8 H-8 V3"/></g><g class="fs-out" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-8,-3 H-3 V-8 M3,-8 V-3 H8 M8,3 H3 V8 M-3,8 V3 H-8"/></g></svg></button>
<button id="recenter" hidden aria-label="Back to the yard" title="Back to the yard (Home)"><svg viewBox="-12 -12 24 24" aria-hidden="true"><circle r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><circle r="2" fill="currentColor"/><path d="M0,-11 V-7 M0,7 V11 M-11,0 H-7 M7,0 H11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>

<script>
// Leaf Yard soundscape. Every sound is synthesized live with the Web Audio API, so there are no audio files.
// Three layers, each with its own switch in the sound card:
//   amb   - wind and rustling leaves (the main bed), robots picking up and dumping leaves, the truck
//   sfx   - mellow robot beeps, little chimes when you buy things, metal clinks
//   music - a slow, quiet waltz that comes and goes, with long leaf-only pauses in between
// The game talks to it through window.LeafSound. Nothing makes a sound until the first tap or key press unlocks audio.
(() => {
'use strict';

// v2: "Leaves & wind" (amb) is off by default. Older v1 prefs carry over, except amb starts off again.
const PREF_KEY = 'leaf-yard-sound-v2', OLD_PREF_KEY = 'leaf-yard-sound-v1';
const prefs = { on: true, vol: 0.7, amb: false, sfx: true, music: true };
try {
  let p = JSON.parse(localStorage.getItem(PREF_KEY) || 'null');
  if (!p){ p = JSON.parse(localStorage.getItem(OLD_PREF_KEY) || 'null'); if (p) p.amb = false; }
  if (p) for (const k in prefs) if (k in p && typeof p[k] === typeof prefs[k]) prefs[k] = p[k];
} catch (e) {}
const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {} };

const AC = window.AudioContext || window.webkitAudioContext;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

// How loud each layer sits in the mix (before the player's volume).
const BUS_LEVEL = { amb: 2.0, sfx: 0.55, music: 0.24 };

let ctx = null, master = null, wobble = null, noiseBuf = null;
const bus = {};
let rustleBufs = [];
let windLP, windGain, airBP, airGain;
const listeners = new Set();
const changed = () => { for (const f of listeners) try { f(prefs); } catch (e) {} };

// ───────────────────────── setup
function filt(type, freq, q){ const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; if (q != null) f.Q.value = q; return f; }
function gainNode(v){ const g = ctx.createGain(); g.gain.value = v; return g; }
function panInto(node, pan, dest){
  if (ctx.createStereoPanner){ const p = ctx.createStereoPanner(); p.pan.value = clamp(pan || 0, -1, 1); node.connect(p); p.connect(dest); return p; }
  node.connect(dest); return null;
}

function makeNoise(sec){
  const n = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

// A soft room: decaying, darkened noise used as a reverb impulse.
function makeIR(sec){
  const sr = ctx.sampleRate, n = Math.floor(sr * sec), b = ctx.createBuffer(2, n, sr);
  for (let ch = 0; ch < 2; ch++){
    const d = b.getChannelData(ch); let lp = 0;
    for (let i = 0; i < n; i++){
      lp += (Math.random() * 2 - 1 - lp) * 0.22;
      d[i] = lp * Math.pow(1 - i / n, 3.2) * Math.min(1, i / (sr * 0.012));
    }
  }
  return b;
}

// One "rustle": a hiss full of tiny clicks, which is what dry leaves sound like up close.
// shape 0 = swell, 1 = quick crunch then trail off, 2 = slow drag
function makeRustle(dur, density, shape){
  const sr = ctx.sampleRate, n = Math.floor(dur * sr), b = ctx.createBuffer(1, n, sr), d = b.getChannelData(0);
  const env = new Float32Array(n);
  for (let t = 0; ;){
    t += Math.max(1, Math.floor(-Math.log(1 - Math.random()) * sr / density));
    if (t >= n) break;
    const p = t / n, busy = shape === 1 ? Math.pow(1 - p, 1.5) : Math.sin(Math.PI * p);
    if (Math.random() > 0.25 + 0.75 * busy) continue;
    const a = Math.pow(Math.random(), 2.3), tau = rnd(0.0007, 0.0045) * sr, len = Math.min(n - t, Math.floor(tau * 6));
    for (let i = 0; i < len; i++) env[t + i] += a * Math.exp(-i / tau);
  }
  let sum = 0;
  for (let i = 0; i < n; i++){
    const p = i / n;
    const sh = shape === 1 ? Math.min(1, p * 25) * Math.pow(1 - p, 1.8) : shape === 2 ? Math.pow(Math.sin(Math.PI * p), 0.6) : Math.pow(Math.sin(Math.PI * p), 1.4);
    d[i] = (Math.random() * 2 - 1) * (0.05 + env[i]) * sh;
    sum += d[i] * d[i];
  }
  const k = 0.2 / (Math.sqrt(sum / n) || 1);
  for (let i = 0; i < n; i++) d[i] = Math.tanh(d[i] * k * 1.2);
  return b;
}

function init(given){
  ctx = given || new AC();
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 14; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.3;
  const tone = filt('lowpass', 8500, 0.5);                // nothing harsh up top
  master = gainNode(0);
  master.connect(tone); tone.connect(comp); comp.connect(ctx.destination);

  const verb = ctx.createConvolver(); verb.buffer = makeIR(2.8);
  const verbOut = gainNode(0.55); verb.connect(verbOut); verbOut.connect(master);
  // a soft echo for the beeps
  const dl = ctx.createDelay(1); dl.delayTime.value = 0.31;
  const fb = gainNode(0.26), elp = filt('lowpass', 1500, 0.4), echoOut = gainNode(0.7);
  dl.connect(elp); elp.connect(fb); fb.connect(dl); elp.connect(echoOut); echoOut.connect(master);

  const WET = { amb: 0.12, sfx: 0.32, music: 0.5 };
  for (const k of ['amb', 'sfx', 'music']){
    const g = gainNode(prefs[k] ? BUS_LEVEL[k] : 0);
    g.connect(master);
    const w = gainNode(WET[k]); g.connect(w); w.connect(verb);
    if (k === 'sfx'){ const e = gainNode(0.22); g.connect(e); e.connect(dl); }
    bus[k] = g;
  }

  // slow, tiny pitch drift on the music, like an old tape
  wobble = gainNode(5);
  const lfo = ctx.createOscillator(); lfo.frequency.value = 0.37; lfo.connect(wobble); lfo.start();

  noiseBuf = makeNoise(3);
  rustleBufs = [];
  for (let i = 0; i < 10; i++) rustleBufs.push(makeRustle(rnd(0.35, 1.5), rnd(50, 260), i % 3));

  // the wind bed: looped noise, darker when calm, a little brighter in gusts
  const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  windLP = filt('lowpass', 300, 0.3); windGain = gainNode(0);
  airBP = filt('bandpass', 1400, 0.45); airGain = gainNode(0);
  src.connect(windLP); windLP.connect(windGain); windGain.connect(bus.amb);
  src.connect(airBP); airBP.connect(airGain); airGain.connect(bus.amb);
  src.start();

  mus.t = 0; mus.plan = []; mus.idx = 0; mus.cycle = 0;
}

let pumpTimer = 0;
function unlock(){
  if (!AC) return;
  if (!ctx){
    try { init(); } catch (e) { console.warn('[sound] could not start audio', e); ctx = null; return; }
    // fade in gently instead of starting at full volume
    master.gain.setValueAtTime(0, ctx.currentTime);
    master.gain.setTargetAtTime(level(), ctx.currentTime + 0.1, 0.9);
    pumpTimer = setInterval(() => { if (ctx && ctx.state === 'running' && prefs.on) musicPump(1.4); }, 200);
    // prime iOS with a silent blip inside the gesture
    try { const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, ctx.sampleRate); s.connect(ctx.destination); s.start(); } catch (e) {}
    changed();
  }
  if (prefs.on && ctx.state !== 'running' && !document.hidden) ctx.resume().catch(() => {});
}

const level = () => prefs.on ? prefs.vol * prefs.vol * 1.5 : 0;
function applyMaster(tau){
  if (!ctx) return;
  master.gain.cancelScheduledValues(ctx.currentTime);
  master.gain.setTargetAtTime(level(), ctx.currentTime, tau == null ? 0.08 : tau);
}
let suspendTimer = 0;
function setPref(k, v){
  if (!(k in prefs)) return;
  prefs[k] = v; savePrefs();
  if (ctx){
    if (k === 'on' || k === 'vol') applyMaster();
    if (k === 'on'){
      clearTimeout(suspendTimer);
      if (v) ctx.resume().catch(() => {});
      else suspendTimer = setTimeout(() => { if (!prefs.on && ctx) ctx.suspend().catch(() => {}); }, 500);
    }
    if (k in bus) bus[k].gain.setTargetAtTime(v ? BUS_LEVEL[k] : 0, ctx.currentTime, 0.25);
    if (k === 'music' && v) mus.t = 0;   // start again from where the scheduler is now
  }
  changed();
}

document.addEventListener('visibilitychange', () => {
  if (!ctx) return;
  if (document.hidden) ctx.suspend().catch(() => {});
  else if (prefs.on) ctx.resume().catch(() => {});
});

const live = () => ctx && ctx.state === 'running' && prefs.on;
const gates = {};
function gate(key, gap){ const n = ctx.currentTime; if (n - (gates[key] ?? -99) < gap) return false; gates[key] = n; return true; }

// ───────────────────────── leaves & wind
function rustle(o, t){
  const src = ctx.createBufferSource(); src.buffer = o.buf || pick(rustleBufs);
  src.playbackRate.value = o.rate || rnd(0.75, 1.2);
  const hp = filt('highpass', o.hp || rnd(550, 1100), 0.5);
  const lp = filt('lowpass', o.bright || rnd(2800, 5200), 0.4);
  const g = gainNode(o.vol);
  src.connect(hp); hp.connect(lp); lp.connect(g);
  panInto(g, o.pan, bus[o.bus || 'amb']);
  src.start(t + (o.delay || 0));
}

// called every frame with the game's wind (roughly -50..50)
function ambStep(dt, wind, t){
  const w = clamp(Math.abs(wind) / 42, 0, 1);
  windLP.frequency.setTargetAtTime(240 + 650 * w, t, 0.6);
  windGain.gain.setTargetAtTime(0.06 + 0.2 * w * w, t, 0.7);
  airGain.gain.setTargetAtTime(0.006 + 0.035 * w * w, t, 0.9);
  if (!prefs.amb) return;
  // a gentle trickle of rustles, more when the wind picks up
  if (Math.random() < (1.6 + 4 * w * w) * dt) rustle({ vol: rnd(0.05, 0.12) * (0.7 + 0.8 * w), pan: rnd(-0.85, 0.85) }, t);
  // now and then a little pile shifts
  if (Math.random() < 0.04 * (1 + 3 * w) * dt){ const p = rnd(-0.7, 0.7), n = 2 + (Math.random() * 3 | 0); for (let i = 0; i < n; i++) rustle({ delay: rnd(0, 0.6), vol: rnd(0.04, 0.09), pan: p + rnd(-0.15, 0.15) }, t); }
}

// ───────────────────────── small instruments
function pluck(midi, t, vol, len, dest, bright){
  const f = mtof(midi), dec = clamp(0.45 + len * 0.55, 0.45, 2.4);
  const lp = filt('lowpass', bright || 3000, 0.5);
  const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.007); g.gain.setTargetAtTime(0, t + 0.01, dec / 3.5);
  const g2 = ctx.createGain(); g2.gain.setValueAtTime(0, t); g2.gain.linearRampToValueAtTime(vol * 0.28, t + 0.004); g2.gain.setTargetAtTime(0, t + 0.006, dec / 14);
  const o1 = ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = f;
  const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 3.01;   // a bright tine on the attack
  o1.connect(g); o2.connect(g2); g.connect(lp); g2.connect(lp); lp.connect(dest);
  wobble.connect(o1.detune); wobble.connect(o2.detune);
  const end = t + dec * 1.7;
  o1.start(t); o2.start(t); o1.stop(end); o2.stop(end);
  o1.onended = () => { try { wobble.disconnect(o1.detune); wobble.disconnect(o2.detune); } catch (e) {} };
}

function pad(notes, t, dur, vol){
  const lp = filt('lowpass', 750, 0.3);
  const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + Math.min(1, dur * 0.4)); g.gain.setTargetAtTime(0, t + dur, 0.55);
  lp.connect(g); g.connect(bus.music);
  const end = t + dur + 3;
  const oscs = [];
  for (const m of notes) for (const dt of [-7, 7]){
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = mtof(m); o.detune.value = dt;
    o.connect(lp); o.start(t); o.stop(end); oscs.push(o);
  }
}

function bassNote(midi, t, dur, vol){
  const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.03); g.gain.setTargetAtTime(vol * 0.5, t + 0.05, 0.4); g.gain.setTargetAtTime(0, t + dur, 0.2);
  const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = mtof(midi);
  const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = mtof(midi + 12);
  const g2 = gainNode(0.3);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(bus.music);
  o.start(t); o2.start(t); o.stop(t + dur + 1.2); o2.stop(t + dur + 1.2);
}

// ───────────────────────── robots
// Each robot has its own little voice. Bases are MIDI notes; everything is lowpassed so it stays soft.
const VOICES = [
  { base: 76, type: 'sine',     lp: 2400, gain: 1.0 },                 // Tinker: a squeaky old friend
  { base: 81, type: 'sine',     lp: 2800, gain: 0.85, fast: true },    // Pip: quick and high
  { base: 67, type: 'triangle', lp: 1500, gain: 1.0, slow: true },     // Clunk: low and steady
  { base: 72, type: 'triangle', lp: 1900, gain: 0.95, rough: true },   // Rivet: a bit wonky
  { base: 79, type: 'sine',     lp: 2600, gain: 0.9, vib: true },      // Juniper: round, with a little vibrato
  { base: 62, type: 'triangle', lp: 1300, gain: 1.0, slow: true, vib: true }, // blowers: a low, hoomy trumpet
  { base: 86, type: 'square',   lp: 2200, gain: 0.5, fast: true },     // shakers: tiny clicky crab chirps
  { base: 84, type: 'sine',     lp: 3600, gain: 0.75, vib: true },     // Sterling (robot 6): crisp, clear and a touch posh
  { base: 70, type: 'square',   lp: 1400, gain: 0.45 },                // Bolt (robot 7): a gruff factory buzzer
  { base: 74, type: 'triangle', lp: 2100, gain: 0.95, slow: true },    // Moss (robot 8): soft and unhurried
  { base: 78, type: 'triangle', lp: 2600, gain: 0.85, vib: true },     // Copper (robot 9): a little hum to it
  { base: 65, type: 'sine',     lp: 1700, gain: 1.0, rough: true },    // Ember (robot 10): low and warm
  { base: 83, type: 'triangle', lp: 3000, gain: 0.8, fast: true },    // Kettle (robot 11): a bright little toot
  { base: 69, type: 'sine',     lp: 2000, gain: 0.95, slow: true, vib: true }, // Lantern (robot 12): soft and careful
];
// notes: [semitone, seconds, glide-to semitone?]
const MOODS = {
  chat(){ const n = 2 + (Math.random() < 0.45 ? 1 : 0), out = []; let s = pick([0, 2, 4, 7]); for (let i = 0; i < n; i++){ out.push([s, rnd(0.06, 0.11)]); s = pick([0, 2, 4, 7, 9].filter(x => x !== s)); } if (Math.random() < 0.4) out[out.length - 1][2] = out[out.length - 1][0] + pick([2, -2, 3]); return out; },
  happy: () => [[0, 0.07], [4, 0.07], [7, 0.14, 9]],
  hmm:   () => [[4, 0.13], [0, 0.2, -3]],
  ok:    () => [[7, 0.07], [12, 0.1]],
  sleepy: () => [[2, 0.2, -2]],
  proud: () => [[0, 0.06], [4, 0.06], [7, 0.06], [12, 0.2, 14]],
  hello: () => [[7, 0.09], [4, 0.08], [12, 0.24, 12.6]],
};
function beepAt(ri, mood, pan, vol, t){
  const v = VOICES[((ri | 0) % VOICES.length + VOICES.length) % VOICES.length], notes = (MOODS[mood] || MOODS.chat)();
  const sp = v.fast ? 0.8 : v.slow ? 1.25 : 1;
  const o = ctx.createOscillator(); o.type = v.type;
  const lp = filt('lowpass', v.lp, 0.7), g = ctx.createGain(); g.gain.setValueAtTime(0, t);
  o.connect(lp); lp.connect(g); panInto(g, pan, bus.sfx);
  let vib = null;
  if (v.vib || v.rough){ vib = ctx.createOscillator(); vib.frequency.value = v.vib ? 6.5 : 13; const vg = gainNode(v.vib ? 22 : 14); vib.connect(vg); vg.connect(o.detune); vib.start(t); }
  const peak = 0.1 * (vol == null ? 1 : vol) * v.gain;
  let tt = t;
  o.frequency.setValueAtTime(mtof(v.base + notes[0][0]), t);
  for (const [s, d0, gl] of notes){
    const d = d0 * sp;
    o.frequency.setTargetAtTime(mtof(v.base + s), tt, 0.009);
    if (gl != null) o.frequency.setTargetAtTime(mtof(v.base + gl), tt + d * 0.35, d * 0.45);
    g.gain.setTargetAtTime(peak, tt, 0.007);
    g.gain.setTargetAtTime(0, tt + d, 0.02);
    tt += d + 0.035 * sp;
  }
  o.start(t); o.stop(tt + 0.3); if (vib) vib.stop(tt + 0.3);
}

function tinkAt(pan, vol, t){
  const f = rnd(1750, 2250);
  for (const [k, a, tau] of [[1, 1, 0.07], [2.76, 0.45, 0.035]]){
    const o = ctx.createOscillator(); o.frequency.value = f * k;
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.045 * vol * a, t + 0.002); g.gain.setTargetAtTime(0, t + 0.003, tau);
    o.connect(g); panInto(g, pan, bus.sfx); o.start(t); o.stop(t + 0.5);
  }
}

// a soft putter for the compost truck: low noise pulsed about eleven times a second
function rumble(t, dur, panFrom, panTo, vol){
  const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true; src.loopStart = rnd(0, 2);
  const lp = filt('lowpass', 260, 1.1), am = gainNode(0.55), env = ctx.createGain();
  const lfo = ctx.createOscillator(); lfo.frequency.value = rnd(10, 12.5); const lg = gainNode(0.45); lfo.connect(lg); lg.connect(am.gain);
  env.gain.setValueAtTime(0, t); env.gain.linearRampToValueAtTime(vol, t + Math.min(0.7, dur * 0.3)); env.gain.setValueAtTime(vol, t + dur * 0.6); env.gain.linearRampToValueAtTime(0, t + dur);
  src.connect(lp); lp.connect(am); am.connect(env);
  const p = panInto(env, panFrom, bus.amb);
  if (p){ p.pan.setValueAtTime(clamp(panFrom, -1, 1), t); p.pan.linearRampToValueAtTime(clamp(panTo, -1, 1), t + dur); }
  src.start(t); lfo.start(t); src.stop(t + dur + 0.1); lfo.stop(t + dur + 0.1);
}

function hornAt(pan, t){
  for (let i = 0; i < 2; i++){
    const s = t + i * 0.24, g = ctx.createGain(), lp = filt('lowpass', 1100, 0.6);
    g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(0.06, s + 0.025); g.gain.setValueAtTime(0.06, s + 0.12); g.gain.linearRampToValueAtTime(0, s + 0.17);
    for (const m of [67, 71]){ const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = mtof(m); o.connect(lp); o.start(s); o.stop(s + 0.2); }
    lp.connect(g); panInto(g, pan, bus.sfx);
  }
}

// ───────────────────────── music: a slow waltz in F that comes and goes
const BEAT = 60 / 78, BAR = BEAT * 3;
const CHORDS = {
  F:  { pad: [53, 57, 60, 64], root: 41 },
  Am: { pad: [57, 60, 64, 67], root: 45 },
  Bb: { pad: [58, 62, 65, 69], root: 46 },
  Dm: { pad: [50, 57, 60, 65], root: 38 },
  Gm: { pad: [55, 58, 62, 65], root: 43 },
  C:  { pad: [48, 55, 58, 64], root: 36 },
};
// [bar, beat, midi, beats]
const TUNE_A = [
  [0, 0, 72, 2], [0, 2, 69, 1],
  [1, 0, 76, 2], [1, 2, 72, 1],
  [2, 0, 74, 1.5], [2, 1.5, 72, 0.5], [2, 2, 70, 1],
  [3, 0, 69, 3],
  [4, 0, 74, 2], [4, 2, 77, 1],
  [5, 0, 74, 1], [5, 1, 72, 1], [5, 2, 70, 1],
  [6, 0, 69, 1.5], [6, 1.5, 70, 0.5], [6, 2, 67, 1],
  [7, 0, 67, 1.5], [7, 1.5, 69, 0.5], [7, 2, 70, 1],
];
const CH_A = ['F', 'Am', 'Bb', 'F', 'Dm', 'Bb', 'Gm', 'C'];
const TUNE_B = [
  [0, 0, 77, 2], [0, 2, 72, 1],
  [1, 0, 76, 1], [1, 1, 74, 1], [1, 2, 72, 1],
  [2, 0, 74, 2], [2, 2, 77, 1],
  [3, 0, 72, 3],
  [4, 0, 69, 1], [4, 1, 74, 1], [4, 2, 77, 1],
  [5, 0, 77, 1.5], [5, 1.5, 76, 0.5], [5, 2, 74, 1],
  [6, 0, 67, 1], [6, 1, 72, 1], [6, 2, 76, 1],
  [7, 0, 77, 3],
];
const CH_B = ['F', 'Am', 'Bb', 'F', 'Dm', 'Bb', 'C', 'F'];

const mus = { t: 0, plan: [], idx: 0, cycle: 0 };
function phrase(chords, tune, o){
  return chords.map((c, i) => ({ chord: c, mel: tune ? tune.filter(n => n[0] === i).map(n => [n[1], n[2], n[3]]) : [], pad: true, bass: o.bass, oom: o.oom, oct: o.oct || 0, vel: o.vel || 1 }));
}
function buildPlan(cycle){
  const bars = [];
  const rest = n => { for (let i = 0; i < n; i++) bars.push({ rest: true }); };
  rest(cycle === 0 ? 4 : 0);
  // a soft way in
  bars.push(...phrase(['F', 'Bb', 'F', 'C'], null, { bass: true, oom: false }));
  const musicBox = cycle > 0 && Math.random() < 0.4;   // sometimes the tune comes back an octave up, sparser
  const o = musicBox ? { bass: false, oom: false, oct: 12, vel: 0.75 } : { bass: true, oom: true };
  bars.push(...phrase(CH_A, TUNE_A, o));
  bars.push(...phrase(CH_B, TUNE_B, o));
  if (Math.random() < 0.5) bars.push(...phrase(CH_B, TUNE_B, { bass: true, oom: false, oct: musicBox ? 0 : 12, vel: 0.7 }));
  // drift out, then a long stretch of just leaves and wind
  bars.push(...phrase(['Bb', 'F'], null, { bass: true, oom: false }));
  rest(Math.round(rnd(20, 50) / BAR));
  return bars;
}
function playBar(b, t){
  if (b.rest) return;
  const c = CHORDS[b.chord];
  if (b.pad) pad(c.pad, t, BAR + 0.15, 0.022);
  if (b.bass) bassNote(c.root, t, BAR * 0.9, 0.07);
  if (b.oom){ const top = c.pad.slice(-2); for (const k of [1, 2]) for (const m of top) pluck(m, t + k * BEAT, 0.03, 0.6, bus.music, 1800); }
  for (const [beat, m, d] of b.mel) pluck(m + b.oct, t + beat * BEAT + rnd(-0.006, 0.012), (0.12 + rnd(-0.015, 0.015)) * b.vel, d * BEAT, bus.music, b.oct ? 3800 : 3000);
}
function musicPump(horizon, now){
  if (!prefs.music) return;
  now = now == null ? ctx.currentTime : now;
  if (mus.t < now) mus.t = now + 0.2;
  while (mus.t < now + horizon){
    if (mus.idx >= mus.plan.length){ mus.plan = buildPlan(mus.cycle++); mus.idx = 0; }
    playBar(mus.plan[mus.idx++], mus.t);
    mus.t += BAR;
  }
}

// ───────────────────────── public API (positions come in as pan -1..1 and a 0..1 loudness)
const api = {
  prefs,
  get ready(){ return !!ctx; },
  unlock,
  set: setPref,
  toggle(k){ setPref(k, !prefs[k]); },
  onChange(f){ listeners.add(f); },

  update(dt, wind){ if (live()) ambStep(dt, wind, ctx.currentTime); },

  // a robot's arm closes on some leaves
  grab(n, pan, vol){ if (!live() || !prefs.amb || !gate('grab', 0.08)) return; rustle({ buf: rustleBufs[1 + 3 * (Math.random() * 3 | 0)], rate: rnd(1.1, 1.45), vol: (0.07 + 0.015 * Math.min(n, 6)) * vol, pan, bright: rnd(3500, 5500) }, ctx.currentTime); },
  // leaves tip into the bin
  dump(n, pan, vol){ if (!live() || !prefs.amb || !gate('dump', 0.12)) return; const t = ctx.currentTime; const k = Math.min(3, 1 + Math.floor(n / 4)); for (let i = 0; i < k; i++) rustle({ delay: i * 0.07, rate: rnd(0.8, 1.05), vol: (0.09 + 0.01 * Math.min(n, 8)) * vol, pan: pan + rnd(-0.08, 0.08), bright: rnd(2600, 4200) }, t); },
  // your tap pushes the leaves around
  kick(n, pan){ if (!live() || !prefs.amb || !gate('kick', 0.05)) return; const t = ctx.currentTime; rustle({ rate: rnd(1.0, 1.3), vol: n ? clamp(0.08 + n * 0.012, 0.08, 0.2) : 0.05, pan, bright: n ? rnd(3800, 5600) : 2600 }, t); if (n > 6) rustle({ delay: 0.05, vol: 0.08, pan: pan + 0.1 }, t); },
  // a robot says something
  beep(ri, mood, pan, vol, force){
    if (!live() || !prefs.sfx) return;
    if (!force && !gate('chatter', 7)) return;
    if (force && !gate('beep' + mood + ri, 0.25)) return;
    beepAt(ri, mood, pan || 0, vol, ctx.currentTime + 0.02);
  },
  tink(pan, vol){ if (!live() || !prefs.sfx || !gate('tink', 0.14)) return; tinkAt(pan, vol, ctx.currentTime); },
  clink(n, pan, vol){ if (!live() || !prefs.sfx || !gate('clink', 0.2)) return; for (let i = 0; i < Math.min(n, 4); i++) tinkAt(pan + rnd(-0.1, 0.1), vol * 0.8, ctx.currentTime + i * 0.06); },
  // paper rustle when a card opens
  paper(){ if (!live() || !prefs.sfx || !gate('paper', 0.1)) return; rustle({ buf: rustleBufs[2], rate: rnd(1.4, 1.7), vol: 0.05, pan: 0, bright: 6000, hp: 1500, bus: 'sfx' }, ctx.currentTime); },
  deny(){ if (!live() || !prefs.sfx || !gate('deny', 0.15)) return; beepAt(2, 'hmm', 0, 0.6, ctx.currentTime); },

  truckIn(pan, dur){ if (!live() || !prefs.amb) return; rumble(ctx.currentTime, dur || 2.6, 0.95, pan, 0.5); },
  truckOut(pan){ if (!live() || !prefs.amb) return; rumble(ctx.currentTime, 2.4, pan, -1, 0.5); },
  horn(pan){ if (!live() || !prefs.sfx || !gate('horn', 3)) return; hornAt(pan, ctx.currentTime + 0.05); },
  // the bin is tipped into the truck
  pour(leaves, metal, pan){
    if (!live()) return;
    const t = ctx.currentTime;
    if (prefs.amb && leaves > 0){ const n = clamp(Math.round(2 + leaves / 6), 2, 10); for (let i = 0; i < n; i++) rustle({ delay: 0.45 + i * rnd(0.09, 0.16), rate: rnd(0.75, 1.1), vol: rnd(0.08, 0.13), pan: pan + rnd(-0.15, 0.15), bright: rnd(2500, 4200) }, t); }
    if (prefs.sfx && metal > 0) for (let i = 0; i < Math.min(metal, 6); i++) tinkAt(pan + rnd(-0.1, 0.1), 0.7, t + 0.55 + i * 0.09);
  },
  // the truck pays: a small music-box arpeggio, longer for bigger loads
  coins(amount){
    if (!live() || !prefs.sfx || !gate('coins', 0.4)) return;
    const n = clamp(2 + Math.round(Math.log10(1 + amount)), 3, 6), notes = [77, 81, 84, 86, 89, 93], t = ctx.currentTime + 0.05;
    for (let i = 0; i < n; i++) pluck(notes[i], t + i * 0.085, 0.07, 0.5, bus.sfx, 4200);
  },
  // purchases
  chime(kind){
    if (!live() || !prefs.sfx || !gate('chime', 0.08)) return;
    const t = ctx.currentTime + 0.02;
    if (kind === 'land'){
      pad([53, 60, 64, 67, 69], t, 2.6, 0.03);
      [65, 69, 72, 76, 77, 81].forEach((m, i) => pluck(m, t + 0.2 + i * 0.13, 0.08, 1, bus.sfx, 3800));
    } else if (kind === 'tech'){
      [72, 76, 79, 84, 88].forEach((m, i) => pluck(m, t + i * 0.07, 0.065, 0.6, bus.sfx, 4500));
    } else if (kind === 'sale'){
      pluck(81, t, 0.07, 1, bus.sfx, 4000); pluck(77, t + 0.18, 0.07, 1.4, bus.sfx, 4000);
    } else {
      pluck(79, t, 0.06, 0.5, bus.sfx, 4000); pluck(84, t + 0.08, 0.06, 0.8, bus.sfx, 4000);
    }
  },

  // test hook: render into an OfflineAudioContext
  _test: {
    init(c){ init(c); master.gain.value = level(); },
    ambStep, beepAt, musicPump, tinkAt, rumble, hornAt, pluck,
    api: () => api,
    force(){ return { ctx, bus }; },
  },
};
window.LeafSound = api;
})();

function trackCap(k){
  let n = 0;
  for (const g of TRACKS[k].gens){ if (g.tech && !S.tech[g.tech]) break; if (g.needsMetal && !S.metalSlot) break; if (g.needsPack && !packOpen()) break; if (g.needsShaft && !S.shafts.length) break; if (g.needsPlant && !S.plant.built) break; n += g.n; }

}
const trackMax = k => TRACKS[k].vals.length - 1;
function trackVisible(k){ if (k === 'snip') return S.hive.built; if (k === 'pack') return packOpen(); if (k === 'dig') return S.shafts.length > 0; if (k === 'stoke') return S.plant.built; if (k === 'grab') return !!S.tech.claw; if (k === 'reach') return !!S.tech.arm; if (k === 'drill' || k === 'magnet') return S.metalSlot; return true; }
function genAt(k, level){ let acc = 0; const gens = TRACKS[k].gens; for (let gi=0; gi<gens.length; gi++){ const g = gens[gi]; if (level < acc + g.n) return { gi, g, idx: level - acc }; acc += g.n; } return null; }
function genNameAt(k, level){ let acc = 0, name = TRACKS[k].gens[0].name; for (const g of TRACKS[k].gens){ if (g.n > 0 && level > acc) name = g.name; acc += g.n; } return name; }

function botCost(kind, i, k){

  if (!ge) return null;
  const full = ge.g.cost[ge.idx];
  const disc = !NO_DISCOUNT.includes(k) && peersFor(k).some(c => c !== me && c.lv[k] > L);
  return { cost: disc ? niceCost(full*discFor(k)) : full, full, disc };
}
const rCost = (ri, k) => botCost('robot', ri, k);

const robotCost = n => niceCost(ROBOT_COST[n]*(gl('bulk') ? 0.75 : 1));
// "Upgrade all" on a track: first it brings every robot up to the best robot's level (all copied, so all discounted);
// once they match, it adds one level to everyone: one at full price, the rest at the copied-level price.
function allPlan(k){
  const peers = peersFor(k), n = peers.length;
  if (n < 2 || !trackVisible(k)) return null;
  const lv = peers.map(r => r.lv[k]), top = Math.max(...lv), cap = trackCap(k);
  const price = (L, disc) => { const ge = genAt(k, L); if (!ge) return null; const f = ge.g.cost[ge.idx]; return disc && !NO_DISCOUNT.includes(k) ? niceCost(f*discFor(k)) : f; };
  let cost = 0, full = 0, target;
  if (lv.some(l => l < top)){
    target = top;
    for (const l of lv) for (let L=l; L<top; L++){ cost += price(L, true); full += price(L, false); }
  } else {
    if (top >= cap || top >= trackMax(k)) return null;
    target = top + 1;
    const f = price(top, false); cost = f + (n - 1)*price(top, true); full = f*n;
  }
  const behind = lv.filter(l => l < target).length;
  return { cost: Math.round(cost*100)/100, full, target, catchUp: target === top, behind };
}
// the first locked tier of a track, if it can be unlocked yet (prerequisites met and its price in sight)
function nextUnlock(k){ for (const g of TRACKS[k].gens){ if (!g.tech) continue; if (!S.tech[g.tech]) return techAvailable(g.tech) ? g.tech : null; } return null; }

function techAvailable(id){ const t = TECH[id]; if (S.tech[id]) return false; if (t.needs && !S.tech[t.needs]) return false; if (t.needsMiner && !S.miners.length) return false; if (t.needsKind && !S[t.needsKind].length) return false; if (t.needsPack && !packOpen()) return false; if (t.needsShaft && !(S.shafts.length && S.blowers.length)) return false; if (t.needsPlantBlower && !(S.plant.built && S.blowers.some(b => b.lv.stoke > 0))) return false; return ALWAYS_SHOWN.includes(id) || seenPrice(t.cost); }

// and a "Don't" pile. A robot does the first task that has work, and looks again whenever it finishes a bit of work.
const TASKS = {
  leaves: { name:'Gather leaves', short:'Leaves', col:'#d9652a', kind:'robot' },
  mine:   { name:'Mine metal',    short:'Mine',   col:'#7d868c', kind:'robot' },

const KIND_TASKS = { robot:['leaves','mine','bag','jar','smelt','haul'], blower:['blow','dig','stoke'], shaker:['shake','snip'] };
// is the task there at all yet (its building bought, the skill learned)?
function taskOpen(t, cfg){
  switch (t){
    case 'mine': return S.metalSlot;
    case 'bag': return S.bag.built;
    case 'jar': return S.hive.built;
    case 'smelt': case 'haul': return S.plant.built;
    case 'dig': return !!(cfg && cfg.lv.dig > 0) && S.shafts.length > 0;
    case 'stoke': return !!(cfg && cfg.lv.stoke > 0) && S.plant.built;
    case 'snip': return !!(cfg && cfg.lv.snip > 0) && S.hive.built;
  }
  return true;
}
function tasksFix(cfg, kind){
  // every task of this kind appears exactly once, in Do or in Don't; rows hold at most two
  const all = KIND_TASKS[kind], seen = new Set();
  let prio = Array.isArray(cfg.prio) ? cfg.prio : [], off = Array.isArray(cfg.off) ? cfg.off : [];
  prio = prio.map(row => (Array.isArray(row) ? row : [row]).filter(t => all.includes(t) && !seen.has(t) && seen.add(t)).slice(0, 2)).filter(r => r.length);
  off = off.filter(t => all.includes(t) && !seen.has(t) && seen.add(t));
  for (const t of all) if (!seen.has(t)) off.push(t);
  cfg.prio = prio; cfg.off = off;
  return cfg;
}
function taskRemove(cfg, t){ cfg.prio = cfg.prio.map(r => r.filter(x => x !== t)).filter(r => r.length); cfg.off = cfg.off.filter(x => x !== t); }
const taskOn = (cfg, t) => cfg.prio.some(r => r.includes(t));
const taskTop = (cfg, t) => !!cfg.prio.length && cfg.prio[0].includes(t);
function putTop(cfg, t){ taskRemove(cfg, t); cfg.prio.unshift([t]); }
function putOff(cfg, t){ taskRemove(cfg, t); cfg.off.push(t); }
// a newly learned helper skill goes next to the main task (same priority) so the helper mixes the two
// V7: a robot whose list you've changed (anything in its Don't pile) doesn't get newly opened tasks put on its list;
// they go in its Don't pile instead. Robots that still do everything get them, in their usual place.
const kindOfCfg = cfg => S.blowers.includes(cfg) ? 'blower' : S.shakers.includes(cfg) ? 'shaker' : 'robot';
const hasDont = (cfg, kind, fresh) => cfg.off.some(x => !fresh.includes(x) && taskOpen(x, cfg));
function putBeside(cfg, t, main){
  if (taskOn(cfg, t)) return;
  if (hasDont(cfg, kindOfCfg(cfg), [t])){ putOff(cfg, t); return; }
  taskRemove(cfg, t); const row = cfg.prio.find(r => r.includes(main)); if (row && row.length < 2) row.push(t); else cfg.prio.push([t]);
}
// a building just opened tasks `ts` for the regular robots
function openTasks(ts){
  for (const cfg of S.robots){
    if (hasDont(cfg, 'robot', ts)){ for (const t of ts) putOff(cfg, t); continue; }
    for (const t of ts){
      if (taskOn(cfg, t)) continue;
      taskRemove(cfg, t);
      // back in its default row: beside a task from the same default row if there's room, otherwise a row of its own there
      const di = DEFAULT_PRIO.robot.findIndex(r => r.includes(t)), mates = DEFAULT_PRIO.robot[di] || [];
      const row = cfg.prio.find(r => r.length < 2 && r.some(x => mates.includes(x)));
      if (row) row.push(t); else cfg.prio.splice(Math.min(di, cfg.prio.length), 0, [t]);
    }
  }
}

// V6.3: a new robot has every task in Do (tasks that aren't there yet are just skipped), so nothing is left undone if

const DEFAULT_PRIO = { robot: [['bag', 'jar'], ['smelt', 'haul'], ['mine'], ['leaves']], blower: [['dig', 'stoke'], ['blow']], shaker: [['shake', 'snip']] };

const helperShown = kind => cfgsOf(kind).length < HELPER_MAX && (cfgsOf(kind).length > 0 || seenPrice(helperCost(kind)));

// ── player camera: wheel / pinch zoom, drag to pan, WASD or arrow keys, Home to recenter
// The camera may wander a little past your fence, but never far down the road or off your land.
function camBounds(z = cam.z){
  const A = AREAS[S.land], O = owned();
  const mx = 120 + 0.05*A.w, my = 110 + 0.05*A.h;
  // zoomed in, the road may fill at most about a fifth of the screen
  const y1 = clamp(0.22*H/z - VERGE, 20, ROAD + 6);
  return { x0: O.x0 - mx, x1: O.x1 + mx, y0: O.y0 - my, y1 };
}
function zoomLimits(){ const fit = camTarget(S.land).z; return [fit*0.85, Math.max(2.8, fit*1.7)]; }
function clampCam(){
  const [zmin, zmax] = zoomLimits();
  const c = s2w(W/2, H/2);
  cam.z = clamp(cam.z, zmin, zmax);
  const B = camBounds(), hw = W/2/cam.z, hh = H/2/cam.z;
  // along each axis: keep the view inside the bounds; if the view is bigger than the bounds,
  // centre it sideways, and pin the road to the bottom edge vertically (extra room shows the woods instead)
  const cx = 2*hw >= B.x1 - B.x0 ? (B.x0 + B.x1)/2 : clamp(c.x, B.x0 + hw, B.x1 - hw);
  const cy = 2*hh >= B.y1 - B.y0 ? B.y1 - hh : clamp(c.y, B.y0 + hh, B.y1 - hh);
  cam.ox = W/2 - cx*cam.z; cam.oy = H/2 - cy*cam.z;
}
function zoomAt(sx, sy, f){
  const w = s2w(sx, sy), [zmin, zmax] = zoomLimits();
  const nz = clamp(cam.z*f, zmin, zmax);
  cam.z = nz; cam.ox = sx - w.x*nz; cam.oy = sy - w.y*nz;
  clampCam(); userMoved();
}
function userMoved(){

function recenter(){

const MAPLE = (() => { const h = [[0,-1],[0.12,-0.62],[0.38,-0.8],[0.32,-0.42],[0.74,-0.52],[0.58,-0.2],[0.98,-0.02],[0.62,0.1],[0.7,0.32],[0.3,0.24],[0.08,0.42],[0,0.5]]; const p = h.slice(); for (let i=h.length-2;i>0;i--) p.push([-h[i][0], h[i][1]]); return p; })();

  c.lineWidth = 0.09; c.strokeStyle = col.v; c.lineCap = 'round';

function landingOK(x, y){
  const O = owned();
  if (x < O.x0 + 8 || x > O.x1 - 8 || y < O.y0 + 6 || y > O.y1 - 4) return false;
  if (Math.abs(x - SHED.x) < 60 && y > SHED.y - 72) return false;
  if (x > BIN.x - 46 && x < BIN.x + 82 && y > BIN.y - 56) return false;
  if (hiveShown() && Math.abs(x - HIVE.x) < 36 && y > HIVE.y - 165 && y < HIVE.y + 12) return false;
  if (S.hive.built && Math.abs(x - CRATE.x) < 26 && y > CRATE.y - 58 && y < CRATE.y + 8) return false;
  if (baggerShown() && Math.abs(x - BAGGER.x) < 34 && y > BAGGER.y - 30 && y < BAGGER.y + 8) return false;
  if (S.plant.built && Math.abs(x - PALLET.x) < 28 && y > PALLET.y - 26 && y < PALLET.y + 8) return false;
  if (plantShown() && x > PLANT.x - 104 && x < PLANT.x + 104 && y > PLANT.y - 66 && y < PLANT.y + 8) return false;
  // not inside a bush or against a trunk, where nobody could see the leaf
  for (const b of BUSHES){ const dx = (x - b.x)/(36*b.s), dy = (y - b.y + 8*b.s)/(18*b.s); if (dx*dx + dy*dy < 1) return false; }
  for (const t of TREES){ const by = trunkBase(t); if (Math.abs(x - t.x) < Math.max(14, t.r*0.15) && y > by - 16 && y < by + 3) return false; }
  return true;
}

function spawnCollectable(onGround){

function treeDropSpots(t){
  // landing spots along the lower edge of the canopy (so the pile isn't hidden under it), denser in the middle
  const out = [];
  for (let k=0;k<60;k++){ const a = rand(0, TAU), d = Math.pow(Math.random(), 0.8); const x = t.x + Math.cos(a)*d*t.r*0.45, y = t.y + t.r*1.12 + Math.sin(a)*d*t.r*0.16; if (landingOK(x, y)) out.push({ x, y }); }
  return out;
}
function treeDrop(force){
  const A = AREAS[S.land];
  const opts = [];
  TREES.forEach((t, i) => { const spots = treeDropSpots(t); if (spots.length >= 12) opts.push({ t, i, spots, w: t.r*spots.length }); });
  if (!opts.length) return false;
  let pick = Math.random()*opts.reduce((a, o) => a + o.w, 0), o = opts[0];
  for (const q of opts){ pick -= q.w; if (pick <= 0){ o = q; break; } }
  const n = Math.round(rand(0.13, 0.2)*A.cap + o.t.r*0.08);
  if (!force && groundN + n > A.cap*1.3) return false;
  for (let k=0;k<n;k++){
    const p = o.spots[Math.floor(Math.random()*o.spots.length)], x = p.x + rand(-6, 6), ly = p.y + rand(-4, 4);
    if (!landingOK(x, ly)) continue;
    const fall = rand(70, 190), l = newLeaf(x, ly - fall, ly, true);
    l.vy = rand(55, 85); l.sw = rand(6, 14);           // a heavy shower: falls faster and straighter
    l.x -= wind*l.wf*fall/l.vy;
    if (simMode){ l.y = ly; l.x = x; l.st = 'ground'; }
    else l.y -= rand(0, 1.4)*l.vy;                     // spread the shower over about a second and a half
    leaves.push(l);
  }
  treeShake[o.i] = 1.6; S.totals.drops = (S.totals.drops || 0) + 1;
  if (!simMode){
    pop(o.t.x, o.t.y - o.t.r*0.55, 'whoosh!', 'note', 20);

}

function moveTo(r, x, y, sp, dt){

  if (Math.abs(dx) > 1.5) r.face = dx > 0 ? 1 : -1;
  if (d <= sp*dt + 0.5){ r.x = x; r.y = y; return true; }

}

function mineSlotFor(r){
  const cfg = S.robots[r.id];
  if (cfg.miner != null && S.miners.includes(cfg.miner)) return cfg.miner;
  let best = null, bd = 1e18;
  for (const sp of S.miners){
    if (minerWorkers(sp).length >= slotsAt(sp)) continue;
    const p = SPOTS[sp], d = 0.5*Math.hypot(p.x - r.x, p.y - r.y) + Math.hypot(p.x - BIN.x, p.y - BIN.y);

function stationPos(t, i){
  if (t === 'bag') return BAG_SPOTS[i] || BAG_SPOTS[0];
  if (t === 'jar') return JAR_SPOTS[i] || JAR_SPOTS[0];
  return { x: PLANT.x + (i - 1)*40 - 9, y: PLANT.y + 15, face: 1 };
}
function stationFree(t, r){ const a = STN[t], mine = a.indexOf(r.id); return mine >= 0 ? mine : a.indexOf(null); }
function claimStation(t, r){ const a = STN[t], i = stationFree(t, r); if (i >= 0) a[i] = r.id; r.spot = i; return i; }
function releaseStations(r, keep){ for (const t in STN){ if (t === keep) continue; const a = STN[t]; for (let i=0;i<a.length;i++) if (a[i] === r.id) a[i] = null; } }
function resetStations(){ for (const t in STN) STN[t].fill(null); }
const busyIn = st => { let n = 0; for (const q of R) if (q.st === st) n++; return n; };
const claimedRack = r => { let n = 0; for (const q of R) if (q !== r && q.st === 'toRack') n += ingotCarry(q.id); return n; };
const plainJars = () => Math.floor(S.hive.honey + 1e-9);
const bagRoom = () => Math.max(0, bagCap() - S.bag.bags - busyIn('bag'));
// leaves a bagger can get at: its own basket, the loose leaves in the bin, and baskets of robots stuck waiting at a full bin
const donorsFor = r => R.filter(q => q !== r && q.st === 'wait' && q.at !== 'metal' && q.carryL > 0);
const bagLeavesFor = r => r.carryL + S.binLeaves + donorsFor(r).reduce((n, q) => n + q.carryL, 0);
const oreNeed = () => ORE_PER_INGOT;

// is there work of task t for robot r right now?
function taskWork(r, t){
  switch (t){
    case 'leaves': return (binRoom() > 0 || r.carryL < leafCap(r.id)) && hasLeaves();
    case 'mine': return S.metalSlot && mineSlotFor(r) != null && (metalRoom() > 0 || r.carryM < metalCarry(r.id));
    case 'bag': return S.bag.built && stationFree('bag', r) >= 0 && bagRoom() > 0 && bagLeavesFor(r) >= BAG_SIZE;
    case 'jar': return S.hive.built && stationFree('jar', r) >= 0 && plainJars() >= 1 && crateJars() + busyIn('jar') < crateCap();
    case 'smelt':
      if (!S.plant.built || stationFree('smelt', r) < 0 || S.plant.rack + busyIn('smelt') >= RACK_CAP) return false;
      return S.plant.ore + r.carryM >= metalPerIngot() - 1e-9 || (r.carryM > 0 && hopperRoom() > 0) || (S.binMetal > 0 && hopperRoom() > 0);
    case 'haul': return S.plant.built && palletRoom() > 0 && (r.carryI > 0 || S.plant.rack - claimedRack(r) > 0);
  }
  return false;
}
// Walk the priority list: the first row with any work wins. Two tasks side by side in a row share the priority:
// the robot sticks with the one it's on for a few rounds, then swaps if the other has work too.
function chooseTask(who, cfg, work){
  for (const row of cfg.prio){
    let a = null, b = null;
    for (const t of row){ if (!taskOpen(t, cfg) || !work(t)) continue; if (!a) a = t; else b = t; }
    if (!a) continue;
    if (!b) return a;
    const cur = who.lastTask === a ? a : who.lastTask === b ? b : null;
    if (cur && (who.streak || 0) < 3) return cur;
    return cur === a ? b : a;
  }
  return null;
}
function noteTask(who, t){ if (t && t !== who.lastTask){ who.lastTask = t; who.streak = 0; } }
function unitDone(who, t){ if (who.lastTask === t) who.streak = (who.streak || 0) + 1; else { who.lastTask = t; who.streak = 1; } }
// Some things jump the queue for anyone who has the task anywhere in Do: when the bin is full (or its own basket is),
// a robot with Bag leaves bags; when the metal tub is full (or it's holding enough metal and the hopper is full), a
// robot with Smelt ingots smelts. So a robot that gathers and bags bags its own leaves before picking new ones.
function urgentTask(r, cfg){
  if (S.bag.built && taskOn(cfg, 'bag') && (binRoom() <= 0 || r.carryL >= Math.min(BAG_SIZE, leafCap(r.id))) && taskWork(r, 'bag')) return 'bag';
  if (S.hive.built && taskOn(cfg, 'jar') && S.hive.honey >= honeyCap() - 1e-6 && taskWork(r, 'jar')) return 'jar';
  if (S.plant.built && taskOn(cfg, 'smelt') && ((S.metalSlot && tubRoom() <= 0) || (r.carryM >= oreNeed() && hopperRoom() <= 0)) && taskWork(r, 'smelt')) return 'smelt';
  return null;
}
const robotTask = r => { const cfg = S.robots[r.id]; return urgentTask(r, cfg) || chooseTask(r, cfg, t => taskWork(r, t)); };
// Plans a grab: a spot for the hand plus up to `grab` leaves the fingers can reach from it.
// With a claw the robot looks for a patch of leaves, not just the nearest one.
function freeLeaf(l, r){ return l.st === 'ground' && l.collect && (!l.claim || l.claim === r); }
function pickTarget(r){
  const grab = rv(r.id, 'grab'), spread = clawSpread(r.id);
  const cand = [];
  for (const l of leaves){
    if (l.st !== 'ground' || !l.collect || l.claim) continue;
    cand.push([Math.hypot(l.x - r.x, l.y - r.y) + 0.25*Math.hypot(l.x - BIN.x, l.y - BIN.y), l]);
  }
  if (!cand.length) return null;
  if (grab <= 1){ let b = cand[0]; for (const c of cand) if (c[0] < b[0]) b = c; return { ls:[b[1]] }; }
  cand.sort((a, b) => a[0] - b[0]);
  const reach = rv(r.id, 'reach');
  let best = null, bs = 1e18;
  for (let i=0; i<Math.min(16, cand.length); i++){
    const ls = patchAround(cand[i][1], grab, spread, cand);
    const h = centroid(ls);
    const walk = Math.max(0, Math.hypot(h.x - r.x, h.y - r.y) - reach*0.7) + 0.25*Math.hypot(h.x - BIN.x, h.y - BIN.y);
    const sc = walk - 34*(ls.length - 1);
    if (sc < bs){ bs = sc; best = ls; }
  }
  return { ls: best };
}
// the seed leaf plus its nearest neighbours that all fit inside one claw spread
function patchAround(seed, grab, spread, cand){
  const near = [];
  for (const c of cand){ const m = c[1]; if (m === seed) continue; const dx = m.x - seed.x, dy = m.y - seed.y; if (Math.abs(dx) > spread*2 || Math.abs(dy) > spread*2) continue; const d = Math.hypot(dx, dy); if (d <= spread*2) near.push([d, m]); }
  near.sort((a, b) => a[0] - b[0]);
  let ls = [seed];
  for (const [, m] of near){ if (ls.length >= grab) break; ls.push(m); }
  // drop anything the fingers can't reach from the middle of the patch
  for (let k=0; k<2 && ls.length > 1; k++){ const h = centroid(ls); ls = ls.filter(l => l === seed || Math.hypot(l.x - h.x, l.y - h.y) <= spread); }
  return ls;
}
function centroid(ls){ let x = 0, y = 0; for (const l of ls){ x += l.x; y += l.y; } return { x: x/ls.length, y: y/ls.length }; }
function planAlive(r){ if (!r.plan) return null; r.plan = r.plan.filter(l => l.st === 'ground' && l.claim === r); return r.plan.length ? centroid(r.plan) : null; }
const hasLeaves = () => { for (const l of leaves) if (l.st === 'ground' && l.collect && !l.claim) return true; return false; };
function release(r){ if (r.plan) for (const l of r.plan) if (l.claim === r) l.claim = null; r.plan = null; r.fingers = null; }

function idleWander(r){
  const O = owned();
  r.wx = clamp(r.x + rand(-90, 90), O.x0 + 20, O.x1 - 20); r.wy = clamp(r.y + rand(-60, 60), O.y0 + 20, O.y1 + 10); r.st = 'wander'; r.look = 0.3;
}
function decide(r){
  const cfg = S.robots[r.id];
  const t = robotTask(r);
  r.task = t; noteTask(r, t);
  if (t !== 'mine') cfg.miner = null;   // free the miner for someone else
  releaseStations(r, t);
  // first drop off what it carries, if there's room for it
  if (r.carryI > 0 && (t !== 'haul' || r.carryI >= ingotCarry(r.id) || S.plant.rack <= claimedRack(r)) && palletRoom() > 0){ r.st = 'toPallet'; return; }
  // (leaves it's about to bag, and metal it's about to smelt, go straight into the work instead)
  if (r.carryL > 0 && t !== 'bag' && (t !== 'leaves' || r.carryL >= leafCap(r.id)) && binRoom() > 0){ r.st = 'toBin'; r.at = 'bin'; return; }
  if (r.carryM > 0 && !(t === 'smelt' && (r.carryM >= oreNeed() || hopperRoom() <= 0)) && (r.ore || t !== 'mine' || r.carryM >= metalCarry(r.id)) && (r.ore ? hopperRoom() > 0 : metalRoom() > 0)){ r.st = 'toBin'; r.at = 'metal'; return; }
  if (!t){
    // nothing to do: if it's still holding something, go and wait where it goes
    if (r.carryL){ r.st = 'toBin'; r.at = 'bin'; return; }
    if (r.carryM){ r.st = 'toBin'; r.at = 'metal'; return; }
    if (r.carryI){ r.st = 'toPallet'; return; }
    idleWander(r); return;
  }
  startTask(r, t);
}
function startTask(r, t){
  if (t === 'leaves'){
    const p = pickTarget(r);
    if (p){ for (const l of p.ls) l.claim = r; r.plan = p.ls; r.st = 'seek'; return; }
    idleWander(r); return;
  }
  if (t === 'mine'){
    const sp = mineSlotFor(r); if (sp == null){ idleWander(r); return; }
    if (S.robots[r.id].miner !== sp) claimSlot(r, sp);
    r.st = 'toMine'; return;
  }
  if (t === 'bag' || t === 'jar'){ claimStation(t, r); r.st = 'toStation'; return; }
  if (t === 'smelt'){
    claimStation('smelt', r);
    const need = metalPerIngot() - 1e-9;
    if (r.carryM + S.plant.ore >= need){ r.st = 'toStation'; return; }                       // enough in its basket and the hopper
    if (r.carryM > 0 && hopperRoom() > 0){ r.st = 'toBin'; r.at = 'metal'; return; }         // tip what it has in the hopper
    if (S.binMetal > 0 && hopperRoom() > 0){ r.st = 'toTub'; return; }                       // the hopper is low: fetch ore from the tub
    idleWander(r); return;
  }
  if (t === 'haul'){ r.st = (r.carryI >= ingotCarry(r.id) || S.plant.rack <= claimedRack(r)) ? 'toPallet' : 'toRack'; return; }
  idleWander(r);
}
// a robot arrives at its station and starts on one bag / gift jar / ingot, if the makings are there
function beginWork(r){
  const t = r.task, P = stationPos(t, r.spot);
  r.face = P.face;
  if (t === 'bag'){
    // leaves jump into the bag: its own first, then loose ones from the bin, then from anyone stuck waiting at a full bin
    if (bagRoom() <= 0 || bagLeavesFor(r) < BAG_SIZE) return false;
    const P2 = stationPos('bag', r.spot), bx = P2.x + (r.spot ? -3 : 5), by = BAGGER.y - 40;
    const leafFly = (x, y, n, d) => { for (let i=0;i<Math.min(n, 4);i++) flyTo('leaf', x + rand(-6, 6), y, bx + rand(-3, 3), by, 0.32 + d + i*0.08, 20, { ci: pickColor(), sh: Math.random() < .5 ? 1 : 0, s: 4.5 }); };
    let need = BAG_SIZE;
    const own = Math.min(r.carryL, need); if (own){ r.carryL -= own; need -= own; S.totals.leaves += own; leafFly(r.x, r.y - 36, own, 0); }
    const fromBin = Math.min(S.binLeaves, need); if (fromBin){ S.binLeaves -= fromBin; need -= fromBin; leafFly(BIN.x - 12, BIN.y - 44, fromBin, 0.05); }
    for (const q of donorsFor(r)){ if (need <= 0) break; const k = Math.min(q.carryL, need); q.carryL -= k; need -= k; S.totals.leaves += k; leafFly(q.x, q.y - 36, k, 0.1); if (!q.carryL){ q.st = 'idle'; q.full = false; } }
    r.workDur = bagTime(r.id);
  } else if (t === 'jar'){
    // a jar's worth of honey pours over from the hive into a jar at the crate
    if (plainJars() < 1 || crateJars() + busyIn('jar') >= crateCap()) return false;
    S.hive.honey = Math.max(0, S.hive.honey - 1); r.workDur = S.hive.packing ? giftTime(r.id) : jarTime(r.id);
    for (let i=0;i<3;i++) flyTo('honey', HIVE.x - 10, HIVE.y - 40, CRATE.x - 2, CRATE.y - 30, 0.45 + i*0.1, 24, {});
  } else if (t === 'smelt'){
    // metal in its own basket goes straight in the furnace; the hopper makes up the rest (any spare bit goes in the hopper)
    const need = metalPerIngot(), door = { x: PLANT.x + (r.spot - 1)*40, y: PLANT.y - 22 };
    if (r.carryM + S.plant.ore < need - 1e-9 || S.plant.rack + busyIn('smelt') >= RACK_CAP) return false;
    const own = Math.min(r.carryM, need);
    if (own){ r.carryM -= own; if (!r.ore) S.totals.metal += own; if (!r.carryM) r.ore = false; for (let i=0;i<Math.min(own, 3);i++) flyTo('metal', r.x, r.y - 36, door.x, door.y, 0.35 + i*0.07, 16, {}); }
    const rest = need - own;
    if (rest > 0){ S.plant.ore = Math.max(0, S.plant.ore - rest); flyTo('metal', HOPPER.x + 4, HOPPER.y - 40, door.x, door.y, 0.5, 26, {}); }
    r.workDur = smeltTime(r.id);
  } else return false;
  r.st = t; r.workP = 0; return true;
}
function finishWork(r){
  const t = r.st;
  if (t === 'bag'){
    S.bag.bags++; S.totals.bags = (S.totals.bags || 0) + 1;
    flyTo('bag', BAGGER.x + 9, BAGGER.y - 36, BIN.x + 14 + rand(-4, 8), BIN.y - 50, 0.5, 30, {});
    pop(BAGGER.x + 4, BAGGER.y - 70, '+1 bag', 'bag', 15, 0.35);
    { const a = sndAt(BAGGER.x, BAGGER.y); sfx('dump', 3, a.pan, a.vol*0.8); }
  } else if (t === 'jar'){
    if (S.hive.packing){ S.hive.gift++; S.totals.gifts = (S.totals.gifts || 0) + 1; } else S.hive.jars++;
    S.totals.jars = (S.totals.jars || 0) + 1; hiveRt.bump = 0.25;
    pop(CRATE.x, CRATE.y - 62, S.hive.packing ? '+1 gift jar' : '+1 jar', 'honey', 14);
    { const a = sndAt(CRATE.x, CRATE.y); sfx('clink', 1, a.pan, a.vol*0.7); }
  } else if (t === 'smelt'){
    S.plant.rack++; S.totals.ingots = (S.totals.ingots || 0) + 1; plantRt.bump = 0.3;
    // slag recovery: the saved-up scraps make a whole extra ingot now and then
    S.plant.slagAcc = (S.plant.slagAcc || 0) + val('slag');
    if (S.plant.slagAcc >= 1 && S.plant.rack < RACK_CAP){ S.plant.slagAcc -= 1; S.plant.rack++; S.totals.ingots++; pop(PLANT.x + (r.spot - 1)*40, PLANT.y - 88, '+1 from slag', 'ingot', 13, 0.4); }
    flyTo('ingot', PLANT.x + (r.spot - 1)*40, PLANT.y - 18, RACK.x - 2 + rand(-6, 6), RACK.y - 30, 0.6, 30, {});
    pop(PLANT.x + (r.spot - 1)*40, PLANT.y - 70, '+1 ingot', 'ingot', 15);
    { const a = sndAt(PLANT.x, PLANT.y); sfx('tink', a.pan, a.vol*0.8); }
  }
  unitDone(r, t);
  if (Math.random() < 0.08) robotSays(r, 'happy');
  r.st = 'idle';
}
// Called when the robot reaches its patch: top the plan up with any free leaf the fingers can reach, then aim the claw.
function aimClaw(r, h){
  const take = Math.min(rv(r.id, 'grab'), leafCap(r.id) - r.carryL), spread = clawSpread(r.id);
  if (take > r.plan.length && spread > 0){
    const near = [];
    for (const l of leaves){ if (l.claim || !freeLeaf(l, r)) continue; const dx = l.x - h.x, dy = l.y - h.y; if (Math.abs(dx) > spread || Math.abs(dy) > spread) continue; const d = Math.hypot(dx, dy); if (d <= spread) near.push([d, l]); }
    near.sort((a, b) => a[0] - b[0]);
    for (const [, l] of near){ if (r.plan.length >= take) break; l.claim = r; r.plan.push(l); }
  }
  if (r.plan.length > take){ for (const l of r.plan.slice(take)) l.claim = null; r.plan.length = take; }
  const c = centroid(r.plan);
  r.armTo = { x: c.x, y: c.y };
  r.fingers = r.plan.length > 1 ? r.plan.map(l => ({ x: l.x, y: l.y })) : null;
}
function grabLeaves(r){
  const room = leafCap(r.id) - r.carryL;
  const got = (r.plan || []).filter(l => l.st === 'ground' && l.claim === r).slice(0, Math.max(0, room));
  for (const l of got){
    l.st = 'gone'; l.claim = null; r.carryL++;
    flyTo('leaf', l.x, l.y, r.x - r.face*8, r.y - 38, (r.pickDur || 0.5)*0.45 + 0.08 + Math.random()*0.1, 16, { ci:l.ci, sh:l.sh, s:l.s*0.75 });
  }
  for (const l of r.plan || []) if (l.claim === r) l.claim = null;
  r.plan = null;   // the fingers stay drawn while the arm pulls back
  if (got.length){ const a = sndAt(r.x, r.y); sfx('grab', got.length, a.pan, a.vol); }
  if (got.length >= 2) pop(r.x, r.y - 70, '×' + got.length, 'note', 15);
}

function updRobot(r, dt){
  r.moving = false; r.anim += dt;
  r.blinkT -= dt; if (r.blinkT < 0){ r.blink = 0.14; r.blinkT = rand(2, 5); } if (r.blink > 0) r.blink -= dt;
  const sp = robotSpeed(r.id);
  switch (r.st){
    case 'idle': decide(r); break;
    case 'seek': {
      const l = planAlive(r);
      if (!l){ release(r); r.st = 'idle'; break; }
      const reach = rv(r.id, 'reach');
      const d = Math.hypot(l.x - r.x, l.y - r.y);
      if (d <= Math.max(9, reach*0.8)){ r.st = 'pick'; r.pickDur = pickTime(r.id); r.timer = r.pickDur; r.grabbed = false; r.face = l.x >= r.x ? 1 : -1; aimClaw(r, l); break; }
      const k = (d - reach*0.6) / d;
      moveTo(r, r.x + (l.x - r.x)*k, r.y + (l.y - r.y)*k + 1, sp, dt);
      break;
    }
    case 'pick': {
      // the arm reaches out, grabs at full stretch, then pulls back
      r.timer -= dt;
      if (!r.grabbed && r.timer <= r.pickDur*0.45){ r.grabbed = true; grabLeaves(r); }
      if (r.timer <= 0){ if (!r.grabbed) grabLeaves(r); r.armTo = null; r.fingers = null; r.st = 'idle'; }
      break;
    }
    case 'toBin': {
      const p = r.at === 'metal' ? metalTarget(r) : binSpot(r);
      if (moveTo(r, p.x, p.y, sp, dt)){ r.st = 'dump'; r.timer = 0.32; r.face = 1; }
      break;
    }
    case 'dump':
      r.timer -= dt;
      if (r.timer <= 0){
        deposit(r);
        // leaves are in; metal that belongs in the plant's hopper goes on from here
        if (!r.carryL && !r.carryM) r.st = 'idle';
        else if (r.at === 'bin' && !r.carryL) r.st = 'idle';
        else { r.st = 'wait'; r.timer = 0.5; if (Math.random() < 0.5) robotSays(r, 'hmm'); }
      }
      break;
    case 'wait':
      // the bin (or tub, or hopper) is full: keep trying, but go and do something else if there's other work
      r.timer -= dt;
      if (r.timer <= 0){ deposit(r); r.timer = 0.5; if (!r.carryL && !r.carryM && !r.carryI) r.st = 'idle'; else if (robotTask(r)) r.st = 'idle'; }
      break;
    case 'toMine': {
      const m = minerFor(r); if (!m){ r.st = 'idle'; break; }
      if (moveTo(r, m.wx, m.wy, sp, dt)){ r.st = 'mine'; r.face = m.face; }
      break;
    }
    case 'mine': {
      const m = minerFor(r); if (!m){ r.st = 'idle'; r.mineP = 0; break; }
      r.face = m.face; r.hammer += dt;
      r.mineP += dt / drillTimeAt(r.id, m.sp);
      if (!simMode){
        if (Math.random() < dt*9) parts.push({ k:'spark', x: m.x + rand(-6,6), y: m.y - rand(0,6), vx: rand(-40,40), vy: rand(-70,-20), g: 160, life: rand(.25,.45), t:0 });
        if (Math.random() < dt*2.2) parts.push({ k:'dust', x: m.x + rand(-10,10), y: m.y, vx: rand(-8,8), vy: rand(-14,-6), g:0, life: rand(.8,1.4), t:0, r: rand(4,8) });
      }
      if (r.mineP >= 1){
        // the magnet sometimes catches a second chunk (it may ride along one over the basket limit)
        const lucky = Math.random() < doubleChance(r.id), n = lucky ? 2 : 1;
        r.mineP -= 1; r.carryM += n;
        if (lucky){ S.totals.lucky = (S.totals.lucky || 0) + 1; pop(m.x, m.y - 80, '+2 lucky!', 'metal', 17); }
        else pop(m.x, m.y - 76, '+1', 'metal', 15);
        { const a = sndAt(m.x, m.y); sfx('tink', a.pan, a.vol*0.7); if (lucky && !simMode) setTimeout(() => sfx('tink', a.pan, a.vol*0.8), 110); }
        for (let i=0;i<n;i++) flyTo('metal', m.x + i*6, m.y - 4, r.x - 6, r.y - 38, 0.35 + i*0.08, 20 + i*8, {});
        if (r.carryM >= metalCarry(r.id)){ r.st = 'idle'; r.mineP = 0; }
      }
      break;
    }
    case 'toStation': {
      if (r.spot == null || r.spot < 0 || STN[r.task] == null || STN[r.task][r.spot] !== r.id){ r.st = 'idle'; break; }
      const p = stationPos(r.task, r.spot);
      if (moveTo(r, p.x, p.y, sp, dt)){ if (!beginWork(r)) r.st = 'idle'; }
      break;
    }
    case 'bag': case 'jar': case 'smelt': {
      r.workP += dt/r.workDur; r.hammer += dt;
      if (!simMode && r.st === 'smelt'){
        const dx = PLANT.x + (r.spot - 1)*40;
        if (Math.random() < dt*7) parts.push({ k:'spark', x: dx + rand(-7,7), y: PLANT.y - 12 - rand(0,10), vx: rand(-30,30), vy: rand(-60,-20), g: 140, life: rand(.25,.5), t:0 });
      }
      if (r.workP >= 1) finishWork(r);
      break;
    }
    case 'toTub': {
      const p = tubSpot(r);
      if (moveTo(r, p.x, p.y, sp, dt)){
        const n = Math.min(metalCarry(r.id), S.binMetal, hopperRoom());
        if (n > 0){ S.binMetal -= n; r.carryM += n; r.ore = true; r.at = 'metal'; r.st = 'toBin'; for (let i=0;i<Math.min(n,4);i++) flyTo('metal', TUB.x, TUB.y - 28, r.x - 6, r.y - 38, 0.3 + i*0.06, 16, {}); }
        else r.st = 'idle';
      }
      break;
    }
    case 'toRack': {
      if (moveTo(r, RACK.x - 4 + (r.id%2)*8, RACK.y + 16, sp, dt)){
        const n = Math.min(ingotCarry(r.id) - r.carryI, S.plant.rack);
        if (n > 0){ S.plant.rack -= n; r.carryI += n; for (let i=0;i<n;i++) flyTo('ingot', RACK.x, RACK.y - 26, r.x - 6, r.y - 38, 0.35 + i*0.08, 16, {}); }
        r.st = r.carryI ? 'toPallet' : 'idle';
      }
      break;
    }
    case 'toPallet': {
      const p = palletSpot(r);
      if (moveTo(r, p.x, p.y, sp, dt)){
        const n = Math.min(r.carryI, palletRoom());
        if (n > 0){
          S.ingots += n; r.carryI -= n; unitDone(r, 'haul');
          pop(PALLET.x, PALLET.y - 50, '+' + n, 'ingot', 16);
          for (let i=0;i<n;i++) flyTo('ingot', r.x, r.y - 36, PALLET.x + rand(-10, 10), PALLET.y - 22, 0.3 + i*0.07, 18, {});
          { const a = sndAt(PALLET.x, PALLET.y); sfx('clink', n, a.pan, a.vol); }
        }
        if (r.carryI){ r.st = 'waitI'; r.timer = 0.5; } else r.st = 'idle';
      }
      break;
    }
    case 'waitI':
      r.timer -= dt;
      if (r.timer <= 0){ r.timer = 0.5; if (palletRoom() > 0 || robotTask(r)) r.st = 'idle'; }
      break;
    case 'wander': {
      r.look -= dt;
      if (r.look <= 0){ r.look = 0.3; if (robotTask(r)){ r.st = 'idle'; break; } }
      if (moveTo(r, r.wx, r.wy, sp*0.4, dt)){ r.st = 'rest'; r.timer = rand(1, 2.4); }
      break;
    }
    case 'rest': r.timer -= dt; r.look -= dt; if (r.timer <= 0) r.st = 'idle'; else if (r.look <= 0){ r.look = 0.3; if (robotTask(r)) r.st = 'idle'; } break;
  }
  r.full = (r.st === 'wait' || r.st === 'waitI') && (r.carryL > 0 || r.carryM > 0 || r.carryI > 0);
  if (!simMode && STYLES[r.id].dust && r.moving && Math.random() < dt*2.5) parts.push({ k:'dust', x: r.x - r.face*10, y: r.y - 2, vx: -r.face*rand(4,12), vy: rand(-10,-4), g:0, life: rand(.6,1), t:0, r: rand(2.5,4.5) });
}

function deposit(r){
  if (r.carryL > 0 && r.at !== 'metal'){
    const n = Math.min(r.carryL, Math.floor(binRoom()));
    if (n > 0){
      S.binLeaves += n; r.carryL -= n; S.totals.leaves += n; unitDone(r, 'leaves');
      pop(BIN.x - 8, BIN.y - 74, '+' + n, 'leaf', 19);
      for (let i=0;i<Math.min(n,6);i++) flyTo('leaf', r.x, r.y - 36, BIN.x + rand(-20,20), BIN.y - 46, 0.32 + i*0.05, 26, { ci: pickColor(), sh: Math.random()<.5?1:0, s: 5 });
      bumpBin = 0.25;

    }
  }
  if (r.carryM > 0 && S.metalSlot){
    const tgt = metalTarget(r);
    // standing at the bin with leaves, metal only goes in too if the tub (right beside it) is where it belongs
    if (r.at === 'metal' || !tgt.hopper){
      const n = tgt.hopper ? Math.min(r.carryM, hopperRoom()) : r.ore ? 0 : Math.min(r.carryM, tubRoom());
      if (n > 0){
        r.carryM -= n;
        if (!r.ore){ S.totals.metal += n; unitDone(r, 'mine'); }
        if (tgt.hopper){
          S.plant.ore += n; pop(HOPPER.x, HOPPER.y - 66, '+' + n, 'metal', 17);
          for (let i=0;i<Math.min(n,5);i++) flyTo('metal', r.x, r.y - 36, HOPPER.x + rand(-6,6), HOPPER.y - 44, 0.3 + i*0.05, 22, {});
          { const a = sndAt(HOPPER.x, HOPPER.y); sfx('clink', n, a.pan, a.vol); }
        } else {
          S.binMetal += n; pop(TUB.x, TUB.y - 60, '+' + n, 'metal', 19);
          for (let i=0;i<Math.min(n,5);i++) flyTo('metal', r.x, r.y - 36, TUB.x + rand(-8,8), TUB.y - 28, 0.3 + i*0.05, 22, {});
          { const a = sndAt(TUB.x, TUB.y); sfx('clink', n, a.pan, a.vol); }
        }
