<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leaf Yard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: one full-bleed canvas yard; HUD pinned top-left; upgrade cards float beside the thing you tapped. */
:root{
  --paper:#f6ead4; --paper-2:#ecdcbf; --ink:#4a3226; --ink-soft:#7c5d47;
  --accent:#d4672a; --accent-dk:#9e4719; --moss:#5f7232; --grass:#6c7a37;
  --chalk:#2f3a34;
  --font-ui:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  color-scheme: light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--grass);color:var(--ink);font-family:var(--font-ui);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
#c{position:fixed;inset:0;display:block;touch-action:manipulation}
#hud{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:3}
.stat{display:flex;align-items:center;gap:7px;background:rgba(246,234,212,.86);border-radius:999px;padding:3px 13px 3px 7px;box-shadow:0 2px 10px rgba(50,25,8,.18);font-weight:700;font-size:17px;line-height:1.5;font-variant-numeric:tabular-nums;width:max-content;transition:transform .15s}
.stat svg{width:20px;height:20px;flex:none}
.stat.bump{transform:scale(1.08)}
.stat.cash{font-size:19px}
#card{position:fixed;z-index:6;width:min(304px,calc(100vw - 24px));background:var(--paper);color:var(--ink);border-radius:16px;padding:12px 14px 8px;box-shadow:0 14px 34px rgba(40,18,4,.38),inset 0 0 0 1.5px rgba(110,74,48,.22);animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.94) translateY(6px);opacity:0}to{transform:none;opacity:1}}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ct{font-family:var(--font-hand);font-weight:700;font-size:30px;line-height:.95;text-wrap:balance}
.cs{font-size:13px;color:var(--ink-soft);line-height:1.35;margin:3px 0 6px}
.live{font-size:13.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.x{border:0;background:transparent;color:var(--ink-soft);font:700 20px/1 var(--font-ui);cursor:pointer;padding:2px 6px;border-radius:8px}
.x:hover{background:var(--paper-2)}
.row{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:1px;align-items:center;padding:9px 0;border-top:1.5px dashed rgba(110,74,48,.22)}
.row .n{font-weight:700;font-size:15px;line-height:1.2;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .d{font-size:12.5px;color:var(--ink-soft);line-height:1.3;min-width:0}
.row .d b{color:var(--ink);font-weight:700}
.row .btn{grid-column:2;grid-row:1 / span 2}
.pips{display:inline-flex;gap:3px}
.pip{width:6px;height:6px;border-radius:50%;background:rgba(110,74,48,.2)}
.pip.on{background:var(--accent)}
.buy{font:700 14px/1 var(--font-ui);border:0;border-radius:10px;padding:8px 11px 7px;background:var(--accent);color:#fff6e8;cursor:pointer;box-shadow:0 2px 0 var(--accent-dk);min-width:68px;font-variant-numeric:tabular-nums}
.buy:hover{filter:brightness(1.06)}
.buy:active{transform:translateY(1px);box-shadow:0 1px 0 var(--accent-dk)}
.buy[aria-disabled="true"]{background:var(--paper-2);color:#93765e;box-shadow:0 2px 0 #d3bf9c;cursor:default}
.buy.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.maxed{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--moss)}
.seg{display:flex;gap:4px;background:var(--paper-2);border-radius:11px;padding:3px;margin:2px 0 8px}
.seg button{flex:1;border:0;background:transparent;font:700 13.5px/1 var(--font-ui);color:var(--ink-soft);padding:8px 6px 7px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(60,30,10,.2)}
.foot{font-size:12px;color:var(--ink-soft);padding:6px 0 2px;border-top:1.5px dashed rgba(110,74,48,.22);display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{border:0;background:none;color:var(--ink-soft);font:600 12px var(--font-ui);text-decoration:underline;cursor:pointer;padding:2px}
.link.danger{color:#a8361d}
.note{font-size:12.5px;color:#a8361d;font-weight:600;min-height:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:10px 18px 9px;border-radius:14px;box-shadow:0 10px 26px rgba(40,18,4,.32);font-family:var(--font-hand);font-weight:700;font-size:24px;line-height:1.1;text-align:center;z-index:7;max-width:calc(100vw - 40px);transition:opacity .6s}
#toast small{display:block;font-family:var(--font-ui);font-size:13px;font-weight:600;color:var(--ink-soft);margin-top:3px}


</style>
</head>
<body>
<canvas id="c" aria-label="Leaf Yard game area"></canvas>

<div id="hud" aria-live="polite">
  <div class="stat" id="hLeaf" title="Leaves in the bin">
    <svg viewBox="-12 -12 24 24" aria-hidden="true"><path d="M0,-10 L1.4,-6 L4.5,-7.6 L3.8,-4 L8.6,-5 L7,-1.8 L10,0.4 L6.4,1.4 L7.2,4 L3,3 L0.8,5.4 L0,6 L-0.8,5.4 L-3,3 L-7.2,4 L-6.4,1.4 L-10,0.4 L-7,-1.8 L-8.6,-5 L-3.8,-4 L-4.5,-7.6 L-1.4,-6 Z" fill="#d4532a"/><path d="M0,4 L0,10.5" stroke="#8c3215" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span id="vLeaf">0</span>
  </div>
  <div class="stat" id="hMetal" hidden title="Metal in the bin">
    <svg viewBox="-12 -12 24 24" aria-hidden="true"><path d="M-8,3 L-5,-6 L3,-8 L9,-2 L7,6 L-2,8 Z" fill="#7d868c"/><path d="M-5,-6 L3,-8 L1,-1 Z" fill="#aab3b8"/><path d="M1,-1 L9,-2 L7,6 Z" fill="#5f676c"/><circle cx="-2" cy="2" r="1.6" fill="#e2c77d"/></svg>
    <span id="vMetal">0</span>
  </div>
  <div class="stat cash" id="hCash" title="Cash">
    <svg viewBox="-12 -12 24 24" aria-hidden="true"><circle r="10" fill="#c9922c"/><circle r="8.2" fill="#e8b84e"/><circle r="5.6" fill="none" stroke="#c9922c" stroke-width="1.3"/><path d="M-4.5,-3.5 A5.6,5.6 0 0 1 1,-5.4" stroke="#fbe3a0" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
    <span id="vCash">$0.00</span>
  </div>
</div>

<div id="card" hidden role="dialog" aria-modal="false"></div>
<div id="toast" hidden></div>

<script>
// Leaf Yard — game logic and rendering.
// Dev URL options: ?fresh (ignore the saved game)  ?speed=4 (fast-forward, 0.25–20)
(() => {
'use strict';
// ───────────────────────── utils
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
function mulberry(s){ return function(){ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function ell(c,x,y,rx,ry){ c.beginPath(); c.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),0,0,TAU); }
function money(v){ if (v < 0.1) return '$' + v.toFixed(3); if (v < 10000) return '$' + v.toFixed(2); return '$' + Math.round(v).toLocaleString('en-US'); }
function cash2(v){ return '$' + (v < 10000 ? v.toFixed(2) : Math.round(v).toLocaleString('en-US')); }
function niceCost(v){ if (v < 1) return Math.round(v*20)/20; if (v < 20) return Math.round(v*4)/4; return Math.round(v); }
function mmss(s){ s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ───────────────────────── economy
const UP = {
  carry:      { obj:'robot', name:'Bigger basket',     max:8, base:0.25, mul:1.65, val:l=>6+2*l,                      show:v=>v+' leaves' },
  speed:      { obj:'robot', name:'Oiled wheels',      max:8, base:0.35, mul:1.65, val:l=>1+0.16*l,                   show:v=>v.toFixed(2)+'× speed' },
  drill:      { obj:'robot', name:'Sharper drill',     max:6, base:5,   mul:1.7,  val:l=>4/(1+0.35*l),               show:v=>v.toFixed(1)+'s per chunk' },
  bin:        { obj:'bin',   name:'Bigger bin',        max:6, base:0.6, mul:1.9,  val:l=>Math.round(30*Math.pow(1.55,l)), show:v=>v+' leaves' },
  leafPrice:  { obj:'bin',   name:'Sort & bag leaves', max:8, base:0.8, mul:1.8,  val:l=>0.05*Math.pow(1.25,l),      show:v=>money(v)+' / leaf' },
  metalPrice: { obj:'bin',   name:'Grade the metal',   max:6, base:6,   mul:1.8,  val:l=>1.0*Math.pow(1.25,l),       show:v=>money(v)+' / metal' },
  truck:      { obj:'sign',  name:'Book more pickups', max:7, base:0.5, mul:1.9, val:l=>[45,38,32,27,23,19,16,14][l], show:v=>'every '+v+'s' },
};
const ROBOT_COST = [0, 2, 30];
const MINER_COST = [6, 25, 70];
const METAL_SLOT_COST = 8;
const NAMES = ['Tinker', 'Pip', 'Clunk'];
const BLURBS = ['An old yard bot. Squeaks a little, never complains.', 'Rebuilt from a lawnmower and a toaster.', 'Heavy-footed and very dependable.'];

const upCost = k => niceCost(UP[k].base * Math.pow(UP[k].mul, S.lv[k]));
const val = k => UP[k].val(S.lv[k]);
const leafCap = () => val('carry');
const metalCarry = () => 3 + Math.floor(S.lv.carry/2);
const binCap = () => val('bin');
const metalCap = () => Math.round(10*Math.pow(1.55, S.lv.bin));
const leafPrice = () => val('leafPrice');
const metalPrice = () => val('metalPrice');
const truckEvery = () => val('truck');
const oreTime = () => val('drill');

function freshState(){
  return {
    v:1, t:0, cash:0, binLeaves:0, binMetal:0,
    lv:{ carry:0, speed:0, drill:0, bin:0, leafPrice:0, metalPrice:0, truck:0 },
    metalSlot:false, robots:[{ job:'leaf', miner:null }], miners:[],
    truckT:28,
    totals:{ leaves:0, metal:0, cash:0, trucks:0 },
    flags:{ opened:false, finished:false, sentHint:false }
  };
}
let S = freshState();

// ───────────────────────── canvas & layout
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, SC = 1, U = 1;
const L = { bin:{}, sign:{}, shed:{}, spots:[], trees:[], curbY:0, roadH:0, lane:0, park:0, playTop:0, playBot:0, verge:0 };
let groundCv = null, vignetteCv = null, canopyCvs = [];

function layout(){
  const oW = W, oH = H;
  W = innerWidth; H = innerHeight; DPR = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  SC = clamp(Math.min(W, H)/640, 0.8, 1.4);
  U = clamp(Math.sqrt(W*H)/Math.sqrt(1280*800), 0.55, 1.5);
  L.roadH = clamp(H*0.13, 72, 116);
  L.curbY = H - L.roadH;
  L.lane = L.curbY + Math.max(L.roadH*0.72, 56*SC);
  L.verge = 30*SC;
  L.bin = { x: W*0.5, y: L.curbY - 12*SC };
  L.sign = { x: L.bin.x - 80*SC, y: L.curbY - 8*SC };
  L.shed = { x: Math.max(62*SC, W*0.14), y: L.curbY - 20*SC };
  L.playTop = Math.max(H*0.15, 70);
  L.playBot = L.curbY - L.verge - 4;
  L.park = L.bin.x + 22*SC;
  const SP = [[0.80,0.20],[0.17,0.40],[0.68,0.70]];
  L.spots = SP.map(([fx,fy]) => ({ x: W*fx, y: L.playTop + (L.playBot - L.playTop)*fy }));
  L.trees = [
    { x: -40*SC, y: -30*SC, r: 175*SC, seed: 11 },
    { x: W + 30*SC, y: 10*SC, r: 195*SC, seed: 23 },
    { x: W*0.47, y: -130*SC, r: 160*SC, seed: 37 },
  ];
  if (oW && (oW !== W || oH !== H)){
    const fx = W/oW, fy = H/oH;
    for (const l of leaves){ l.x *= fx; l.y *= fy; l.ly *= fy; }
    for (const r of R){ r.x *= fx; r.y *= fy; r.wx *= fx; r.wy *= fy; }
    truck.x = truck.st === 'load' ? L.park : truck.x*fx;
  }
  buildGround(); buildVignette(); buildCanopies();
  closeCard();
}

// ───────────────────────── leaves
const LEAFC = [
  { c:'#c0392b', v:'#7f2318', w:.2 },
  { c:'#d4532a', v:'#8c3215', w:.14 },
  { c:'#e07b2e', v:'#9a4d17', w:.24 },
  { c:'#eaa23a', v:'#a8691b', w:.15 },
  { c:'#9aa53f', v:'#5d6524', w:.17, sp:true },
  { c:'#b0662f', v:'#6e3c18', w:.10 },
];
function pickColor(){ let r = Math.random(); for (let i=0;i<LEAFC.length;i++){ r -= LEAFC[i].w; if (r <= 0) return i; } return 0; }
const MAPLE = (() => { const h = [[0,-1],[0.12,-0.62],[0.38,-0.8],[0.32,-0.42],[0.74,-0.52],[0.58,-0.2],[0.98,-0.02],[0.62,0.1],[0.7,0.32],[0.3,0.24],[0.08,0.42],[0,0.5]]; const p = h.slice(); for (let i=h.length-2;i>0;i--) p.push([-h[i][0], h[i][1]]); return p; })();

function leafPath(c, shape){
  c.beginPath();
  if (shape === 1){ c.moveTo(MAPLE[0][0], MAPLE[0][1]); for (let i=1;i<MAPLE.length;i++) c.lineTo(MAPLE[i][0], MAPLE[i][1]); c.closePath(); }
  else { c.moveTo(0,-1); c.bezierCurveTo(0.62,-0.7,0.6,0.5,0,0.82); c.bezierCurveTo(-0.6,0.5,-0.62,-0.7,0,-1); c.closePath(); }
}
function drawLeaf(c, x, y, s, rot, ci, shape, flipX, squash, alpha, dark){
  const col = LEAFC[ci];
  c.save(); c.translate(x, y); if (squash !== 1) c.scale(1, squash); c.rotate(rot); c.scale(s*flipX, s);
  if (alpha !== 1) c.globalAlpha = alpha;
  leafPath(c, shape);
  c.fillStyle = col.c; c.fill();
  if (dark){ c.fillStyle = 'rgba(60,20,5,'+dark+')'; c.fill(); }
  c.lineWidth = 0.09; c.strokeStyle = col.v; c.lineCap = 'round';
  c.beginPath(); c.moveTo(0, shape===1?0.45:0.8); c.lineTo(0, 1.12);
  c.moveTo(0, 0.5); c.lineTo(0, -0.78);
  if (shape === 1){ c.moveTo(0,0.3); c.lineTo(0.55,-0.38); c.moveTo(0,0.3); c.lineTo(-0.55,-0.38); c.moveTo(0,0.38); c.lineTo(0.72,0.05); c.moveTo(0,0.38); c.lineTo(-0.72,0.05); }
  else { c.moveTo(0,-0.2); c.lineTo(0.3,-0.45); c.moveTo(0,-0.2); c.lineTo(-0.3,-0.45); c.moveTo(0,0.2); c.lineTo(0.32,0.0); c.moveTo(0,0.2); c.lineTo(-0.32,0.0); }
  c.stroke();
  if (col.sp){ c.fillStyle = '#5a6322'; ell(c,0.22,-0.3,0.08,0.08); c.fill(); ell(c,-0.2,0.15,0.07,0.07); c.fill(); ell(c,0.12,0.35,0.06,0.06); c.fill(); c.fillStyle='#c98a35'; ell(c,-0.25,-0.45,0.07,0.07); c.fill(); ell(c,0.3,0.12,0.06,0.06); c.fill(); }
  c.restore();
}

let leaves = [];      // collectable + falling + fading
let fgLeaves = [];    // big foreground drifters
const groundCount = () => { let n=0; for (const l of leaves) if (l.collect && l.st !== 'gone') n++; return n; };
const GROUND_CAP = 140;

function landingOK(x, y){
  if (y > L.playBot || y < L.playTop - 10) return false;
  if (Math.abs(x - L.shed.x) < 58*SC && y > L.shed.y - 70*SC) return false;
  if (x > L.bin.x - 46*SC && x < L.bin.x + 82*SC && y > L.bin.y - 56*SC) return false;
  return true;
}
function spawnLeaf(collect, onGround){
  let x, y, ly;
  for (let tries=0; tries<8; tries++){
    if (Math.random() < 0.65){
      const t = L.trees[Math.floor(Math.random()*L.trees.length)];
      const a = rand(0.15, Math.PI - 0.15), d = rand(0.2, 0.85)*t.r;
      x = t.x + Math.cos(a)*d*(Math.random()<.5?-1:1); y = Math.max(-10, t.y + Math.sin(a)*d*0.6);
      ly = y + rand(90, 360)*SC;
    } else { x = rand(10, W-10); y = rand(-30, -10); ly = rand(L.playTop, L.playBot); }
    x = clamp(x, 12, W-12);
    ly = clamp(ly, L.playTop, L.playBot);
    if (landingOK(x, ly)) break;
  }
  const l = { x, y: onGround ? ly : y, ly, s: rand(8, 11)*SC, rot: rand(0, TAU), vr: rand(-1.6, 1.6), ci: pickColor(), sh: Math.random() < 0.55 ? 1 : 0,
    st: onGround ? 'ground' : 'fall', vy: rand(26, 44)*SC, ph: rand(0, TAU), phs: rand(1.6, 3.2), sw: rand(14, 30)*SC, wf: rand(0.6, 1.2),
    flip: 1, claim: null, collect, a: 1, kx: 0, ky: 0, t: 0 };
  if (!landingOK(l.x, l.ly) && collect) l.collect = false;
  leaves.push(l);
  return l;
}
function spawnFg(){
  fgLeaves.push({ x: rand(-60, W*0.9), y: -40, s: rand(20, 28)*SC, rot: rand(0,TAU), vr: rand(-2,2), ci: pickColor(), sh: Math.random()<.6?1:0, vy: rand(70, 115)*SC, ph: rand(0,TAU), phs: rand(1.5,2.6), sw: rand(30,60)*SC });
}

// ───────────────────────── runtime objects
let R = [];   // robots runtime
const truck = { st:'away', x:0, v:0, timer:0, fill:0, rot:0, takeL:0, takeM:0 };
let parts = [];   // particles
let pops = [];    // popup texts
let wind = 0, gust = 0, gustT = 8;
let spawnAcc = 0, ambAcc = 0, fgAcc = 0;

function newRobot(i){
  const door = { x: L.shed.x, y: L.shed.y + 10*SC };
  return { id:i, x: door.x + rand(-6,6), y: door.y, st:'idle', carryL:0, carryM:0, face:1, anim:Math.random()*5, moving:false,
    mineP:0, timer:0, target:null, blinkT: rand(1,4), blink:0, wx:0, wy:0, full:false, hammer:0 };
}
function syncRobots(){ while (R.length < S.robots.length) R.push(newRobot(R.length)); }

const robotSpeed = () => 80 * U * val('speed');
const PICK = 0.22;

function moveTo(r, x, y, sp, dt){
  const dx = x - r.x, dy = y - r.y, d = Math.hypot(dx, dy);
  if (Math.abs(dx) > 1.5) r.face = dx > 0 ? 1 : -1;
  if (d <= sp*dt + 0.5){ r.x = x; r.y = y; return true; }
  r.x += dx/d*sp*dt; r.y += dy/d*sp*dt; r.moving = true; return false;
}
function binSpot(r){
  if (r.carryM > 0 && r.carryL === 0) return { x: L.bin.x + 60*SC + (r.id-1)*8*SC, y: L.bin.y + 15*SC };
  return { x: L.bin.x + (r.id-1)*22*SC - 6*SC, y: L.bin.y + 15*SC };
}
function minerFor(r){ const cfg = S.robots[r.id]; if (cfg.job !== 'mine' || cfg.miner == null) return null; if (!S.miners.includes(cfg.miner)) return null; const p = L.spots[cfg.miner]; return { x:p.x, y:p.y, wx: p.x - 30*SC, wy: p.y + 7*SC }; }
function nearestLeaf(r){
  let best = null, bd = 1e18;
  for (const l of leaves){
    if (l.st !== 'ground' || !l.collect || l.claim) continue;
    const d = Math.hypot(l.x - r.x, l.y - r.y) + 0.25*Math.hypot(l.x - L.bin.x, l.y - L.bin.y);
    if (d < bd){ bd = d; best = l; }
  }
  return best;
}
function release(r){ if (r.target){ r.target.claim = null; r.target = null; } }

function decide(r){
  const cfg = S.robots[r.id];
  if (cfg.job === 'mine' && minerFor(r)){
    if (r.carryL > 0 || r.carryM >= metalCarry()){ r.st = 'toBin'; return; }
    r.st = 'toMine'; return;
  }
  if (r.carryM > 0){ r.st = 'toBin'; return; }
  if (r.carryL >= leafCap()){ r.st = 'toBin'; return; }
  const l = nearestLeaf(r);
  if (l){ l.claim = r; r.target = l; r.side = r.x < l.x ? -1 : 1; r.st = 'seek'; return; }
  if (r.carryL > 0){ r.st = 'toBin'; return; }
  r.wx = clamp(r.x + rand(-90, 90)*SC, 30, W-30); r.wy = clamp(r.y + rand(-60, 60)*SC, L.playTop, L.playBot); r.st = 'wander';
}

function updRobot(r, dt){
  const cfg = S.robots[r.id];
  r.moving = false; r.anim += dt;
  r.blinkT -= dt; if (r.blinkT < 0){ r.blink = 0.14; r.blinkT = rand(2, 5); } if (r.blink > 0) r.blink -= dt;
  const sp = robotSpeed();
  switch (r.st){
    case 'idle': decide(r); break;
    case 'seek': {
      const l = r.target;
      if (!l || l.st !== 'ground'){ r.target = null; r.st = 'idle'; break; }
      if (cfg.job === 'mine' && minerFor(r)){ release(r); r.st = 'idle'; break; }
      if (moveTo(r, l.x + r.side*7*SC, l.y + 1, sp, dt)){ r.st = 'pick'; r.timer = PICK; r.face = -r.side; }
      break;
    }
    case 'pick': {
      r.timer -= dt;
      if (r.timer <= 0){
        const l = r.target;
        if (l && l.st === 'ground'){
          l.st = 'gone'; r.carryL++;
          flyTo('leaf', l.x, l.y, r.x - r.face*6*SC, r.y - 36*SC, 0.3, 18*SC, { ci:l.ci, sh:l.sh, s:l.s*0.8 });
        }
        r.target = null; r.st = 'idle';
      }
      break;
    }
    case 'toBin': { const p = binSpot(r); if (moveTo(r, p.x, p.y, sp, dt)){ r.st = 'dump'; r.timer = 0.32; r.face = 1; } break; }
    case 'dump': r.timer -= dt; if (r.timer <= 0){ deposit(r); if (r.carryL || r.carryM){ r.st = 'wait'; r.timer = 0.5; } else r.st = 'idle'; } break;
    case 'wait': r.timer -= dt; if (r.timer <= 0){ deposit(r); r.timer = 0.5; if (!r.carryL && !r.carryM) r.st = 'idle'; } break;
    case 'toMine': {
      const m = minerFor(r); if (!m){ r.st = 'idle'; break; }
      if (moveTo(r, m.wx, m.wy, sp, dt)){ r.st = 'mine'; r.face = 1; }
      break;
    }
    case 'mine': {
      const m = minerFor(r); if (!m){ r.st = 'idle'; r.mineP = 0; break; }
      r.face = 1; r.hammer += dt;
      r.mineP += dt / oreTime();
      if (Math.random() < dt*9) parts.push({ k:'spark', x: m.x + rand(-6,6)*SC, y: m.y - rand(0,6)*SC, vx: rand(-40,40)*SC, vy: rand(-70,-20)*SC, g: 160*SC, life: rand(.25,.45), t:0 });
      if (Math.random() < dt*2.2) parts.push({ k:'dust', x: m.x + rand(-10,10)*SC, y: m.y, vx: rand(-8,8), vy: rand(-14,-6), g:0, life: rand(.8,1.4), t:0, r: rand(4,8)*SC });
      if (r.mineP >= 1){
        r.mineP -= 1; r.carryM++;
        pop(m.x, m.y - 74*SC, '+1', 'metal', 15);
        flyTo('metal', m.x, m.y - 4*SC, r.x - 6*SC, r.y - 36*SC, 0.35, 20*SC, {});
        if (r.carryM >= metalCarry()){ r.st = 'toBin'; r.mineP = 0; }
      }
      break;
    }
    case 'wander': {
      if (nearestLeaf(r) || (cfg.job === 'mine' && minerFor(r))){ r.st = 'idle'; break; }
      if (moveTo(r, r.wx, r.wy, sp*0.4, dt)){ r.st = 'rest'; r.timer = rand(1, 2.4); }
      break;
    }
    case 'rest': r.timer -= dt; if (r.timer <= 0 || nearestLeaf(r)) r.st = 'idle'; break;
  }
}

function deposit(r){
  let any = false;
  if (r.carryL > 0){
    const n = Math.min(r.carryL, binCap() - S.binLeaves);
    if (n > 0){
      S.binLeaves += n; r.carryL -= n; S.totals.leaves += n; any = true;
      pop(L.bin.x - 8*SC, L.bin.y - 72*SC, '+' + n, 'leaf', 19);
      for (let i=0;i<Math.min(n,6);i++) flyTo('leaf', r.x, r.y - 34*SC, L.bin.x + rand(-20,20)*SC, L.bin.y - 46*SC, 0.32 + i*0.05, 26*SC, { ci: pickColor(), sh: Math.random()<.5?1:0, s: 5*SC });
      bumpBin = 0.25;
    }
  }
  if (r.carryM > 0 && S.metalSlot){
    const n = Math.min(r.carryM, metalCap() - S.binMetal);
    if (n > 0){
      S.binMetal += n; r.carryM -= n; S.totals.metal += n; any = true;
      pop(L.bin.x + 58*SC, L.bin.y - 58*SC, '+' + n, 'metal', 19);
      for (let i=0;i<Math.min(n,5);i++) flyTo('metal', r.x, r.y - 34*SC, L.bin.x + 58*SC + rand(-8,8)*SC, L.bin.y - 28*SC, 0.3 + i*0.05, 22*SC, {});
    }
  }
  r.full = (r.carryL > 0 || r.carryM > 0);
  return any;
}

// ───────────────────────── truck
function updTruck(dt){
  const T = truck;
  if (T.st === 'away'){
    S.truckT -= dt;
    if (S.truckT <= 0){ T.st = 'arrive'; T.x = W + 110*SC; T.fill = 0; }
  } else if (T.st === 'arrive'){
    const dx = T.x - L.park, v = Math.max(34*SC, dx*2.1);
    const mv = Math.min(dx, v*dt); T.x -= mv; T.rot -= mv/(10*SC);
    puffExhaust(T, dt, 1);
    if (dx <= 0.6){
      T.x = L.park; T.st = 'load'; T.timer = 2.3;
      T.takeL = S.binLeaves; T.takeM = S.binMetal; S.binLeaves = 0; S.binMetal = 0;
      const n = Math.min(T.takeL, 26);
      for (let i=0;i<n;i++) flyTo('leaf', L.bin.x + rand(-22,22)*SC, L.bin.y - 44*SC, T.x + rand(0,58)*SC, L.lane - 48*SC, 0.5 + i*0.055, 50*SC, { ci: pickColor(), sh: Math.random()<.5?1:0, s: 5.5*SC });
      const m = Math.min(T.takeM, 10);
      for (let i=0;i<m;i++) flyTo('metal', L.bin.x + 58*SC, L.bin.y - 26*SC, T.x + rand(0,58)*SC, L.lane - 48*SC, 0.55 + i*0.08, 55*SC, {});
    }
  } else if (T.st === 'load'){
    T.timer -= dt;
    const want = (T.takeL + T.takeM*2) > 0 ? clamp((2.3 - T.timer)/1.8, 0, 1) * clamp((T.takeL + T.takeM*3)/80, 0.25, 1) : 0;
    T.fill = want;
    puffExhaust(T, dt, 0.25);
    if (T.timer <= 0){
      const amt = T.takeL*leafPrice() + T.takeM*metalPrice();
      if (T.takeL + T.takeM > 0){
        S.cash += amt; S.totals.cash += amt; S.totals.trucks++;
        pop(L.bin.x, L.bin.y - 122*SC, '+' + cash2(amt), 'cash', 26);
        const bits = [];
        if (T.takeL) bits.push(T.takeL + (T.takeL === 1 ? ' leaf' : ' leaves'));
        if (T.takeM) bits.push(T.takeM + ' metal');
        pop(L.bin.x, L.bin.y - 98*SC, bits.join(' · '), 'note', 15, 0.15);
        const coins = Math.min(12, 3 + Math.floor(amt*2));
        const hc = $('hCash').getBoundingClientRect();
        for (let i=0;i<coins;i++) flyTo('coin', L.bin.x + rand(-20,20)*SC, L.bin.y - 110*SC, hc.left + 16, hc.top + hc.height/2, 0.7 + i*0.06, 120, { hud:true });
      } else {
        pop(L.bin.x, L.bin.y - 100*SC, 'nothing to take today', 'note', 16);
      }
      T.st = 'leave'; T.v = 10;
    }
  } else if (T.st === 'leave'){
    T.v = Math.min(T.v + 240*SC*dt, 360*SC); T.x -= T.v*dt; T.rot -= T.v*dt/(10*SC);
    puffExhaust(T, dt, 1.4);
    if (T.x < -120*SC){ T.st = 'away'; S.truckT = truckEvery(); T.fill = 0; }
  }
}
function puffExhaust(T, dt, k){
  if (Math.random() < dt*6*k) parts.push({ k:'dust', x: T.x + 74*SC, y: L.lane - 10*SC, vx: rand(10,30), vy: rand(-16,-8), g:0, life: rand(.7,1.2), t:0, r: rand(3,6)*SC, gray:true });
}

// ───────────────────────── particles & popups
function flyTo(kind, x0, y0, x1, y1, dur, arc, o){ parts.push(Object.assign({ k:'fly', kind, x0, y0, x1, y1, dur, arc, t:0, life:dur, rot: rand(0,TAU) }, o)); }
function pop(x, y, text, kind, size, delay){ pops.push({ x, y, text, kind, size: size || 18, t: -(delay||0), life: kind === 'cash' ? 2.2 : 1.6 }); }
let bumpBin = 0, cashBumpT = 0;

function updParts(dt){
  for (const p of parts){
    p.t += dt;
    if (p.k === 'fly'){ if (p.t >= p.life && p.hud){ cashBumpT = 0.18; } continue; }
    p.vy += (p.g||0)*dt; p.x += p.vx*dt; p.y += p.vy*dt;
  }
  parts = parts.filter(p => p.t < p.life);
  for (const p of pops) p.t += dt;
  pops = pops.filter(p => p.t < p.life);
}

// ───────────────────────── leaf world update
function updLeaves(dt){
  gustT -= dt; if (gustT < 0){ gust = rand(18, 40)*(Math.random()<.5?-1:1); gustT = rand(9, 18); }
  gust *= Math.pow(0.55, dt);
  wind = 12*Math.sin(S.t*0.13) + 7*Math.sin(S.t*0.41 + 1) + gust;
  spawnAcc += dt*2.4;
  while (spawnAcc >= 1){ spawnAcc -= 1; spawnLeaf(groundCount() < GROUND_CAP, false); }
  ambAcc += dt*(reduceMotion ? 0.2 : 0.55);
  while (ambAcc >= 1){ ambAcc -= 1; spawnLeaf(false, false); }
  fgAcc += dt*(reduceMotion ? 0.03 : 0.22);
  while (fgAcc >= 1){ fgAcc -= 1; spawnFg(); }
  for (const l of leaves){
    if (l.st === 'fall'){
      l.ph += dt*l.phs; l.y += l.vy*dt; l.x += (wind*l.wf*SC + Math.cos(l.ph)*l.sw)*dt; l.rot += l.vr*dt;
      if (l.y >= l.ly){ l.y = l.ly; l.x = clamp(l.x, 10, W-10); if (l.collect && !landingOK(l.x, l.y)) l.collect = false; l.st = l.collect ? 'ground' : 'fade'; l.flip = Math.cos(l.ph) < 0 ? -1 : 1; l.t = 0; }
    } else if (l.st === 'ground'){
      if (l.kx || l.ky){ l.x += l.kx*dt; l.y += l.ky*dt; l.rot += (l.kx*0.01)*dt*4; const d = Math.pow(0.02, dt); l.kx *= d; l.ky *= d; if (Math.abs(l.kx)+Math.abs(l.ky) < 1){ l.kx = l.ky = 0; } l.x = clamp(l.x, 10, W-10); l.y = clamp(l.y, L.playTop, L.playBot); }
    } else if (l.st === 'fade'){
      l.t += dt; l.a = clamp(1 - (l.t - 2.5)/1.5, 0, 1); if (l.a <= 0) l.st = 'gone';
    }
  }
  leaves = leaves.filter(l => l.st !== 'gone');
  for (const f of fgLeaves){ f.ph += dt*f.phs; f.y += f.vy*dt; f.x += (wind*2.4*SC + Math.cos(f.ph)*f.sw)*dt; f.rot += f.vr*dt; }
  fgLeaves = fgLeaves.filter(f => f.y < H + 60 && f.x < W + 80);
}

// ───────────────────────── main step
function step(dt){
  S.t += dt;
  updLeaves(dt);
  syncRobots();
  for (const r of R) updRobot(r, dt);
  updTruck(dt);
  updParts(dt);
  if (bumpBin > 0) bumpBin -= dt;
  if (!S.flags.finished && S.robots.length >= 3 && S.miners.length >= 3){
    S.flags.finished = true;
    if (!simMode) showToast('The yard hums along nicely.', 'That’s the whole early game for now. More is on the way.', 9);
  }
}

// ───────────────────────── offers / buying
function offers(){
  const o = [];
  const up = k => ({ id:'up', key:k, obj: UP[k].obj, cost: upCost(k), maxed: S.lv[k] >= UP[k].max });
  o.push(up('carry'), up('speed'));
  if (S.miners.length) o.push(up('drill'));
  o.push(up('bin'), up('leafPrice'));
  if (!S.metalSlot) o.push({ id:'metalSlot', obj:'bin', cost: METAL_SLOT_COST, maxed:false });
  else o.push(up('metalPrice'));
  o.push(up('truck'));
  if (S.robots.length < 3) o.push({ id:'robot', obj:'shed', cost: ROBOT_COST[S.robots.length], maxed:false });
  if (S.metalSlot && S.miners.length < 3) L.spots.forEach((_, i) => { if (!S.miners.includes(i)) o.push({ id:'miner', arg:i, obj:'spot'+i, cost: MINER_COST[S.miners.length], maxed:false }); });
  return o;
}
function objPos(obj){
  if (obj === 'bin') return { x: L.bin.x, y: L.bin.y - 64*SC };
  if (obj === 'sign') return { x: L.sign.x, y: L.sign.y - 76*SC };
  if (obj === 'shed') return { x: L.shed.x, y: L.shed.y - 104*SC };
  if (obj === 'robot'){ const r = R[0]; return r ? { x: r.x, y: r.y - 66*SC } : null; }
  if (obj.startsWith('spot')){ const p = L.spots[+obj.slice(4)]; return { x: p.x, y: p.y - (S.miners.includes(+obj.slice(4)) ? 84 : 42)*SC }; }
  return null;
}

function buy(o){
  if (o.maxed || S.cash + 1e-9 < o.cost) return false;
  S.cash -= o.cost;
  if (o.id === 'up'){
    S.lv[o.key]++;
    const p = objPos(o.obj === 'robot' ? 'robot' : o.obj);
    if (!simMode && p) { pop(p.x, p.y, UP[o.key].name + '!', 'note', 16); sparkle(p.x, p.y + 20*SC); }
    if (o.key === 'truck') S.truckT = Math.min(S.truckT, truckEvery());
  } else if (o.id === 'metalSlot'){
    S.metalSlot = true;
    if (!simMode){ pop(L.bin.x + 58*SC, L.bin.y - 70*SC, 'Metal slot added', 'note', 17); sparkle(L.bin.x + 58*SC, L.bin.y - 30*SC); }
  } else if (o.id === 'robot'){
    const i = S.robots.length;
    S.robots.push({ job:'leaf', miner:null }); syncRobots();
    if (!simMode){ pop(L.shed.x, L.shed.y - 100*SC, NAMES[i] + ' joins the yard', 'note', 17); sparkle(L.shed.x, L.shed.y); }
  } else if (o.id === 'miner'){
    S.miners.push(o.arg);
    const p = L.spots[o.arg];
    const free = R.filter(r => S.robots[r.id].job !== 'mine').sort((a,b) => Math.hypot(a.x-p.x,a.y-p.y) - Math.hypot(b.x-p.x,b.y-p.y))[0];
    if (free){ assign(free.id, o.arg); if (!simMode) pop(p.x, p.y - 96*SC, NAMES[free.id] + ' heads over to mine', 'note', 16, 0.3); }
    if (!simMode){ sparkle(p.x, p.y - 20*SC); for (let i=0;i<10;i++) parts.push({ k:'dust', x:p.x+rand(-24,24)*SC, y:p.y, vx:rand(-20,20), vy:rand(-25,-5), g:0, life:rand(.8,1.4), t:0, r:rand(5,9)*SC }); }
  }
  save();
  return true;
}
function assign(ri, spot){
  const cfg = S.robots[ri];
  cfg.job = 'mine'; cfg.miner = spot;
  const r = R[ri]; if (r){ release(r); if (r.st !== 'dump' && r.st !== 'wait') r.st = 'idle'; }
  S.flags.sentHint = true;
}
function unassign(ri){
  const cfg = S.robots[ri]; cfg.job = 'leaf'; cfg.miner = null;
  const r = R[ri]; if (r && (r.st === 'mine' || r.st === 'toMine')){ r.st = 'idle'; r.mineP = 0; }
}
const minerWorker = spot => S.robots.findIndex(c => c.job === 'mine' && c.miner === spot);
const freeMiner = () => S.miners.find(s => minerWorker(s) < 0);

function sparkle(x, y){
  for (let i=0;i<14;i++){ const a = rand(0,TAU), v = rand(40,110)*SC; parts.push({ k:'star', x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 30*SC, g: 90*SC, life: rand(.5,.9), t:0 }); }
}

// ───────────────────────── static art (ground, canopies, vignette)
function buildGround(){
  groundCv = document.createElement('canvas');
  groundCv.width = cv.width; groundCv.height = cv.height;
  const g = groundCv.getContext('2d'); g.scale(DPR, DPR);
  const rnd = mulberry(7);
  const gr = g.createLinearGradient(0, 0, 0, L.curbY);
  gr.addColorStop(0, '#68773a'); gr.addColorStop(0.55, '#76843f'); gr.addColorStop(1, '#7e8a43');
  g.fillStyle = gr; g.fillRect(0, 0, W, L.curbY);
  const patch = ['#86924a','#62713a','#8f8a46','#707f3c','#94914c','#5d6b36'];
  for (let i=0;i<70;i++){ const x = rnd()*W, y = rnd()*L.curbY, r = (40 + rnd()*150)*SC; const rg = g.createRadialGradient(x,y,0,x,y,r); const c = patch[Math.floor(rnd()*patch.length)]; rg.addColorStop(0, c+'88'); rg.addColorStop(1, c+'00'); g.fillStyle = rg; g.fillRect(x-r,y-r,r*2,r*2); }

    g.lineWidth = 1.1*SC; g.beginPath(); g.moveTo(x, y); g.lineTo(x + lean, y - h); g.stroke();
  }

  for (let i=0;i<Math.floor(n/22);i++){
    const ci = Math.floor(rnd()*LEAFC.length), x = rnd()*W, y = rnd()*(L.curbY - 10);
    g.globalAlpha = 0.16 + rnd()*0.16;
    drawLeaf(g, x, y, (3 + rnd()*3)*SC, rnd()*TAU, ci, rnd()<.5?1:0, 1, 0.7, 1, 0.25);
  }
  g.globalAlpha = 1;
  // dappled light
  for (let i=0;i<34;i++){ const x = rnd()*W, y = rnd()*L.curbY, r = (20 + rnd()*60)*SC; const rg = g.createRadialGradient(x,y,0,x,y,r); rg.addColorStop(0,'rgba(255,226,150,.16)'); rg.addColorStop(1,'rgba(255,226,150,0)'); g.fillStyle = rg; g.fillRect(x-r,y-r,r*2,r*2); }
  // small stones & mushrooms
  for (let i=0;i<Math.floor(W/90);i++){
    const x = rnd()*W, y = L.playTop + rnd()*(L.playBot - L.playTop);
    if (rnd() < 0.55){ g.fillStyle = 'rgba(40,30,15,.25)'; ell(g, x+1, y+2, 5*SC, 2.4*SC); g.fill(); g.fillStyle = '#a49c8c'; ell(g, x, y, 4.5*SC, 3*SC); g.fill(); g.fillStyle = '#c4bcab'; ell(g, x-1*SC, y-1*SC, 2.4*SC, 1.4*SC); g.fill(); }
    else { const s = SC*(0.8 + rnd()*0.5); g.fillStyle = '#e8dcc2'; g.fillRect(x - 1.2*s, y - 5*s, 2.4*s, 5*s); g.fillStyle = rnd() < .5 ? '#b5452d' : '#c88b4a'; g.beginPath(); g.ellipse(x, y - 5*s, 5*s, 3.4*s, 0, Math.PI, 0); g.fill(); g.fillStyle = '#f4ead5'; ell(g, x - 2*s, y - 6.5*s, .9*s, .9*s); g.fill(); ell(g, x + 1.6*s, y - 7*s, .7*s, .7*s); g.fill(); }
  }
  // gravel verge
  const vy = L.curbY - L.verge;
  g.fillStyle = '#b9a98a'; g.fillRect(0, vy, W, L.verge);
  const vg = g.createLinearGradient(0, vy - 6, 0, vy + 6); vg.addColorStop(0, 'rgba(118,132,63,1)'); vg.addColorStop(1, 'rgba(118,132,63,0)'); g.fillStyle = vg; g.fillRect(0, vy - 6, W, 12);
  for (let i=0;i<W*L.verge/30;i++){ const x = rnd()*W, y = vy + 3 + rnd()*(L.verge - 4); g.fillStyle = ['#a2937a','#cdbfa3','#988a72','#d8ccb3'][Math.floor(rnd()*4)]; ell(g, x, y, (1 + rnd()*1.6)*SC, (0.8 + rnd()*1.1)*SC); g.fill(); }
  // grass tufts overhanging verge
  for (let x=0; x<W; x += 6 + rnd()*10){ g.strokeStyle = rnd()<.5 ? '#5f6e33' : '#7b8a45'; g.lineWidth = 1.3*SC; g.beginPath(); g.moveTo(x, vy + 2); g.lineTo(x + (rnd()-.5)*4, vy + 2 + (2 + rnd()*5)*SC); g.stroke(); }
  // road
  const ry = L.curbY;

function drawRockBed(g, x, y, seed){
  const rnd = mulberry(seed);
  g.save(); g.translate(x, y); g.scale(SC, SC);
  const rg = g.createRadialGradient(0, 0, 4, 0, 0, 44); rg.addColorStop(0, 'rgba(92,78,58,.55)'); rg.addColorStop(1, 'rgba(92,78,58,0)'); g.fillStyle = rg; ell(g, 0, 0, 46, 22); g.fill();
  const rocks = [[-20,-2,13],[3,-9,15],[19,1,11],[-6,7,10],[12,10,8],[-25,10,6]];
  for (const [rx, ry, rs] of rocks){
    g.fillStyle = 'rgba(30,25,15,.3)'; ell(g, rx + 2, ry + rs*0.45, rs*1.05, rs*0.42); g.fill();
    g.beginPath();
    for (let k=0;k<8;k++){ const a = k/8*TAU, d = rs*(0.82 + rnd()*0.3); const px = rx + Math.cos(a)*d, py = ry + Math.sin(a)*d*0.72 - rs*0.18; k ? g.lineTo(px, py) : g.moveTo(px, py); }
    g.closePath();
    const gg = g.createLinearGradient(rx, ry - rs, rx, ry + rs*0.6); gg.addColorStop(0, '#a4a49f'); gg.addColorStop(1, '#666861');
    g.fillStyle = gg; g.fill();
    g.fillStyle = 'rgba(255,255,240,.18)'; ell(g, rx - rs*0.25, ry - rs*0.45, rs*0.45, rs*0.2); g.fill();
    for (let k=0;k<3;k++){ g.fillStyle = rnd() < .5 ? '#d9bf72' : '#c5ccd1'; const sx = rx + (rnd()-.5)*rs*1.1, sy = ry - rs*0.2 + (rnd()-.5)*rs*0.6; g.beginPath(); g.moveTo(sx, sy - 1.6); g.lineTo(sx + 1.4, sy); g.lineTo(sx, sy + 1.6); g.lineTo(sx - 1.4, sy); g.fill(); }

}

function buildCanopies(){
  canopyCvs = L.trees.map(t => {
    const pad = 20, size = Math.ceil((t.r*2 + pad*2));
    const c = document.createElement('canvas'); c.width = Math.ceil(size*DPR); c.height = Math.ceil(size*DPR);
    const g = c.getContext('2d'); g.scale(DPR, DPR); g.translate(size/2, size/2);
    const rnd = mulberry(t.seed);
    const pal = ['#a83a27','#c4552c','#d8772f','#e4a03c','#b8452d','#cf6a2e','#8f9a3e','#e8b44a'];
    g.fillStyle = 'rgba(70,30,15,.35)'; ell(g, 0, 0, t.r*0.98, t.r*0.98); g.fill();
    for (let layer=0; layer<3; layer++){
      const count = 26 - layer*6;
      for (let i=0;i<count;i++){
        const a = rnd()*TAU, d = Math.sqrt(rnd())*t.r*(0.78 - layer*0.14);
        const x = Math.cos(a)*d - layer*6*SC, y = Math.sin(a)*d - layer*7*SC, r = t.r*(0.2 + rnd()*0.17);
        const col = pal[Math.floor(rnd()*pal.length)];
        const rg = g.createRadialGradient(x - r*0.3, y - r*0.35, r*0.1, x, y, r);
        rg.addColorStop(0, shade(col, 1.18)); rg.addColorStop(0.7, col); rg.addColorStop(1, shade(col, 0.72));
        g.fillStyle = rg; ell(g, x, y, r, r); g.fill();
      }
    }
    for (let i=0;i<160;i++){ const a = rnd()*TAU, d = Math.sqrt(rnd())*t.r*0.95; g.globalAlpha = 0.85; drawLeaf(g, Math.cos(a)*d, Math.sin(a)*d, (4 + rnd()*3)*SC, rnd()*TAU, Math.floor(rnd()*4), rnd()<.6?1:0, 1, 1, 1, rnd()*0.2); }
    g.globalAlpha = 1;
    return { c, size };
  });
}
function shade(hex, k){ const n = parseInt(hex.slice(1), 16); const r = clamp(Math.round((n>>16)*k),0,255), g = clamp(Math.round((n>>8&255)*k),0,255), b = clamp(Math.round((n&255)*k),0,255); return 'rgb('+r+','+g+','+b+')'; }

function buildVignette(){

function bubble(x, y, text){

function drawParts(){
  const c = ctx;
  for (const p of parts){
    const a = clamp(1 - p.t/p.life, 0, 1);
    if (p.k === 'fly'){
      const t = clamp(p.t/p.dur, 0, 1), e = t*t*(3 - 2*t);
      const x = lerp(p.x0, p.x1, e), y = lerp(p.y0, p.y1, e) - Math.sin(t*Math.PI)*p.arc;
      if (p.kind === 'leaf') drawLeaf(c, x, y, p.s || 5*SC, p.rot + t*6, p.ci || 0, p.sh || 0, 1, 1, 1, 0);
      else if (p.kind === 'metal') nugget(c, x, y, 4.5*SC, p.rot + t*5);
      else if (p.kind === 'coin'){ c.fillStyle = '#d9a43a'; ell(c, x, y, 6, 6*Math.abs(Math.cos(t*12))+1); c.fill(); c.fillStyle = '#f2cd66'; ell(c, x, y, 4, 4*Math.abs(Math.cos(t*12))+.6); c.fill(); }
    } else if (p.k === 'spark'){ c.fillStyle = 'rgba(255,214,120,' + a + ')'; c.fillRect(p.x - 1, p.y - 1, 2.2, 2.2); }
    else if (p.k === 'dust'){ const r = p.r*(1 + p.t/p.life*1.4); c.fillStyle = p.gray ? 'rgba(190,180,170,' + a*0.45 + ')' : 'rgba(170,140,100,' + a*0.4 + ')'; ell(c, p.x, p.y, r, r); c.fill(); }
    else if (p.k === 'star'){ c.save(); c.translate(p.x, p.y); c.rotate(p.t*4); c.fillStyle = 'rgba(255,236,170,' + a + ')'; const s = 3.2*SC; c.beginPath(); c.moveTo(0,-s); c.lineTo(s*.3,-s*.3); c.lineTo(s,0); c.lineTo(s*.3,s*.3); c.lineTo(0,s); c.lineTo(-s*.3,s*.3); c.lineTo(-s,0); c.lineTo(-s*.3,-s*.3); c.fill(); c.restore(); }
    else if (p.k === 'ring'){ const r = p.r0 + (p.r1 - p.r0)*(p.t/p.life); c.strokeStyle = 'rgba(255,240,210,' + a*0.6 + ')'; c.lineWidth = 2; ell(c, p.x, p.y, r, r*0.55); c.stroke(); }
  }
}

function drawPops(){
  const c = ctx;
  for (const p of pops){
    if (p.t < 0) continue;
    const k = p.t/p.life, a = k < 0.75 ? 1 : 1 - (k - 0.75)/0.25;
    const y = p.y - (1 - Math.pow(1 - Math.min(1, p.t/0.9), 3))*26*SC;
    const sc = p.t < 0.12 ? 0.6 + p.t/0.12*0.4 : 1;
    c.save(); c.globalAlpha = a; c.translate(p.x, y); c.scale(sc, sc);
    const size = Math.round(p.size*SC*(p.kind === 'cash' ? 1.05 : 1));
    c.font = (p.kind === 'note' ? '700 ' : '800 ') + size + 'px ' + (p.kind === 'note' ? 'Caveat, cursive' : '"Baloo 2", sans-serif');
    c.textAlign = 'center'; c.textBaseline = 'middle';
    const w = c.measureText(p.text).width;
    let tx = 0;
    if (p.kind === 'leaf' || p.kind === 'metal'){ tx = 9*SC; }
    c.lineJoin = 'round'; c.lineWidth = Math.max(3, size*0.22); c.strokeStyle = 'rgba(55,30,14,.75)'; c.strokeText(p.text, tx, 0);
    c.fillStyle = p.kind === 'cash' ? '#ffd56b' : p.kind === 'metal' ? '#dfe6ea' : p.kind === 'leaf' ? '#ffd7a8' : '#fff4e0';
    c.fillText(p.text, tx, 0);
    if (p.kind === 'leaf'){ drawLeaf(c, tx - w/2 - 9*SC, 0, 7*SC, 0.3, 1, 1, 1, 1, 1, 0); }
    if (p.kind === 'metal'){ nugget(c, tx - w/2 - 9*SC, 0, 6.5*SC, 0.2); }
    c.restore();
  }
}

function drawMarkers(){
  const c = ctx, groups = {};
  for (const o of offers()) if (!o.maxed && o.cost <= S.cash + 1e-9) groups[o.obj] = true;
  if (cardOpen) groups[cardOpen.obj] = false;
  for (const k in groups){
    if (!groups[k]) continue;
    const p = objPos(k); if (!p) continue;
    const y = p.y - 8*SC + Math.sin(S.t*3 + p.x)*2.5*SC;
    c.save(); c.translate(p.x, y);
    c.fillStyle = 'rgba(255,214,120,.28)'; ell(c, 0, 0, 13*SC, 13*SC); c.fill();
    c.fillStyle = '#f6ead4'; ell(c, 0, 0, 8.5*SC, 8.5*SC); c.fill();
    c.strokeStyle = '#d4672a'; c.lineWidth = 2.3*SC; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(-3.6*SC, 1.6*SC); c.lineTo(0, -2.2*SC); c.lineTo(3.6*SC, 1.6*SC); c.stroke();
    c.restore();
  }
}

function drawHints(){
  let h = null;
  if (!S.flags.opened && S.cash >= 0.25) h = { x: L.bin.x, y: L.bin.y - 100*SC, t: 'tap things to upgrade them' };
  else if (S.metalSlot && !S.miners.length && S.cash >= MINER_COST[0]*0.5){ const p = L.spots[2]; h = { x: p.x, y: p.y - 70*SC, t: 'build a miner on the rocks' }; }
  else if (S.miners.length && !S.flags.sentHint && R[0]){ h = { x: R[0].x, y: R[0].y - 92*SC, t: 'tap a robot to send it mining' }; }
  if (!h) return;
  const c = ctx; c.save();

  c.font = '700 ' + Math.round(21*SC) + 'px Caveat, cursive'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.lineJoin = 'round'; c.lineWidth = 4; c.strokeStyle = 'rgba(55,30,14,.6)'; c.strokeText(h.t, h.x, y); c.fillStyle = '#fff4e0'; c.fillText(h.t, h.x, y);

}

function draw(){
  const c = ctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.drawImage(groundCv, 0, 0, W, H);
  drawSpotGlints();
  // ground leaves
  for (const l of leaves){
    if (l.st === 'ground' || l.st === 'fade'){
      if (l.st === 'ground'){ c.fillStyle = 'rgba(40,30,10,.18)'; ell(c, l.x + 1.5, l.y + 1.5, l.s*0.75, l.s*0.4); c.fill(); }
      drawLeaf(c, l.x, l.y, l.s, l.rot, l.ci, l.sh, l.flip, 0.72, l.a, 0);
    }
  }
  // depth-sorted objects
  const list = [];
  list.push({ y: L.bin.y, f: drawBin });
  list.push({ y: L.sign.y, f: drawSign });
  list.push({ y: L.shed.y, f: drawShed });
  list.push({ y: L.shed.y + 4*SC, f: drawPumpkins });
  for (const i of S.miners) list.push({ y: L.spots[i].y, f: () => drawMiner(i) });
  for (const r of R) list.push({ y: r.y, f: () => drawRobot(r) });
  list.sort((a, b) => a.y - b.y);
  for (const o of list) o.f();
  drawTruck();
  // falling leaves
  for (const l of leaves){ if (l.st === 'fall'){ const fx = Math.cos(l.ph); drawLeaf(c, l.x, l.y, l.s, l.rot, l.ci, l.sh, Math.abs(fx) < 0.15 ? 0.15*Math.sign(fx || 1) : fx, 1, 1, fx < 0 ? 0.18 : 0); } }
  drawParts();
  // canopies
  L.trees.forEach((t, i) => {
    const cc = canopyCvs[i]; if (!cc) return;
    const sway = reduceMotion ? 0 : Math.sin(S.t*0.7 + i*1.7)*0.012 + wind*0.0004;
    c.save(); c.translate(t.x, t.y); c.rotate(sway); c.drawImage(cc.c, -cc.size/2, -cc.size/2, cc.size, cc.size); c.restore();
  });
  // foreground leaves
  for (const f of fgLeaves){ const fx = Math.cos(f.ph); c.globalAlpha = 0.92; drawLeaf(c, f.x, f.y, f.s, f.rot, f.ci, f.sh, Math.abs(fx) < 0.15 ? 0.15 : fx, 1, 0.92, fx < 0 ? 0.2 : 0); c.globalAlpha = 1; }
  c.drawImage(vignetteCv, 0, 0, W, H);
  drawMarkers();
  drawHints();
  drawPops();
}

// ───────────────────────── HUD
let dispCash = 0, lastHud = '';
function updHud(dt){
  dispCash = Math.abs(S.cash - dispCash) < 0.005 ? S.cash : lerp(dispCash, S.cash, 1 - Math.pow(0.002, dt));
  const key = S.binLeaves + '|' + S.binMetal + '|' + dispCash.toFixed(2) + '|' + S.metalSlot;
  if (key !== lastHud){
    lastHud = key;
    $('vLeaf').textContent = S.binLeaves;
    $('vMetal').textContent = S.binMetal;
    $('vCash').textContent = cash2(dispCash);
    $('hMetal').hidden = !S.metalSlot;
  }
  if (cashBumpT > 0){ cashBumpT -= dt; $('hCash').classList.add('bump'); } else $('hCash').classList.remove('bump');
}

// ───────────────────────── cards
const card = $('card');
let cardOpen = null, cardSig = '', resetArm = false, cardNote = '';
function pips(l, max){ let s = '<span class="pips" aria-label="level ' + l + ' of ' + max + '">'; for (let i=0;i<max;i++) s += '<span class="pip' + (i < l ? ' on' : '') + '"></span>'; return s + '</span>'; }
function upRow(k, extraDesc){
  const u = UP[k], l = S.lv[k], maxed = l >= u.max;
  const from = u.show(u.val(l)), to = maxed ? '' : u.show(u.val(l + 1));
  const cost = upCost(k), aff = S.cash + 1e-9 >= cost;
  return { sig: k + l + aff, html:
    '<div class="row"><div class="n">' + u.name + ' ' + pips(l, u.max) + '</div>' +
    '<div class="d">' + (maxed ? '<b>' + from + '</b>' : from + ' → <b>' + to + '</b>') + (extraDesc ? ' ' + extraDesc : '') + '</div>' +
    '<div class="btn">' + (maxed ? '<span class="maxed">maxed</span>' : '<button class="buy" data-act="up:' + k + '" aria-disabled="' + !aff + '">' + money(cost) + '</button>') + '</div></div>' };
}
function buyRow(name, desc, act, cost, done){
  const aff = S.cash + 1e-9 >= cost;
  return { sig: act + aff + done, html: '<div class="row"><div class="n">' + name + '</div><div class="d">' + desc + '</div><div class="btn">' +
    (done ? '<span class="maxed">' + done + '</span>' : '<button class="buy" data-act="' + act + '" aria-disabled="' + !aff + '">' + money(cost) + '</button>') + '</div></div>' };
}
function cardModel(){
  const k = cardOpen.kind, rows = [];
  let title = '', sub = '', live = '', top = '', foot = '';
  if (k === 'robot'){
    const r = R[cardOpen.i], cfg = S.robots[cardOpen.i];
    title = NAMES[cardOpen.i]; sub = BLURBS[cardOpen.i];
    live = 'robot';
    if (S.miners.length){
      top = '<div class="seg" role="group" aria-label="Job"><button data-act="job:leaf" class="' + (cfg.job === 'leaf' ? 'on' : '') + '">Gather leaves</button><button data-act="job:mine" class="' + (cfg.job === 'mine' ? 'on' : '') + '">Work a miner</button></div>';
    }
    rows.push(upRow('carry', S.metalSlot ? '· ' + metalCarry() + ' metal' : ''));
    rows.push(upRow('speed'));
    if (S.miners.length) rows.push(upRow('drill'));
    foot = '<div class="foot"><span>Upgrades apply to every robot.</span></div>';
    title += '';
    void r;
  } else if (k === 'bin'){
    title = 'Leaf bin'; sub = 'Robots drop what they find here. The truck empties it on every pickup.';
    live = 'bin';
    rows.push(upRow('bin', S.metalSlot ? '· ' + metalCap() + ' metal' : ''));
    rows.push(upRow('leafPrice'));
    if (!S.metalSlot) rows.push(buyRow('Add a metal slot', 'Lets the truck buy metal too. Unlocks miners on the rocks.', 'metalSlot', METAL_SLOT_COST, ''));
    else rows.push(upRow('metalPrice'));
  } else if (k === 'sign'){
    title = 'Pickup schedule'; sub = 'The compost truck takes everything in the bin and pays on the spot.';
    live = 'truck';
    rows.push(upRow('truck'));
  } else if (k === 'shed'){
    title = 'Workshop'; sub = 'Spare parts, a warm lamp, and room for a few more robots.';
    const n = S.robots.length;
    if (n < 3) rows.push(buyRow('Build ' + NAMES[n], 'Robot ' + (n + 1) + ' of 3. Starts out gathering leaves.', 'robot', ROBOT_COST[n], ''));
    else rows.push({ sig:'full', html:'<div class="row"><div class="n">Three robots</div><div class="d">The workshop is full for now.</div><div class="btn"><span class="maxed">done</span></div></div>' });
    foot = '<div class="foot"><span>Saved in this browser.</span>' + (resetArm ? '<button class="link danger" data-act="reset2">Yes, wipe my yard</button>' : '<button class="link" data-act="reset1">Start over</button>') + '</div>';
  } else if (k === 'spot'){
    const i = cardOpen.i;
    if (S.miners.includes(i)){
      title = 'Miner'; sub = 'A rattly drill on a metal vein. A robot has to work it.';
      live = 'miner';
      const w = minerWorker(i);
      if (w >= 0) rows.push({ sig:'w' + w, html:'<div class="row"><div class="n">' + NAMES[w] + ' is working here</div><div class="d">' + oreTime().toFixed(1) + 's per chunk · carries ' + metalCarry() + '</div><div class="btn"><button class="buy" data-act="release">Send back</button></div></div>' });
      else {
        const any = S.robots.some(c => c.job !== 'mine');
        rows.push({ sig:'nw' + any, html:'<div class="row"><div class="n">No robot here</div><div class="d">' + (any ? 'Pull the closest leaf robot over.' : 'Every robot is busy at a miner.') + '</div><div class="btn"><button class="buy" data-act="send" aria-disabled="' + !any + '">Send one</button></div></div>' });
      }
    } else {
      title = 'Metal vein'; sub = 'Old rocks with bright flecks of scrap metal in them.';
      if (!S.metalSlot) rows.push({ sig:'locked', html:'<div class="row"><div class="n">Needs a metal slot</div><div class="d">Add one on the leaf bin so the truck will buy metal.</div><div class="btn"></div></div>' });
      else if (S.miners.length < 3) rows.push(buyRow('Build a miner', 'Metal sells for ' + money(metalPrice()) + ' a chunk. A robot works it.', 'miner', MINER_COST[S.miners.length], ''));
    }
  }
  return { title, sub, rows, top, foot, live };
}
function liveText(kind){
  if (kind === 'robot'){ const r = R[cardOpen.i]; if (!r) return ''; const cfg = S.robots[cardOpen.i];
    const what = r.carryM ? r.carryM + '/' + metalCarry() + ' metal' : r.carryL + '/' + leafCap() + ' leaves';
    const doing = r.st === 'mine' ? 'Mining' : r.st === 'toMine' ? 'Heading to the miner' : (r.st === 'wait') ? 'Waiting for room in the bin' : (r.st === 'toBin' || r.st === 'dump') ? 'Heading to the bin' : r.st === 'wander' || r.st === 'rest' ? 'Looking for leaves' : cfg.job === 'mine' ? 'Mining' : 'Gathering';
    return doing + ' · carrying ' + what; }
  if (kind === 'bin') return S.binLeaves + ' / ' + binCap() + ' leaves' + (S.metalSlot ? ' · ' + S.binMetal + ' / ' + metalCap() + ' metal' : '') + ' · sells at ' + money(leafPrice()) + ' a leaf';
  if (kind === 'truck') return truck.st === 'away' ? 'Next truck in ' + mmss(S.truckT) : 'The truck is here now';
  if (kind === 'miner') return '';
  return '';
}
function renderCard(force){
  if (!cardOpen) return;
  const m = cardModel();
  const sig = cardOpen.kind + (cardOpen.i ?? '') + m.rows.map(r => r.sig).join(',') + m.top + m.foot + cardNote;
  if (sig !== cardSig || force){
    cardSig = sig;
    card.innerHTML = '<div class="ch"><div class="ct">' + m.title + '</div><button class="x" data-act="close" aria-label="Close">×</button></div>' +
      '<div class="cs">' + m.sub + '</div>' + (m.live ? '<div class="live" id="cardLive"></div>' : '') +
      '<div style="height:6px"></div>' + m.top + m.rows.map(r => r.html).join('') + (cardNote ? '<div class="note">' + cardNote + '</div>' : '') + m.foot;
    placeCard();
  }
  const lv = $('cardLive'); if (lv){ const t = liveText(m.live); if (lv.textContent !== t) lv.textContent = t; }
}
function placeCard(){
  if (!cardOpen) return;
  const a = cardAnchor(); const cw = card.offsetWidth, ch = card.offsetHeight;
  let x = a.x - cw/2, y = a.y - ch - 14;
  if (y < 10 + (a.x - cw/2 < 190 ? 110 : 0)) y = a.y + a.below + 12;
  if (y + ch > H - 8) y = Math.max(8, H - ch - 8);
  x = clamp(x, 12, W - cw - 12);
  card.style.left = x + 'px'; card.style.top = y + 'px';
}
function cardAnchor(){
  const k = cardOpen.kind;
  if (k === 'robot'){ const r = R[cardOpen.i]; return { x: cardOpen.ax ?? r.x, y: cardOpen.ay ?? r.y - 60*SC, below: 70*SC }; }
  if (k === 'bin') return { x: L.bin.x + 10*SC, y: L.bin.y - 62*SC, below: 70*SC };
  if (k === 'sign') return { x: L.sign.x, y: L.sign.y - 76*SC, below: 80*SC };
  if (k === 'shed') return { x: L.shed.x + 30*SC, y: L.shed.y - 100*SC, below: 104*SC };
  if (k === 'spot'){ const p = L.spots[cardOpen.i]; return { x: p.x, y: p.y - 74*SC, below: 84*SC }; }
  return { x: W/2, y: H/2, below: 0 };
}
function openCard(kind, i){
  const obj = kind === 'robot' ? 'robot' : kind === 'spot' ? 'spot' + i : kind;
  cardOpen = { kind, i, obj };
  if (kind === 'robot'){ const r = R[i]; cardOpen.ax = r.x; cardOpen.ay = r.y - 60*SC; }
  resetArm = false; cardNote = ''; cardSig = '';
  card.hidden = false; card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
  S.flags.opened = true;
  renderCard(true);
}
function closeCard(){ cardOpen = null; card.hidden = true; cardSig = ''; }

card.addEventListener('pointerdown', e => e.stopPropagation());
card.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'close'){ closeCard(); return; }
  if (b.getAttribute('aria-disabled') === 'true'){ b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); return; }
  cardNote = '';
  if (act.startsWith('up:')){ const k = act.slice(3); buy({ id:'up', key:k, obj:UP[k].obj, cost:upCost(k), maxed:S.lv[k] >= UP[k].max }); }
  else if (act === 'metalSlot') buy({ id:'metalSlot', obj:'bin', cost:METAL_SLOT_COST });
  else if (act === 'robot') buy({ id:'robot', obj:'shed', cost:ROBOT_COST[S.robots.length] });
  else if (act === 'miner') buy({ id:'miner', arg:cardOpen.i, obj:'spot', cost:MINER_COST[S.miners.length] });
  else if (act === 'job:leaf'){ unassign(cardOpen.i); }
  else if (act === 'job:mine'){ const cfg = S.robots[cardOpen.i]; if (cfg.job !== 'mine'){ const f = freeMiner(); if (f == null) cardNote = 'Every miner already has a robot. Build another on the rocks.'; else assign(cardOpen.i, f); } }
  else if (act === 'release'){ const w = minerWorker(cardOpen.i); if (w >= 0) unassign(w); }
  else if (act === 'send'){ const p = L.spots[cardOpen.i]; const cand = R.filter(r => S.robots[r.id].job !== 'mine').sort((a,b) => Math.hypot(a.x-p.x,a.y-p.y) - Math.hypot(b.x-p.x,b.y-p.y))[0]; if (cand) assign(cand.id, cardOpen.i); }
  else if (act === 'reset1'){ resetArm = true; }
  else if (act === 'reset2'){ hardReset(); return; }
  save();
  renderCard(true);
});
addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

// ───────────────────────── input
function hit(x, y){
  for (const r of [...R].sort((a,b) => b.y - a.y)){ if (Math.abs(x - r.x) < 20*SC && y < r.y + 10*SC && y > r.y - 60*SC) return ['robot', r.id]; }
  if (truck.st !== 'away' && x > truck.x - 88*SC && x < truck.x + 76*SC && y > L.lane - 56*SC && y < L.lane + 8*SC) return ['sign'];
  if (x > L.bin.x - 44*SC && x < L.bin.x + (S.metalSlot ? 80 : 44)*SC && y > L.bin.y - 64*SC && y < L.bin.y + 8*SC) return ['bin'];
  if (Math.abs(x - L.sign.x) < 30*SC && y > L.sign.y - 74*SC && y < L.sign.y + 6*SC) return ['sign'];
  if (Math.abs(x - L.shed.x) < 58*SC && y > L.shed.y - 98*SC && y < L.shed.y + 8*SC) return ['shed'];
  for (let i=0;i<L.spots.length;i++){ const p = L.spots[i], built = S.miners.includes(i); if (Math.abs(x - p.x) < 40*SC && y > p.y - (built ? 72 : 30)*SC && y < p.y + 22*SC) return ['spot', i]; }
  return null;
}
cv.addEventListener('pointerdown', e => {
  const h = hit(e.clientX, e.clientY);
  if (h){ if (cardOpen && cardOpen.kind === h[0] && cardOpen.i === h[1]) closeCard(); else openCard(h[0], h[1]); return; }
  closeCard();
  // a little puff of wind where you tap
  const x = e.clientX, y = e.clientY;
  parts.push({ k:'ring', x, y, r0: 4, r1: 46*SC, life: 0.5, t: 0 });
  for (const l of leaves){ if (l.st !== 'ground') continue; const dx = l.x - x, dy = l.y - y, d = Math.hypot(dx, dy); if (d < 60*SC && d > 0.1){ const f = (1 - d/(60*SC))*160*SC; l.kx += dx/d*f; l.ky += dy/d*f*0.7; } }
});
cv.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; cv.style.cursor = hit(e.clientX, e.clientY) ? 'pointer' : 'default'; });

// ───────────────────────── toast
let toastTimer = 0;
function showToast(main, small, secs){ const t = $('toast'); t.innerHTML = main + (small ? '<small>' + small + '</small>' : ''); t.hidden = false; t.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.hidden = true, 700); }, secs*1000); }

// ───────────────────────── save / load
const KEY = 'leaf-yard-save-v1';
let simMode = false;
const PARAMS = new URLSearchParams(location.search);
const TIME_SCALE = clamp(+PARAMS.get('speed') || 1, 0.25, 20);
function save(){ if (simMode || PARAMS.has('fresh')) return; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function merge(base, src){ for (const k in src){ if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k]) && base[k] && typeof base[k] === 'object') merge(base[k], src[k]); else if (k in base) base[k] = src[k]; } return base; }
function load(data){
  let src = data && data.S;
  if (!src && !PARAMS.has('fresh')){ try { const raw = localStorage.getItem(KEY); if (raw) src = JSON.parse(raw); } catch(e){} }
  if (src && src.v === 1){ S = merge(freshState(), src); }
}
function hardReset(){
  try { localStorage.removeItem(KEY); } catch(e){}
  S = freshState(); R = []; parts = []; pops = []; dispCash = 0; truck.st = 'away'; truck.fill = 0;
  for (const l of leaves) l.claim = null;
  closeCard(); syncRobots();
}
setInterval(save, 5000);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

// ───────────────────────── loop
let last = 0;
function frame(ts){
  const dt = Math.min(0.05, (ts - last)/1000 || 0.016); last = ts;
  const n = Math.ceil(TIME_SCALE);
  for (let i=0;i<n;i++) step(dt*TIME_SCALE/n);
  updHud(dt);
  if (cardOpen) renderCard(false);
  draw();
  requestAnimationFrame(frame);
}

// headless pacing simulation (used for balancing)
window.__leafYard = {
  sim(seconds, opts){
    opts = opts || {};
    simMode = true; const keep = S; S = freshState(); R = []; truck.st = 'away'; parts = []; pops = [];
    leaves = leaves.filter(l => l.st === 'ground'); for (const l of leaves) l.claim = null;
    const log = [], dtS = 1/20; let next = 0;
    for (let t=0; t<seconds; t+=dtS){
      step(dtS);
      if (S.t >= next){
        next = S.t + 1;
        let o = offers().filter(x => !x.maxed);
        if (opts.priority){ const pr = o.filter(x => x.id === 'robot' || x.id === 'metalSlot' || x.id === 'miner'); if (pr.length){ pr.sort((a,b)=>a.cost-b.cost); o = pr.slice(0, 1).concat(o.filter(x => x.cost < pr[0].cost*0.15)); } }
        o = o.filter(x => x.cost <= S.cash).sort((a,b) => a.cost - b.cost);
        if (o.length){ buy(o[0]); log.push(Math.round(S.t) + 's ' + (o[0].key || o[0].id) + ' $' + o[0].cost); }
      }
      if (Math.abs(S.t % 60) < dtS/2) log.push('@' + Math.round(S.t) + ' leaves=' + S.totals.leaves + ' metal=' + S.totals.metal + ' earned=' + S.totals.cash.toFixed(2));
    }
    const out = { log, t:S.t, cash:S.cash, lv:S.lv, robots:S.robots.length, miners:S.miners.length, totals:S.totals, jobs:S.robots.map(r=>r.job) };
    S = keep; simMode = false; R = []; syncRobots();
    return out;
  },
  state: () => S,
  dbg: () => ({ R: R.map(r => ({st:r.st,x:r.x,y:r.y,cl:r.carryL})), ground: leaves.filter(l=>l.st==='ground').length, coll: leaves.filter(l=>l.st==='ground'&&l.collect).length, fall: leaves.filter(l=>l.st==='fall').length, L }),
};

function start(data){
  load(data);
  layout();
  syncRobots();
  for (let i=0;i<46;i++) spawnLeaf(true, true);
  for (let i=0;i<10;i++){ const l = spawnLeaf(false, false); l.y = rand(-20, l.ly); }
  dispCash = S.cash;
  addEventListener('resize', layout);
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) { try { window.claude.hot.snapshot(() => ({ S })); } catch(e){} }
  requestAnimationFrame(ts => { last = ts; requestAnimationFrame(frame); });
}
const go = () => window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
if (document.fonts && document.fonts.load) Promise.race([Promise.all([document.fonts.load('700 16px Caveat'), document.fonts.load('700 14px "Baloo 2"')]), new Promise(r => setTimeout(r, 1500))]).then(go, go);
else go();
})();

</script>
