<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AutumNation · Wildflower prairie</title>
<meta name="description" content="A cozy autumn idle game: robots rake leaves, keep bees, mine metal and grow the yard.">
<meta name="application-name" content="AutumNation">
<meta name="apple-mobile-web-app-title" content="AutumNation">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6c7a37">
<link rel="icon" href="favicon.ico?v=3" sizes="any">
<link rel="icon" href="icons/favicon-32.png?v=3" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
<link rel="manifest" href="manifest.webmanifest?v=5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Caveat:wght@600;700&display=swap">
<link rel="stylesheet" href="style.css">
<script>
// Locations: test copies of the game live in their own folders, public/locationN/ (each a full copy of index.html,
// style.css, audio.js and game.js). At the root, ?location2 (or ?location2/) opens public/location2/, passing the other
// options along (?location2&fresh -> location2/?fresh). If that folder doesn't exist, the normal game just starts.
// Inside a copy this only names the location (window.LOCATION, which keeps its save apart) and points the icons at the
// root, so a copy needs no edits: copy the folder (or the four root files) to public/location3/ and open ?location3.
(function(){
  var here = location.pathname.match(/\/(location\d+)\/(?:index\.html)?$/i);
  window.LOCATION = here ? here[1].toLowerCase() : '';
  if (here){
    var links = document.querySelectorAll('link[rel~="icon"], link[rel="apple-touch-icon"], link[rel="manifest"]');
    for (var i = 0; i < links.length; i++) links[i].setAttribute('href', '../' + links[i].getAttribute('href'));
    return;
  }
  var loc = '', rest = [];
  location.search.slice(1).split('&').forEach(function(p){
    var m = p.match(/^(location\d+)\/?(=.*)?$/i);
    if (m && !loc) loc = m[1].toLowerCase(); else if (p) rest.push(p);
  });
  if (!loc) return;
  try {
    var x = new XMLHttpRequest();
    x.open('HEAD', loc + '/index.html', false); x.send();
    if (x.status >= 200 && x.status < 300){
      window.LOC_LEAVING = true;   // game.js stays idle while the browser moves on
      location.replace(loc + '/' + (rest.length ? '?' + rest.join('&') : '') + location.hash);
    }
  } catch (e) {}
})();
</script>
</head>
<body>
<canvas id="c" aria-label="AutumNation game area"></canvas>

<div id="hud" aria-live="polite">
  <div class="stat cash" id="hCash" title="Cash">
    <svg viewBox="-12 -12 24 24" aria-hidden="true"><circle r="10" fill="#c9922c"/><circle r="8.2" fill="#e8b84e"/><circle r="5.6" fill="none" stroke="#c9922c" stroke-width="1.3"/><path d="M-4.5,-3.5 A5.6,5.6 0 0 1 1,-5.4" stroke="#fbe3a0" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
    <span id="vCash">$0.00</span>
  </div>
  <!-- WILDFLOWER PRAIRIE test panel: pretend income from the first yard (AutumNation), for testing a second plot of land -->
  <div class="lp" id="locPanel">
    <div class="lpt">The Wildflower prairie</div>
    <label for="lpRange"><span>Income from AutumNation</span><b id="lpVal">$0/s</b></label>
    <input type="range" id="lpRange" min="0" max="1000" step="5" value="0">
  </div>
</div>

<div id="card" hidden role="dialog" aria-modal="false"></div>
<div id="toast" hidden></div>
<button id="soundBtn" hidden aria-label="Sound settings" title="Sound"><svg viewBox="-12 -12 24 24" aria-hidden="true"><path d="M-8.5,-3.2 H-4.5 L0.5,-7.5 V7.5 L-4.5,3.2 H-8.5 Z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><g class="sw" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3.8,-3.6 A5,5 0 0 1 3.8,3.6"/><path d="M6.4,-7 A9.6,9.6 0 0 1 6.4,7"/></g><g class="sx" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4.2,-3.4 L10,3.4 M10,-3.4 L4.2,3.4"/></g></svg></button>
<button id="fsBtn" hidden aria-label="Full screen" title="Full screen (F)"><svg viewBox="-12 -12 24 24" aria-hidden="true"><g class="fs-in" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-8,-3 V-8 H-3 M3,-8 H8 V-3 M8,3 V8 H3 M-3,8 H-8 V3"/></g><g class="fs-out" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-8,-3 H-3 V-8 M3,-8 V-3 H8 M8,3 H3 V8 M-3,8 V3 H-8"/></g></svg></button>
<button id="recenter" hidden aria-label="Back to the yard" title="Back to the yard (Home)"><svg viewBox="-12 -12 24 24" aria-hidden="true"><circle r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><circle r="2" fill="currentColor"/><path d="M0,-11 V-7 M0,7 V11 M-11,0 H-7 M7,0 H11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>

<script src="audio.js"></script>
<script src="game.js"></script>
<script>
// installable app + offline play (needs https or localhost); registered from the root only, its scope covers the location copies too
if (!window.LOCATION && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
